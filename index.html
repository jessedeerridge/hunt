<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>360° Hunt</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  z-index:1;
}

#character{
  position:fixed;
  left:50%;
  top:52%;
  width:100px;
  height:100px;

  display:none;
  align-items:center;
  justify-content:center;

  font-size:76px;

  transform:translate(-50%,-50%);
  transform-origin:center;

  filter:drop-shadow(0 7px 7px #0009);

  pointer-events:none;
  z-index:10;

  will-change:left,top,transform;
}


/* =========================
   HP
========================= */

#hpPanel{
  position:fixed;

  top:calc(18px + env(safe-area-inset-top));
  left:50%;

  transform:translateX(-50%);

  width:min(82vw,380px);

  z-index:30;

  display:none;
}

#hpTitle{
  margin-bottom:6px;

  color:white;

  font-size:13px;
  font-weight:800;

  text-shadow:0 2px 5px black;
}

#hpBack{
  height:15px;

  overflow:hidden;

  border:2px solid white;
  border-radius:20px;

  background:#0009;
}

#hpBar{
  width:100%;
  height:100%;

  background:white;

  transition:width .1s;
}


/* =========================
   LOCK
========================= */

#lockRing{
  position:fixed;

  left:50%;
  top:52%;

  width:180px;
  height:180px;

  transform:translate(-50%,-50%);

  border:5px solid #66f5ff;
  border-radius:50%;

  box-shadow:
    0 0 30px #66f5ff,
    inset 0 0 30px #66f5ff55;

  display:none;

  pointer-events:none;

  z-index:8;
}

#lockTime{
  position:fixed;

  left:50%;
  top:calc(52% + 115px);

  transform:translateX(-50%);

  display:none;

  color:white;

  font-size:32px;
  font-weight:900;

  text-shadow:0 3px 8px black;

  z-index:30;
}


/* =========================
   MESSAGE
========================= */

#message{
  position:fixed;

  left:50%;
  top:23%;

  transform:translate(-50%,-50%);

  display:none;

  color:white;

  font-size:25px;
  font-weight:900;

  text-align:center;

  text-shadow:0 3px 10px black;

  white-space:nowrap;

  z-index:40;
}


/* =========================
   DEBUG
========================= */

#debug{
  position:fixed;

  right:10px;

  bottom:
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  padding:10px 12px;

  border-radius:10px;

  background:#000a;

  color:white;

  font-family:monospace;
  font-size:11px;

  line-height:1.6;

  display:none;

  z-index:60;

  pointer-events:none;
}


/* =========================
   START
========================= */

#startScreen{
  position:fixed;
  inset:0;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  padding:30px;

  background:
    radial-gradient(
      circle at 50% 30%,
      #353535,
      #111 55%,
      #000
    );

  color:white;

  text-align:center;

  z-index:100;
}

#startScreen h1{
  margin:8px 0 12px;

  font-size:31px;
}

#startScreen p{
  max-width:420px;

  margin:0;

  opacity:.75;

  font-size:14px;

  line-height:1.8;
}

#startButton{
  min-width:260px;

  margin-top:28px;

  padding:18px 30px;

  border:0;

  border-radius:100px;

  background:white;

  color:#111;

  font-size:18px;

  font-weight:900;
}

#startButton:active{
  transform:scale(.96);
}

#error{
  margin-top:20px;

  color:#ff9999;

  font-size:13px;

  white-space:pre-line;
}

</style>
</head>

<body>


<!-- CAMERA -->

<video
  id="camera"
  autoplay
  muted
  playsinline
  webkit-playsinline>
</video>


<!-- CHARACTER -->

<div id="character">
  👾
</div>


<!-- LOCK -->

<div id="lockRing"></div>

<div id="lockTime">
  6.0
</div>


<!-- HP -->

<div id="hpPanel">

  <div id="hpTitle">
    👾 HP
    <span id="hpNumber">
      100
    </span>
    / 100
  </div>

  <div id="hpBack">
    <div id="hpBar"></div>
  </div>

</div>


<!-- MESSAGE -->

<div id="message"></div>


<!-- DEBUG -->

<div id="debug">

PHONE:
<span id="phoneDebug">0</span>°

<br>

ENEMY:
<span id="enemyDebug">0</span>°

<br>

DIFF:
<span id="diffDebug">0</span>°

<br>

VISIBLE:
<span id="visibleDebug">NO</span>

<br>

STATE:
<span id="stateDebug">SEARCH</span>

<br>

SENSOR:
<span id="sensorDebug">---</span>

</div>


<!-- START -->

<div id="startScreen">

  <div style="font-size:72px">
    📱 👾
  </div>

  <h1>
    360° HUNT
  </h1>

  <p>
    👾は周囲360°の
    どこかに出現します。
    <br><br>

    スマホを実際に回して
    周囲を探してください。
    <br><br>

    👾が画面内にいる状態で
    スマホを振ると拘束できます。
    <br><br>

    HPを0にすると捕獲成功。
  </p>

  <button id="startButton">
    HUNT START
  </button>

  <div id="error"></div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const camera =
document.getElementById("camera");

const character =
document.getElementById("character");

const hpPanel =
document.getElementById("hpPanel");

const hpBar =
document.getElementById("hpBar");

const hpNumber =
document.getElementById("hpNumber");

const lockRing =
document.getElementById("lockRing");

const lockTime =
document.getElementById("lockTime");

const message =
document.getElementById("message");

const startScreen =
document.getElementById("startScreen");

const startButton =
document.getElementById("startButton");

const errorBox =
document.getElementById("error");

const debug =
document.getElementById("debug");

const phoneDebug =
document.getElementById("phoneDebug");

const enemyDebug =
document.getElementById("enemyDebug");

const diffDebug =
document.getElementById("diffDebug");

const visibleDebug =
document.getElementById("visibleDebug");

const stateDebug =
document.getElementById("stateDebug");

const sensorDebug =
document.getElementById("sensorDebug");


/* =====================================================
   SETTINGS
===================================================== */


/*
 カメラの水平視野角。

 実際の値は端末・レンズによって違う。
*/

const FOV = 68;


/*
 HP
*/

const MAX_HP = 100;


/*
 LOCK中のダメージ
*/

const DAMAGE_PER_SECOND = 10;


/*
 振り判定
*/

const SHAKE_THRESHOLD = 10;


/*
 キャラ逃走速度

 前版より控えめ
*/

const ESCAPE_MIN_SPEED = 16;

const ESCAPE_MAX_SPEED = 28;


/*
 1回の逃走距離

 最大160°
*/

const ESCAPE_MIN_DISTANCE = 55;

const ESCAPE_MAX_DISTANCE = 160;


/*
 LOCK
*/

const MIN_LOCK_SECONDS = 1.5;

const MAX_LOCK_SECONDS = 6;


/*
 センサー平滑化

 0 = 全く動かない
 1 = 生値そのまま

 0.25前後が安定
*/

const HEADING_SMOOTH = 0.28;


/* =====================================================
   GAME STATE
===================================================== */

let stream = null;

let gameRunning = false;


/*
 スマホの絶対方位
 0〜360
*/

let phoneHeading = 0;


/*
 センサーが初期化されたか
*/

let headingReady = false;


/*
 センサー方式

 compass / alpha
*/

let sensorMode = "";


/*
 キャラの世界方位
 0〜360
*/

let enemyHeading = 0;


/*
 HP
*/

let hp = MAX_HP;


/*
 画面内
*/

let enemyVisible = false;


/*
 一度発見されたか
*/

let discovered = false;


/*
 逃走中か
*/

let escaping = false;


/*
 逃走方向

 +1 = 方位角が増える方向
 -1 = 方位角が減る方向
*/

let escapeDirection = 1;


/*
 逃走速度
*/

let escapeSpeed = 0;


/*
 今回の逃走距離
*/

let escapeTargetDistance = 0;


/*
 逃走済み距離
*/

let escapeTravelled = 0;


/*
 LOCK
*/

let locked = false;

let lockEnd = 0;


/*
 SHAKE
*/

let lastShakeTime = 0;


/*
 LOOP
*/

let lastFrameTime =
performance.now();


/* =====================================================
   ANGLE FUNCTIONS
===================================================== */


/*
 0〜360にする
*/

function normalizeAngle(angle){

  angle %= 360;

  if(angle < 0){
    angle += 360;
  }

  return angle;

}


/*
 target が current に対して
 どちらに何度あるか。

 戻り値：
 -180〜+180
*/

function shortestAngleDifference(
  target,
  current
){

  let diff =
    normalizeAngle(target)
    -
    normalizeAngle(current);


  if(diff > 180){
    diff -= 360;
  }


  if(diff < -180){
    diff += 360;
  }


  return diff;

}


/*
 角度用スムージング。

 359 → 0 の境界でも
 正しく補間する。
*/

function smoothAngle(
  current,
  target,
  amount
){

  const difference =
    shortestAngleDifference(
      target,
      current
    );


  return normalizeAngle(
    current +
    difference *
    amount
  );

}


/* =====================================================
   RANDOM
===================================================== */

function random(min,max){

  return (
    Math.random() *
    (max-min)
    +
    min
  );

}


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
"click",
async()=>{

  try{

    errorBox.textContent = "";


    /* =================================================
       1. ORIENTATION PERMISSION

       iPhoneでは必ずユーザー操作直後
    ================================================= */

    if(
      typeof DeviceOrientationEvent !==
      "undefined"

      &&

      typeof
      DeviceOrientationEvent.requestPermission
      ===
      "function"
    ){

      const permission =
        await
        DeviceOrientationEvent
        .requestPermission();


      if(permission !== "granted"){

        throw new Error(
          "方向センサーへのアクセスが許可されませんでした。"
        );

      }

    }


    /* =================================================
       2. MOTION PERMISSION
    ================================================= */

    if(
      typeof DeviceMotionEvent !==
      "undefined"

      &&

      typeof
      DeviceMotionEvent.requestPermission
      ===
      "function"
    ){

      const permission =
        await
        DeviceMotionEvent
        .requestPermission();


      if(permission !== "granted"){

        throw new Error(
          "モーションセンサーへのアクセスが許可されませんでした。"
        );

      }

    }


    /* =================================================
       3. SENSOR
    ================================================= */

    window.addEventListener(
      "deviceorientation",
      orientationHandler,
      true
    );


    window.addEventListener(
      "devicemotion",
      motionHandler,
      {
        passive:true
      }
    );


    /* =================================================
       4. CAMERA
    ================================================= */

    if(
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "カメラを使用できません。HTTPSで開いてください。"
      );

    }


    stream =
      await
      navigator.mediaDevices
      .getUserMedia({

        audio:false,

        video:{

          facingMode:{
            ideal:"environment"
          }

        }

      });


    camera.srcObject =
      stream;


    camera.muted =
      true;


    camera.setAttribute(
      "playsinline",
      ""
    );


    await camera.play();


    /* =================================================
       GAME RESET
    ================================================= */

    headingReady =
      false;


    /*
     初期キャラ位置は
     360°完全ランダム
    */

    enemyHeading =
      random(
        0,
        360
      );


    hp =
      MAX_HP;


    discovered =
      false;


    escaping =
      false;


    locked =
      false;


    enemyVisible =
      false;


    escapeTravelled =
      0;


    updateHP();


    /* =================================================
       UI
    ================================================= */

    startScreen.style.display =
      "none";


    camera.style.display =
      "block";


    hpPanel.style.display =
      "block";


    /*
     デバッグしたい場合は
     "block" に変更
    */

    debug.style.display =
      "none";


    gameRunning =
      true;


    lastFrameTime =
      performance.now();


    requestAnimationFrame(
      gameLoop
    );

  }

  catch(error){

    console.error(error);


    errorBox.textContent =

      (error.name || "ERROR")

      +

      "\n\n"

      +

      (
        error.message
        ||
        String(error)
      );

  }

});


/* =====================================================
   ORIENTATION
===================================================== */

function orientationHandler(event){

  let heading = null;


  /*
   ==========================================
   iPhone Safari

   webkitCompassHeading

   0   = 北
   90  = 東
   180 = 南
   270 = 西
   ==========================================
  */

  if(
    typeof event.webkitCompassHeading
    ===
    "number"

    &&

    Number.isFinite(
      event.webkitCompassHeading
    )
  ){

    heading =
      event.webkitCompassHeading;


    sensorMode =
      "COMPASS";

  }


  /*
   ==========================================
   fallback

   alphaは座標系が違うので
   heading方向へ変換する。
   ==========================================
  */

  else if(
    event.alpha !== null

    &&

    Number.isFinite(
      event.alpha
    )
  ){

    heading =
      360 -
      event.alpha;


    sensorMode =
      "ALPHA";

  }


  if(heading === null){
    return;
  }


  heading =
    normalizeAngle(
      heading
    );


  /*
   最初の1回
  */

  if(!headingReady){

    phoneHeading =
      heading;


    headingReady =
      true;


    return;

  }


  /*
   急激なノイズを抑えながら
   角度を更新
  */

  phoneHeading =
    smoothAngle(
      phoneHeading,
      heading,
      HEADING_SMOOTH
    );

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time){

  if(!gameRunning){
    return;
  }


  let dt =
    (
      time -
      lastFrameTime
    )
    /
    1000;


  lastFrameTime =
    time;


  dt =
    Math.min(
      dt,
      0.05
    );


  /* =================================================
     LOCK
  ================================================= */

  if(locked){

    const remaining =
      lockEnd -
      time;


    /*
     HP damage
    */

    hp -=
      DAMAGE_PER_SECOND *
      dt;


    hp =
      Math.max(
        0,
        hp
      );


    updateHP();


    /* ===============================================
       CAPTURE COMPLETE
    =============================================== */

    if(hp <= 0){

      hp = 0;

      updateHP();


      locked =
        false;


      gameRunning =
        false;


      lockRing.style.display =
        "none";


      lockTime.style.display =
        "none";


      character.style.display =
        "flex";


      message.innerHTML =
        "🎉 CAPTURED!<br>👾 GET!";


      message.style.display =
        "block";


      return;

    }


    /* ===============================================
       LOCK END
    =============================================== */

    if(remaining <= 0){

      locked =
        false;


      lockRing.style.display =
        "none";


      lockTime.style.display =
        "none";


      message.textContent =
        "💨";


      message.style.display =
        "block";


      setTimeout(
        ()=>{

          if(!locked){

            message.style.display =
              "none";

          }

        },
        350
      );


      /*
       同じ場所から
       新しい方向へ逃げる
      */

      startEscape();

    }

    else{

      lockTime.textContent =
        (
          remaining /
          1000
        )
        .toFixed(1);

    }

  }


  /* =================================================
     ESCAPE
  ================================================= */

  else if(escaping){

    const amount =
      escapeSpeed *
      dt;


    /*
     一度決めた方向にだけ進む。

     途中で逆転しない。
    */

    enemyHeading =
      normalizeAngle(

        enemyHeading

        +

        escapeDirection *
        amount

      );


    escapeTravelled +=
      amount;


    /*
     最大160°以内で停止
    */

    if(
      escapeTravelled >=
      escapeTargetDistance
    ){

      escaping =
        false;

    }

  }


  /* =================================================
     WAIT FOR SENSOR
  ================================================= */

  if(!headingReady){

    character.style.display =
      "none";


    requestAnimationFrame(
      gameLoop
    );


    return;

  }


  /* =================================================
     WORLD → CAMERA

     enemyHeading:
     敵が世界のどの方角にいるか

     phoneHeading:
     カメラがどの方角を向いているか
  ================================================= */

  const difference =
    shortestAngleDifference(
      enemyHeading,
      phoneHeading
    );


  const halfFov =
    FOV /
    2;


  /*
   ==========================================
   SCREEN COORDINATE

   difference > 0
   → 敵はカメラより時計回り側
   → 画面右

   difference < 0
   → 画面左

   ★ここが前版からの重要修正
   ==========================================
  */

  enemyVisible =
    Math.abs(difference)
    <=
    halfFov;


  /* =================================================
     FIRST DISCOVERY
  ================================================= */

  if(
    enemyVisible
    &&
    !discovered
  ){

    discovered =
      true;


    /*
     見つかった瞬間から
     右か左へ逃げる
    */

    startEscape();

  }


  /* =================================================
     CHARACTER SCREEN POSITION
  ================================================= */

  if(enemyVisible){

    character.style.display =
      "flex";


    /*
     -1 = 左端
      0 = 中央
     +1 = 右端
    */

    const ratio =
      difference /
      halfFov;


    /*
     ★正しい符号

     敵が右方向なら
     screenX > 50
    */

    let screenX =
      50 +
      ratio *
      50;


    /*
     端ではキャラが
     少し切れる
    */

    screenX =
      Math.max(
        -5,
        Math.min(
          105,
          screenX
        )
      );


    character.style.left =
      screenX +
      "%";


    /*
     上下運動はごく小さく
    */

    const bob =
      Math.sin(
        time *
        0.003
      )
      *
      4;


    character.style.top =
      `calc(52% + ${bob}px)`;


    /*
     キャラの向き
    */

    let flip = 1;


    if(escaping){

      /*
       方位角が増える方向なら
       画面上では右向き
      */

      flip =
        escapeDirection > 0
        ?
        1
        :
        -1;

    }


    character.style.transform =
      `
      translate(-50%,-50%)
      scaleX(${flip})
      `;

  }

  else{

    /*
     LOCK中は画面から外れても
     捕獲した位置にいる扱いにしたいので、
     LOCK時だけ表示を維持する。
    */

    if(!locked){

      character.style.display =
        "none";

    }

  }


  /* =================================================
     DEBUG
  ================================================= */

  phoneDebug.textContent =
    phoneHeading.toFixed(1);


  enemyDebug.textContent =
    enemyHeading.toFixed(1);


  diffDebug.textContent =
    difference.toFixed(1);


  visibleDebug.textContent =
    enemyVisible
    ?
    "YES"
    :
    "NO";


  sensorDebug.textContent =
    sensorMode;


  if(locked){

    stateDebug.textContent =
      "LOCK";

  }

  else if(!discovered){

    stateDebug.textContent =
      "SEARCH";

  }

  else if(escaping){

    stateDebug.textContent =
      "ESCAPE";

  }

  else{

    stateDebug.textContent =
      "HIDE";

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================================
   ESCAPE START
===================================================== */

function startEscape(){

  discovered =
    true;


  escaping =
    true;


  escapeTravelled =
    0;


  /*
   ==========================================
   右 or 左

   50 : 50

   一度決めたら今回の逃走では
   絶対に逆行しない。
   ==========================================
  */

  escapeDirection =
    Math.random() < 0.5
    ?
    -1
    :
    1;


  /*
   速度
  */

  escapeSpeed =
    random(
      ESCAPE_MIN_SPEED,
      ESCAPE_MAX_SPEED
    );


  /*
   ==========================================
   逃走距離

   55〜160°

   360°一周してしまうことはない。
   ==========================================
  */

  escapeTargetDistance =
    random(
      ESCAPE_MIN_DISTANCE,
      ESCAPE_MAX_DISTANCE
    );

}


/* =====================================================
   MOTION / SHAKE
===================================================== */

function motionHandler(event){

  /*
   画面内全体が
   キャッチ範囲
  */

  if(
    !gameRunning
    ||
    !enemyVisible
    ||
    locked
  ){

    return;

  }


  const acceleration =
    event.accelerationIncludingGravity;


  if(!acceleration){
    return;
  }


  const x =
    acceleration.x || 0;

  const y =
    acceleration.y || 0;

  const z =
    acceleration.z || 0;


  const magnitude =
    Math.sqrt(
      x*x +
      y*y +
      z*z
    );


  /*
   重力成分を大まかに除く
  */

  const shake =
    Math.abs(
      magnitude -
      9.81
    );


  if(
    shake <
    SHAKE_THRESHOLD
  ){

    return;

  }


  const now =
    performance.now();


  /*
   多重判定防止
  */

  if(
    now -
    lastShakeTime
    <
    500
  ){

    return;

  }


  lastShakeTime =
    now;


  lockEnemy(
    shake
  );

}


/* =====================================================
   LOCK
===================================================== */

function lockEnemy(power){

  if(
    !enemyVisible
    ||
    locked
  ){

    return;

  }


  locked =
    true;


  /*
   捕まった瞬間
   逃走停止
  */

  escaping =
    false;


  /* =================================================
     SHAKE POWER → TIME

     1.5〜6秒
  ================================================= */

  let seconds =

    MIN_LOCK_SECONDS

    +

    (
      power -
      SHAKE_THRESHOLD
    )

    *
    0.35;


  seconds =
    Math.max(

      MIN_LOCK_SECONDS,

      Math.min(
        MAX_LOCK_SECONDS,
        seconds
      )

    );


  lockEnd =
    performance.now()
    +
    seconds *
    1000;


  message.textContent =
    "⚡ LOCK";


  message.style.display =
    "block";


  lockRing.style.display =
    "block";


  lockTime.style.display =
    "block";


  lockTime.textContent =
    seconds.toFixed(1);


  if(navigator.vibrate){

    navigator.vibrate(
      [
        70,
        40,
        120
      ]
    );

  }

}


/* =====================================================
   HP
===================================================== */

function updateHP(){

  hpNumber.textContent =
    Math.ceil(
      hp
    );


  hpBar.style.width =
    (
      hp /
      MAX_HP *
      100
    )
    +
    "%";

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

  if(!stream){
    return;
  }


  stream
  .getTracks()
  .forEach(
    track=>{
      track.stop();
    }
  );


  stream =
    null;

}


/* =====================================================
   PAGE CLOSE
===================================================== */

window.addEventListener(
  "pagehide",
  ()=>{

    gameRunning =
      false;


    stopCamera();

  }
);

</script>
