<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>360° AR Catch</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  z-index:1;
}

#character{
  position:fixed;
  left:50%;
  top:50%;
  width:105px;
  height:105px;
  transform:translate(-50%,-50%);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:80px;
  z-index:10;
  pointer-events:none;
  filter:drop-shadow(0 8px 8px #0009);
  will-change:left,top;
}

/* ======================
   HP
====================== */

#hpPanel{
  position:fixed;
  top:calc(18px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  width:min(82vw,380px);
  z-index:30;
  display:none;
}

#hpText{
  color:white;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
  text-shadow:0 2px 5px black;
}

#hpBack{
  height:15px;
  background:#0009;
  border:2px solid #fff;
  border-radius:20px;
  overflow:hidden;
}

#hpBar{
  height:100%;
  width:100%;
  background:#fff;
  transition:width .15s;
}

/* ======================
   DIRECTION
====================== */

#direction{
  position:fixed;
  top:calc(65px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  color:white;
  background:#0009;
  padding:8px 15px;
  border-radius:100px;
  display:none;
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
}

/* ======================
   MESSAGE
====================== */

#message{
  position:fixed;
  left:50%;
  top:25%;
  transform:translate(-50%,-50%);
  z-index:40;
  color:white;
  font-size:24px;
  font-weight:900;
  text-align:center;
  text-shadow:0 3px 10px #000;
  display:none;
  white-space:nowrap;
}

/* ======================
   LOCK
====================== */

#lockRing{
  position:fixed;
  left:50%;
  top:50%;
  width:170px;
  height:170px;
  transform:translate(-50%,-50%);
  border:6px solid #6ff;
  border-radius:50%;
  box-shadow:
    0 0 30px #6ff,
    inset 0 0 30px #6ff5;
  display:none;
  z-index:9;
  pointer-events:none;
}

#lockTime{
  position:fixed;
  left:50%;
  top:calc(50% + 105px);
  transform:translateX(-50%);
  color:white;
  font-size:32px;
  font-weight:900;
  z-index:30;
  display:none;
  text-shadow:0 3px 8px black;
}

/* ======================
   START
====================== */

#start{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:30px;
  color:white;
  text-align:center;
  background:
    radial-gradient(circle at 50% 30%,#343434,#111 55%,#000);
}

#startIcon{
  font-size:75px;
}

#start h1{
  margin:10px 0;
  font-size:30px;
}

#start p{
  line-height:1.8;
  opacity:.75;
  max-width:400px;
}

#startButton{
  border:0;
  margin-top:20px;
  padding:18px 32px;
  min-width:260px;
  border-radius:100px;
  background:white;
  color:#111;
  font-size:18px;
  font-weight:900;
}

#error{
  margin-top:20px;
  color:#ff9999;
  font-size:13px;
  white-space:pre-line;
}

</style>
</head>

<body>

<video
id="camera"
autoplay
muted
playsinline
webkit-playsinline>
</video>

<div id="character">👾</div>

<div id="lockRing"></div>

<div id="lockTime">6.0</div>

<div id="hpPanel">
  <div id="hpText">
    👾 HP <span id="hpNumber">100</span> / 100
  </div>

  <div id="hpBack">
    <div id="hpBar"></div>
  </div>
</div>

<div id="direction">
  SEARCHING...
</div>

<div id="message"></div>

<div id="start">

  <div id="startIcon">📱👾</div>

  <h1>360° HUNT</h1>

  <p>
    👾はあなたの周囲360°を逃げ回ります。
    <br><br>

    スマホを持って周囲を探してください。
    <br>
    画面に👾をとらえた状態で
    <strong>スマホを振る</strong>と拘束できます。
    <br><br>

    拘束してHPを0にすれば捕獲成功！
  </p>

  <button id="startButton">
    HUNT START
  </button>

  <div id="error"></div>

</div>


<script>

/* =========================================
   ELEMENT
========================================= */

const camera =
document.getElementById("camera");

const character =
document.getElementById("character");

const hpPanel =
document.getElementById("hpPanel");

const hpBar =
document.getElementById("hpBar");

const hpNumber =
document.getElementById("hpNumber");

const directionUI =
document.getElementById("direction");

const message =
document.getElementById("message");

const lockRing =
document.getElementById("lockRing");

const lockTime =
document.getElementById("lockTime");

const start =
document.getElementById("start");

const startButton =
document.getElementById("startButton");

const errorBox =
document.getElementById("error");


/* =========================================
   GAME STATE
========================================= */

/*
 キャラの方角

 0〜360°
*/

let enemyAngle = 0;


/*
 スマホが向いている方角
*/

let phoneAngle = 0;


/*
 キャラが移動する角速度
*/

let enemySpeed = 0;


/*
 HP
*/

let hp = 100;


/*
 ロック
*/

let locked = false;

let lockEnd = 0;

let lastFrame =
performance.now();

let nextEscapeChange = 0;

let enemyVisible = false;

let lastShake = 0;

let stream;


/* =========================================
   SETTINGS
========================================= */

/*
 カメラの水平視野角を
 おおよそ65°として扱う
*/

const FOV = 65;


/*
 HP
*/

const MAX_HP = 100;


/*
 拘束中の毎秒ダメージ
*/

const DAMAGE_PER_SECOND = 10;


/*
 最大拘束時間
*/

const MAX_LOCK = 6000;


/*
 振った判定
*/

const SHAKE_THRESHOLD = 10;


/* =========================================
   UTIL
========================================= */

function random(min,max){

  return (
    Math.random() *
    (max-min)
    +
    min
  );

}


/*
 角度を0〜360へ
*/

function normalizeAngle(angle){

  angle %= 360;

  if(angle < 0){
    angle += 360;
  }

  return angle;

}


/*
 -180〜180の差を返す
*/

function angleDifference(a,b){

  let diff =
  normalizeAngle(a)
  -
  normalizeAngle(b);

  if(diff > 180){
    diff -= 360;
  }

  if(diff < -180){
    diff += 360;
  }

  return diff;

}


/* =========================================
   START
========================================= */

startButton.addEventListener(
"click",
async()=>{

  try{

    errorBox.textContent="";


    /* =====================================
       ORIENTATION PERMISSION

       ★ユーザー操作直後
    ===================================== */

    if(
      typeof DeviceOrientationEvent !==
      "undefined"
      &&
      typeof DeviceOrientationEvent
      .requestPermission ===
      "function"
    ){

      const result =
      await DeviceOrientationEvent
      .requestPermission();

      if(result !== "granted"){

        throw new Error(
          "方向センサーが許可されませんでした。"
        );

      }

    }


    /* =====================================
       MOTION PERMISSION
    ===================================== */

    if(
      typeof DeviceMotionEvent !==
      "undefined"
      &&
      typeof DeviceMotionEvent
      .requestPermission ===
      "function"
    ){

      const result =
      await DeviceMotionEvent
      .requestPermission();

      if(result !== "granted"){

        throw new Error(
          "モーションセンサーが許可されませんでした。"
        );

      }

    }


    /* =====================================
       EVENTS
    ===================================== */

    window.addEventListener(
      "deviceorientation",
      orientationHandler,
      true
    );

    window.addEventListener(
      "devicemotion",
      motionHandler,
      {passive:true}
    );


    /* =====================================
       CAMERA
    ===================================== */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "カメラを使用できません。HTTPSで開いてください。"
      );

    }


    stream =
    await navigator.mediaDevices
    .getUserMedia({

      audio:false,

      video:{
        facingMode:{
          ideal:"environment"
        }
      }

    });


    camera.srcObject =
    stream;

    camera.muted=true;

    camera.setAttribute(
      "playsinline",
      ""
    );

    await camera.play();


    /* =====================================
       GAME START
    ===================================== */

    start.style.display="none";

    camera.style.display="block";

    hpPanel.style.display="block";

    directionUI.style.display="block";


    /*
      最初は適当な方向に出現
    */

    enemyAngle =
    random(40,320);


    hp=MAX_HP;

    updateHP();


    chooseEscape();


    lastFrame =
    performance.now();


    requestAnimationFrame(
      gameLoop
    );

  }

  catch(error){

    console.error(error);

    errorBox.textContent =
    (error.name || "") +
    "\n" +
    (error.message || error);

  }

});


/* =========================================
   PHONE DIRECTION
========================================= */

function orientationHandler(event){

  /*
   iOS Safariでは
   webkitCompassHeading が利用できる場合がある
  */

  if(
    typeof event.webkitCompassHeading ===
    "number"
  ){

    phoneAngle =
    event.webkitCompassHeading;

  }

  else if(
    event.alpha !== null
  ){

    /*
     Android等
    */

    phoneAngle =
    360-event.alpha;

  }

}


/* =========================================
   ENEMY ESCAPE
========================================= */

function chooseEscape(){

  /*
   時計回り / 反時計回り
  */

  const direction =
  Math.random() < .5
  ? -1
  : 1;


  /*
   角速度

   45〜120°/秒
  */

  enemySpeed =
  direction *
  random(
    45,
    120
  );


  /*
   0.25〜1秒で
   また行動変更
  */

  nextEscapeChange =
  performance.now()
  +
  random(
    250,
    1000
  );

}


/* =========================================
   GAME LOOP
========================================= */

function gameLoop(time){

  let dt =
  (time-lastFrame)/1000;

  lastFrame=time;

  dt =
  Math.min(dt,.05);


  /* =====================================
     LOCK
  ===================================== */

  if(locked){

    const remaining =
    lockEnd-time;


    /*
      HPを削る
    */

    hp -=
    DAMAGE_PER_SECOND *
    dt;


    hp =
    Math.max(
      0,
      hp
    );


    updateHP();


    /* ===================================
       DEFEATED
    =================================== */

    if(hp <= 0){

      locked=false;

      hp=0;

      updateHP();


      character.style.display=
      "flex";


      lockRing.style.display=
      "none";

      lockTime.style.display=
      "none";


      message.innerHTML =
      "🎉 CAPTURED!<br>👾 GET!";

      message.style.display=
      "block";


      return;

    }


    /* ===================================
       LOCK END
    =================================== */

    if(remaining <= 0){

      locked=false;

      lockRing.style.display=
      "none";

      lockTime.style.display=
      "none";


      message.textContent=
      "💨 ESCAPE!";

      message.style.display=
      "block";


      setTimeout(()=>{

        if(!locked){

          message.style.display=
          "none";

        }

      },600);


      /*
       拘束解除後
       一気に逃げる
      */

      chooseEscape();

      enemySpeed *=1.4;

    }

    else{

      lockTime.textContent =
      (
        remaining/1000
      ).toFixed(1);

    }

  }


  /* =====================================
     ENEMY MOVEMENT
  ===================================== */

  else{

    if(
      time >
      nextEscapeChange
    ){

      chooseEscape();

    }


    enemyAngle +=
    enemySpeed *
    dt;


    enemyAngle =
    normalizeAngle(
      enemyAngle
    );

  }


  /* =====================================
     ENEMY VS CAMERA
  ===================================== */

  const diff =
  angleDifference(
    enemyAngle,
    phoneAngle
  );


  const halfFOV =
  FOV/2;


  /*
   画面内判定
  */

  enemyVisible =
  Math.abs(diff)
  <
  halfFOV;


  /* =====================================
     CHARACTER DISPLAY
  ===================================== */

  if(enemyVisible){

    character.style.display=
    "flex";


    /*
     diffから画面X位置へ変換

     -FOV/2 → 左端
      0     → 中央
     +FOV/2 → 右端
    */

    const normalized =
    diff /
    halfFOV;


    /*
     左右を反転
    */

    let screenX =
    50
    -
    normalized*50;


    screenX =
    Math.max(
      3,
      Math.min(
        97,
        screenX
      )
    );


    character.style.left =
    screenX+"%";


    /*
     少し上下にも動かして
     生き物感を出す
    */

    const bob =
    Math.sin(
      time*.008
    )*18;


    character.style.top =
    `calc(50% + ${bob}px)`;


    directionUI.textContent =
    "⚡ TARGET IN VIEW";


    /*
     画面内全部が
     キャッチ範囲
    */

  }

  else{

    character.style.display=
    "none";


    /* ===================================
       どちら側にいるか表示
    =================================== */

    if(diff > 0){

      directionUI.textContent =
      "👾 ← TURN LEFT";

    }

    else{

      directionUI.textContent =
      "TURN RIGHT → 👾";

    }

  }


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================
   SHAKE
========================================= */

function motionHandler(event){

  if(
    !enemyVisible ||
    locked
  ){
    return;
  }


  const a =
  event.accelerationIncludingGravity;

  if(!a){
    return;
  }


  const x =
  a.x || 0;

  const y =
  a.y || 0;

  const z =
  a.z || 0;


  const magnitude =
  Math.sqrt(
    x*x +
    y*y +
    z*z
  );


  const shake =
  Math.abs(
    magnitude -
    9.81
  );


  if(
    shake >
    SHAKE_THRESHOLD
  ){

    const now =
    performance.now();


    if(
      now-lastShake
      <
      500
    ){
      return;
    }


    lastShake=now;


    lockEnemy(
      shake
    );

  }

}


/* =========================================
   LOCK
========================================= */

function lockEnemy(power){

  if(
    !enemyVisible ||
    locked
  ){
    return;
  }


  locked=true;


  /*
   振りの強さ

   約1.5〜6秒
  */

  let seconds =

  1.5

  +

  (
    power -
    SHAKE_THRESHOLD
  )

  *.35;


  seconds =
  Math.max(
    1.5,
    Math.min(
      6,
      seconds
    )
  );


  lockEnd =
  performance.now()
  +
  seconds*1000;


  enemySpeed=0;


  message.textContent =
  "⚡ CAPTURE!";


  message.style.display=
  "block";


  lockRing.style.display=
  "block";


  lockTime.style.display=
  "block";


  lockTime.textContent =
  seconds.toFixed(1);


  if(navigator.vibrate){

    navigator.vibrate(
      [80,40,120]
    );

  }

}


/* =========================================
   HP
========================================= */

function updateHP(){

  hpNumber.textContent =
  Math.ceil(hp);


  const percent =
  (
    hp /
    MAX_HP
  )*100;


  hpBar.style.width =
  percent+"%";

}

</script>

</body>
</html>
