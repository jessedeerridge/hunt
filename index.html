*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:monospace;
}

/* =========================================================
   NORMAL CAMERA
========================================================= */

#camera{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:0;

  background:#000;

  display:none;
}

/* =========================================================
   PIXEL CAMERA
========================================================= */

#world{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  z-index:0;

  background:#000;

  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

/* =========================================================
   CHARACTER LAYER
========================================================= */

#game{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  z-index:2;

  pointer-events:none;

  image-rendering:pixelated;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:fixed;
  inset:0;

  z-index:10;

  display:none;

  pointer-events:none;
}

/* HP */

#hp{
  position:absolute;

  top:calc(15px + env(safe-area-inset-top));

  left:50%;

  transform:translateX(-50%);

  width:min(82vw,380px);
}

#hpText{
  color:#fff;

  font-size:13px;

  font-weight:900;

  text-shadow:
    2px 2px 0 #000;
}

#hpOuter{
  height:17px;

  margin-top:5px;

  border:3px solid #fff;

  background:#111;

  box-shadow:
    3px 3px 0 #000;
}

#hpInner{
  width:100%;
  height:100%;

  background:#fff;
}

/* LOCK */

#lock{
  position:absolute;

  top:19%;
  left:50%;

  transform:
    translate(-50%,-50%);

  display:none;

  padding:
    9px 15px;

  background:#111;

  border:3px solid #fff;

  box-shadow:
    4px 4px 0 #000;

  color:#fff;

  font-size:22px;

  font-weight:900;
}

/* TIMER */

#timer{
  position:absolute;

  bottom:17%;

  left:50%;

  transform:
    translateX(-50%);

  display:none;

  padding:
    6px 12px;

  background:#111;

  border:3px solid #fff;

  box-shadow:
    4px 4px 0 #000;

  color:#fff;

  font-size:30px;

  font-weight:900;
}

/* SENSOR */

#sensorWait{
  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  display:none;

  padding:
    10px 17px;

  background:#111;

  border:3px solid #fff;

  color:#fff;

  font-weight:900;
}

/* DEBUG */

#debug{
  position:absolute;

  right:6px;
  bottom:6px;

  padding:
    6px 8px;

  background:
    rgba(0,0,0,.68);

  border:
    2px solid #fff;

  color:#fff;

  font-size:9px;

  line-height:1.5;
}

/* =========================================================
   MODE SWITCH
========================================================= */

#modeSwitch{
  position:absolute;

  left:50%;

  bottom:
    calc(
      25px +
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  padding:5px;

  background:
    rgba(0,0,0,.68);

  border:
    2px solid #fff;

}

#modeSwitch button{
  min-width:90px;

  border:0;

  padding:
    10px 16px;

  background:transparent;

  color:#fff;

  font-family:monospace;

  font-size:12px;

  font-weight:900;

  cursor:pointer;
}

#modeSwitch button.active{
  background:#fff;

  color:#111;
}

/* =========================================================
   START
========================================================= */

#start{
  position:fixed;
  inset:0;

  z-index:100;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  padding:30px;

  background:#161925;

  color:#fff;

  text-align:center;
}

#startIcon{
  font-size:72px;
}

#start h1{
  margin:

}

#start p{

  font-size:13px;

  opacity:.85;
}

#startButton{

  padding:

  border:
    3px solid #fff;

  background:#fff;

  color:#111;

  box-shadow:
    6px 6px 0 #000;

#error{

  font-size:12px;

}

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const camera =
  document.getElementById("camera");


const world =
  document.getElementById("world");


const wctx =
  world.getContext(
    "2d",
    {
      alpha:false
    }
  );


const game =
  document.getElementById("game");


const ctx =
  game.getContext("2d");


const start =
  document.getElementById("start");


const startButton =
  document.getElementById("startButton");


const error =
  document.getElementById("error");


const hud =
  document.getElementById("hud");


const hpNumber =
  document.getElementById("hpNumber");


const hpInner =
  document.getElementById("hpInner");


const lockText =
  document.getElementById("lock");


const timer =
  document.getElementById("timer");


const debug =

const sensorWait =
  document.getElementById("sensorWait");

const cameraModeButton =
  document.getElementById("cameraMode");


/* =========================================================
   SCREEN
========================================================= */

let W =
  innerWidth;


let H =
  innerHeight;


let DPR =
  1;


function resize(){

  W =
    innerWidth;


  H =
    innerHeight;


  DPR =
    Math.min(
      devicePixelRatio || 1,
      2
    );


  game.width =
    Math.round(
      W * DPR
    );


  game.height =
    Math.round(
      H * DPR
    );


  game.style.width =
    W + "px";


  game.style.height =
    H + "px";


  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  ctx.imageSmoothingEnabled =
    false;
}


addEventListener(
  "resize",
  resize
);


resize();


/* =========================================================
   PIXEL SETTINGS

   ★今回 70

   40 = 超粗い
   60 = 粗い
   70 = 今回
   80 = 少し小さい
   100 = 細かい
========================================================= */

const PIXEL_WIDTH =
  90;


/* =========================================================
   PIXEL PROCESS CANVAS
========================================================= */

const rawCanvas =
  document.createElement("canvas");


const rawCtx =
  rawCanvas.getContext(
    "2d",
    {
      alpha:false
    }
  );


let pixelW =
  PIXEL_WIDTH;


let pixelH =
  100;

========================================================= */

}


pixelModeButton.addEventListener(

);


cameraModeButton.addEventListener(
  "click",
  ()=>{

      "camera"

/* =========================================================
   GAME SETTINGS
========================================================= */

const HFOV =
  68;


const VFOV =
  55;


const MAX_HP =
  100;


const DAMAGE_PER_SECOND =
  12;


/*
  振り判定
*/

const SHAKE_THRESHOLD =
  9;


/*
  ロック時間
*/

const MIN_LOCK =
  1.5;


const MAX_LOCK =
  6;


/*
  キャラクター逃走速度
*/

const ESCAPE_SPEED_MIN =
  7;


const ESCAPE_SPEED_MAX =
  11;


/*
  一度逃げる角度

  最低55°
  最大160°
*/

const ESCAPE_DISTANCE_MIN =
  55;


const ESCAPE_DISTANCE_MAX =
  160;


/*
  センサー補間
*/

const YAW_SMOOTH =
  .24;


const PITCH_SMOOTH =
  .20;


/* =========================================================
   CREATURE TYPES

   SKY
     少し上

   FRONT
     前

   EARTH
     少し下
========================================================= */

const CREATURE_ZONES = {

  SKY:{
    minPitch:20,
    maxPitch:34
  },


  FRONT:{
    minPitch:-6,
    maxPitch:6
  },


  EARTH:{
    minPitch:-34,
    maxPitch:-20
  }

};


/* =========================================================
   SENSOR
========================================================= */

let cameraYaw =
  0;


let cameraPitch =
  0;


let targetYaw =
  0;


let targetPitch =
  0;


let sensorReady =
  false;


/* =========================================================
   CREATURE
========================================================= */

let creatureZone =
  "FRONT";


let creatureYaw =
  0;


let creaturePitch =
  0;


let creatureBasePitch =
  0;


let creatureBobAmplitude =
  10;


let creatureBobPhase =
  0;


let creatureBobSpeed =
  1;


let creatureVisible =
  false;


let discovered =
  false;


let escaping =
  false;


let escapeDirection =
  1;


let escapeSpeed =
  0;


let escapeDistance =
  0;


let escapeTravel =
  0;


/* =========================================================
   GAME STATE
========================================================= */

let running =

let hp =

let locked =
  false;


let lockEnd =
  0;


let lastShake =
  0;


let lastTime =
  0;


/* =========================================================
   MATH
========================================================= */

function rad(v){

  return (
    v *
    Math.PI /
    180
  );
}


function deg(v){

  return (
    v *
    180 /
    Math.PI
  );
}


function clamp(
  v,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      v
    )
  );
}


function random(
  min,
  max
){

  return (
    Math.random()
    *
    (max-min)
    +
    min
  );
}


function normalize360(a){

  a %= 360;


  if(
    a < 0
  ){

    a += 360;
  }


  return a;
}


/*
  target と current の
  最短角度差を求める。

  359°と1°を358°差とせず
  2°差として扱う。
*/

function angleDiff(
  target,
  current
){

  let d =

    normalize360(
      target
    )

    -

    normalize360(
      current
    );


  if(
    d > 180
  ){

    d -= 360;
  }


  if(
    d < -180
  ){

    d += 360;
  }


  return d;
}


function smoothAngle(
  current,
  target,
  amount
){

  return normalize360(

    current

    +

    angleDiff(
      target,
      current
    )

    *

    amount
  );
}


/* =========================================================
   SPAWN
========================================================= */

function spawnCreature(){

  const types = [
    "SKY",
    "FRONT",
    "EARTH"
  ];


  /*
    属性ランダム
  */

  creatureZone =

    types[
      Math.floor(
        Math.random()
        *
        types.length
      )
    ];


  const zone =

    CREATURE_ZONES[
      creatureZone
    ];


  /*
    ★360°完全ランダム
  */

  creatureYaw =

    random(
      0,
      360
    );


  /*
    高さは属性から決定
  */

  creatureBasePitch =

    random(
      zone.minPitch,
      zone.maxPitch
    );


  creaturePitch =
    creatureBasePitch;


  /*
    画面上の上下揺れは
    5〜20pxだけ。
  */

  creatureBobAmplitude =

    random(
      5,
      20
    );


  creatureBobPhase =

    random(
      0,
      Math.PI * 2
    );


  creatureBobSpeed =

    random(
      .7,
      1.3
    );


  creatureVisible =
    false;


  discovered =
    false;


  escaping =
    false;
}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
"click",
async()=>{

  try{

    startButton.disabled =
      true;


    startButton.textContent =
      "STARTING...";


    error.textContent =
      "";


    /* =====================================================
       CAMERA
    ===================================================== */

    if(
      !navigator.mediaDevices

      ||

      !navigator.mediaDevices
        .getUserMedia
    ){

      throw new Error(
        "このブラウザではカメラを使用できません。"
      );
    }


    const stream =

      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            facingMode:{
              ideal:"environment"
            },


            width:{
              ideal:1920
            },


            height:{
              ideal:1080
            }

          },


          audio:false

        });


    camera.srcObject =
      stream;


    await camera.play();


    /* =====================================================
       iPhone / iPad
       ORIENTATION PERMISSION
    ===================================================== */

    if(
      typeof DeviceOrientationEvent
      !== "undefined"

      &&

      typeof DeviceOrientationEvent
        .requestPermission
      === "function"
    ){

      const result =

        await DeviceOrientationEvent
          .requestPermission();


      if(
        result !== "granted"
      ){

        throw new Error(
          "方向センサーを許可してください。"
        );
      }
    }


    /* =====================================================
       MOTION PERMISSION
    ===================================================== */

    if(
      typeof DeviceMotionEvent
      !== "undefined"

      &&

      typeof DeviceMotionEvent
        .requestPermission
      === "function"
    ){

      const result =

        await DeviceMotionEvent
          .requestPermission();


      if(
        result !== "granted"
      ){

        throw new Error(
          "モーションセンサーを許可してください。"
        );
      }
    }


    addEventListener(
      "deviceorientation",
      orientationHandler,
      true
    );


    addEventListener(
      "devicemotion",
      motionHandler,
      {
        passive:true
      }
    );


    hp =
      MAX_HP;


    locked =
      false;


    sensorReady =
      false;


    spawnCreature();


    updateHP();


    /*
      最初はPIXEL
    */

    setDisplayMode(
      "pixel"
    );


    start.style.display =
      "none";


    hud.style.display =
      "block";


    sensorWait.style.display =
      "block";


    running =
      true;


    lastTime =
      performance.now();


    requestAnimationFrame(
      cameraLoop
    );


    requestAnimationFrame(
      gameLoop
    );

  }

  catch(e){

    console.error(e);


    startButton.disabled =
      false;


    startButton.textContent =
      "START CAMERA";


    error.textContent =

      (e.name || "ERROR")

      +

      "\n"

      +

      (
        e.message ||
        String(e)
      )

      +

      "\n\nカメラにはHTTPS環境が必要です。";
  }

});


/* =========================================================
   CAMERA LOOP
========================================================= */

function cameraLoop(){

  if(
    !running
  ){

    return;
  }


  /*
    CAMERAモードのときは
    video自体が表示されるので
    ドットCanvas更新は不要。

    PIXELモードのときだけ処理する。
  */

  if(
    displayMode === "pixel"

    &&

    camera.readyState >= 2

    &&

    camera.videoWidth > 0
  ){

    drawPixelCamera();
  }


  requestAnimationFrame(
    cameraLoop
  );
}


/* =========================================================
   PIXEL CAMERA

   ★70ドット
   ★色加工なし
   ★減色なし
   ★彩度変更なし
   ★コントラスト変更なし
   ★ディザリングなし

   カメラ本来の色を維持する。
========================================================= */

function drawPixelCamera(){

  const vw =
    camera.videoWidth;


  const vh =
    camera.videoHeight;


  if(
    !vw ||
    !vh
  ){

    return;
  }


  /* =====================================================
     object-fit:cover と同じ切り抜き
  ===================================================== */

  const screenRatio =
    W / H;


  const videoRatio =
    vw / vh;


  let sx =
    0;


  let sy =
    0;


  let sw =
    vw;


  let sh =
    vh;


  if(
    videoRatio >
    screenRatio
  ){

    /*
      元映像が画面より横長
      ↓
      左右をカット
    */

    sw =
      vh *
      screenRatio;


    sx =
      (
        vw -
        sw
      )
      /
      2;
  }

  else{

    /*
      元映像が画面より縦長
      ↓
      上下をカット
    */

    sh =
      vw /
      screenRatio;


    sy =
      (
        vh -
        sh
      )
      /
      2;
  }


  /* =====================================================
     70 DOT WIDTH
  ===================================================== */

  pixelW =
    PIXEL_WIDTH;


  pixelH =

    Math.max(

      1,

      Math.round(

        PIXEL_WIDTH

        *

        H/W
      )
    );


  if(
    rawCanvas.width !== pixelW

    ||

    rawCanvas.height !== pixelH
  ){

    rawCanvas.width =
      pixelW;


    rawCanvas.height =
      pixelH;


    world.width =
      pixelW;


    world.height =
      pixelH;


    /*
      縮小時だけ平均化。

      1ドットに含まれる元映像の
      色を自然に平均化する。
    */

    rawCtx.imageSmoothingEnabled =
      true;


    /*
      拡大時は補間禁止。
    */

    wctx.imageSmoothingEnabled =
      false;
  }


  /*
    カメラ
      ↓
    70px幅に縮小

    RGB加工は一切しない。
  */

  rawCtx.drawImage(

    camera,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    pixelW,
    pixelH
  );


  /*
    そのまま表示
  */

  wctx.drawImage(
    rawCanvas,
    0,
    0
  );
}


/* =========================================================
   ORIENTATION
========================================================= */

function orientationHandler(e){

  if(
    !Number.isFinite(e.alpha)

    ||

    !Number.isFinite(e.beta)

    ||

    !Number.isFinite(e.gamma)
  ){

    return;
  }


  const alpha =
    rad(e.alpha);


  const beta =
    rad(e.beta);


  const gamma =
    rad(e.gamma);


  const ca =
    Math.cos(alpha);


  const sa =
    Math.sin(alpha);


  const cb =
    Math.cos(beta);


  const sb =
    Math.sin(beta);


  const cg =
    Math.cos(gamma);


  const sg =
    Math.sin(gamma);


  /* =====================================================
     CAMERA FORWARD VECTOR
  ===================================================== */

  let x =
    0;


  let y =
    0;


  let z =
    -1;


  /* GAMMA */

  let x1 =

    cg*x

    +

    sg*z;


  let y1 =
    y;


  let z1 =

    -sg*x

    +

    cg*z;


  /* BETA */

  let x2 =
    x1;


  let y2 =

    cb*y1

    -

    sb*z1;


  let z2 =

    sb*y1

    +

    cb*z1;


  /* ALPHA */

  let wx =

    ca*x2

    -

    sa*y2;


  let wy =

    sa*x2

    +

    ca*y2;


  let wz =
    z2;


  /* =====================================================
     SCREEN ROTATION
  ===================================================== */

  let screenAngle =
    0;


  if(
    screen.orientation

    &&

    typeof screen.orientation.angle
    === "number"
  ){

    screenAngle =
      screen.orientation.angle;
  }

  else if(
    typeof window.orientation
    === "number"
  ){

    screenAngle =
      window.orientation;
  }


  if(
    screenAngle !== 0
  ){

    const r =
      rad(
        -screenAngle
      );


    const c =
      Math.cos(r);


    const s =
      Math.sin(r);


    const nx =

      c*wx

      -

      s*wy;


    const ny =

      s*wx

      +

      c*wy;


    wx =
      nx;


    wy =
      ny;
  }


  /* =====================================================
     PITCH

     上を見る
       → +

     下を見る
       → -
  ===================================================== */

  const horizontal =

    Math.sqrt(

      wx*wx

      +

      wy*wy
    );


  targetPitch =

    clamp(

      deg(

        Math.atan2(

          wz,

          horizontal
        )
      ),

      -90,

      90
    );


  /* =====================================================
     YAW
  ===================================================== */

  let yaw =

    deg(

      Math.atan2(

        wx,

        -wy
      )
    );


  yaw =
    normalize360(
      yaw
    );


  /*
    iOSにCompass Headingがあれば優先
  */

  if(
    typeof e.webkitCompassHeading
    === "number"

    &&

    Number.isFinite(
      e.webkitCompassHeading
    )

    &&

    horizontal > .15
  ){

    yaw =

      normalize360(
        e.webkitCompassHeading
      );
  }


  targetYaw =
    yaw;


  /*
    最初のセンサー値を基準として
    即座に設定
  */

  if(
    !sensorReady
  ){

    cameraYaw =
      targetYaw;


    cameraPitch =
      targetPitch;


    sensorReady =
      true;


    sensorWait.style.display =
      "none";
  }
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

  if(
    !running
  ){

    return;
  }


  let dt =

    (
      time -
      lastTime
    )

    /

    1000;


  lastTime =
    time;


  dt =

    Math.min(
      dt,
      .05
    );


  /* =====================================================
     SENSOR SMOOTHING
  ===================================================== */

  if(
    sensorReady
  ){

    cameraYaw =

      smoothAngle(

        cameraYaw,

        targetYaw,

        YAW_SMOOTH
      );


    cameraPitch +=

      (
        targetPitch

        -

        cameraPitch
      )

      *

      PITCH_SMOOTH;
  }


  /* =====================================================
     LOCK
  ===================================================== */

  if(
    locked
  ){

    const remaining =

      lockEnd

      -

      time;


    hp -=

      DAMAGE_PER_SECOND

      *

      dt;


    hp =

      Math.max(
        0,
        hp
      );


    updateHP();


    /*
      HP 0
    */

    if(
      hp <= 0
    ){

      hp =
        0;


      updateHP();


      locked =
        false;


      running =
        false;


      lockText.textContent =
        "★ CAPTURED ★";


      lockText.style.display =
        "block";


      timer.style.display =
        "none";


      renderGame(
        time
      );


      return;
    }


    /*
      ロック終了
    */

    if(
      remaining <= 0
    ){

      locked =
        false;


      lockText.style.display =
        "none";


      timer.style.display =
        "none";


      /*
        また逃げる
      */

      startEscape();
    }

    else{

      timer.textContent =

        (
          remaining /
          1000
        )

        .toFixed(1);
    }
  }


  /* =====================================================
     ESCAPE
  ===================================================== */

  else if(
    escaping
  ){

    const move =

      escapeSpeed

      *

      dt;


    /*
      ★一度決めた左右方向に逃げ続ける

      途中で反転しない。
    */

    creatureYaw =

      normalize360(

        creatureYaw

        +

        escapeDirection

        *

        move
      );


    /*
      SKY / FRONT / EARTH
      の高さは維持。
    */

    creaturePitch =
      creatureBasePitch;


    escapeTravel +=
      move;


    if(
      escapeTravel >=
      escapeDistance
    ){

      escaping =
        false;
    }
  }


  /* =====================================================
     VISIBILITY
  ===================================================== */

  if(
    sensorReady
  ){

    const dx =

      angleDiff(

        creatureYaw,

        cameraYaw
      );


    const dy =

      creaturePitch

      -

      cameraPitch;


    creatureVisible =

      Math.abs(dx)
      <
      HFOV/2

      &&

      Math.abs(dy)
      <
      VFOV/2;


    /*
      初めて画面に入った瞬間、
      キャラクターが逃走開始。
    */

    if(
      creatureVisible

      &&

      !discovered
    ){

      discovered =
        true;


      startEscape();
    }
  }


  renderGame(
    time
  );


  requestAnimationFrame(
    gameLoop
  );
}


/* =========================================================
   START ESCAPE
========================================================= */

function startEscape(){

  discovered =
    true;


  escaping =
    true;


  escapeTravel =
    0;


  /*
    ★右または左をランダムに決定

    一度決めたら
    この逃走中は変更しない。
  */

  escapeDirection =

    Math.random() < .5

    ?

    -1

    :

    1;


  escapeSpeed =

    random(

      ESCAPE_SPEED_MIN,

      ESCAPE_SPEED_MAX
    );


  /*
    55°〜160°
  */

  escapeDistance =

    random(

      ESCAPE_DISTANCE_MIN,

      ESCAPE_DISTANCE_MAX
    );


  creatureBobAmplitude =

    random(
      5,
      20
    );


  creatureBobPhase =

    random(
      0,
      Math.PI * 2
    );


  creatureBobSpeed =

    random(
      .7,
      1.3
    );
}


/* =========================================================
   360° → SCREEN
========================================================= */

function projectCreature(
  yaw,
  pitch
){

  const dx =

    angleDiff(

      yaw,

      cameraYaw
    );


  const dy =

    pitch

    -

    cameraPitch;


  /*
    水平位置

    dx +
      → 画面右

    dx -
      → 画面左
  */

  const x =

    W/2

    +

    (
      dx /
      (HFOV/2)
    )

    *

    (
      W/2
    );


  /*
    垂直位置

    pitchが上
      → 画面上
  */

  const y =

    H/2

    -

    (
      dy /
      (VFOV/2)
    )

    *

    (
      H/2
    );


  return{

    x,
    y,

    dx,
    dy,

    visible:

      Math.abs(dx)
      <
      HFOV/2

      &&

      Math.abs(dy)
      <
      VFOV/2
  };
}


/* =========================================================
   RENDER
========================================================= */

function renderGame(time){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawCreature(
    time
  );


  let look =
    "LEVEL";


  if(
    cameraPitch > 8
  ){

    look =
      "UP";
  }

  else if(
    cameraPitch < -8
  ){

    look =
      "DOWN";
  }


  debug.innerHTML =

    "YAW "

    +

    cameraYaw.toFixed(1)

    +

    "°"

    +

    "<br>PITCH "

    +

    cameraPitch.toFixed(1)

    +

    "°"

    +

    "<br>"

    +

    look

    +

    "<br>TYPE "

    +

    creatureZone

    +

    "<br>MODE "

    +

    displayMode.toUpperCase()

    +

    "<br>PIXEL "

    +

    pixelW

    +

    "×"

    +

    pixelH

    +

    "<br>HP "

    +

    Math.ceil(
      hp
    );
}


/* =========================================================
   DRAW CREATURE
========================================================= */

function drawCreature(time){

  if(
    !creatureVisible
  ){

    return;
  }


  const p =

    projectCreature(

      creatureYaw,

      creaturePitch
    );


  if(
    !p.visible
  ){

    return;
  }


  /*
    5〜20pxだけ上下に揺れる。
  */

  const bob =

    Math.sin(

      time

      *

      .001

      *

      creatureBobSpeed

      +

      creatureBobPhase
    )

    *

    creatureBobAmplitude;


  const x =

    Math.round(
      p.x
    );


  const y =

    Math.round(

      p.y

      +

      bob
    );


  const size =

    clamp(

      Math.min(
        W,
        H
      )

      *

      .09,

      38,

      68
    );


  const c =

    locked

    ?

    "#40e8ff"

    :

    "#8458e8";


  ctx.save();


  ctx.translate(
    x,
    y
  );


  /* =====================================================
     SHADOW
  ===================================================== */

  ctx.fillStyle =
    "rgba(0,0,0,.42)";


  ctx.fillRect(

    -size*.36,

    size*.38,

    size*.72,

    size*.12
  );


  /* =====================================================
     BODY OUTLINE
  ===================================================== */

  ctx.fillStyle =
    "#17121e";


  ctx.fillRect(

    -size*.37,

    -size*.30,

    size*.74,

    size*.60
  );


  /* BODY */

  ctx.fillStyle =
    c;


  ctx.fillRect(

    -size*.31,

    -size*.24,

    size*.62,

    size*.49
  );


  /* =====================================================
     EARS
  ===================================================== */

  ctx.fillStyle =
    "#17121e";


  ctx.fillRect(

    -size*.40,

    -size*.46,

    size*.18,

    size*.27
  );


  ctx.fillRect(

    size*.22,

    -size*.46,

    size*.18,

    size*.27
  );


  ctx.fillStyle =
    c;


  ctx.fillRect(

    -size*.35,

    -size*.40,

    size*.09,

    size*.18
  );


  ctx.fillRect(

    size*.26,

    -size*.40,

    size*.09,

    size*.18
  );


  /* =====================================================
     EYES
  ===================================================== */

  ctx.fillStyle =
    "#fff";


  ctx.fillRect(

    -size*.23,

    -size*.12,

    size*.16,

    size*.15
  );


  ctx.fillRect(

    size*.07,

    -size*.12,

    size*.16,

    size*.15
  );


  /* PUPILS */

  ctx.fillStyle =
    "#111";


  ctx.fillRect(

    -size*.15,

    -size*.08,

    size*.06,

    size*.08
  );


  ctx.fillRect(

    size*.09,

    -size*.08,

    size*.06,

    size*.08
  );


  /* MOUTH */

  ctx.fillRect(

    -size*.09,

    size*.10,

    size*.18,

    size*.055
  );


  /* =====================================================
     LEGS
  ===================================================== */

  ctx.fillStyle =
    "#17121e";


  ctx.fillRect(

    -size*.26,

    size*.23,

    size*.11,

    size*.27
  );


  ctx.fillRect(

    -size*.055,

    size*.23,

    size*.11,

    size*.30
  );


  ctx.fillRect(

    size*.15,

    size*.23,

    size*.11,

    size*.27
  );


  ctx.fillStyle =
    c;


  ctx.fillRect(

    -size*.22,

    size*.24,

    size*.05,

    size*.21
  );


  ctx.fillRect(

    -size*.025,

    size*.24,

    size*.05,

    size*.24
  );


  ctx.fillRect(

    size*.17,

    size*.24,

    size*.05,

    size*.21
  );


  /* =====================================================
     LOCK EFFECT
  ===================================================== */

  if(
    locked
  ){

    const pulse =

      Math.round(

        size

        *

        (
          .65

          +

          Math.sin(
            time*.015
          )

          *

          .04
        )
      );


    ctx.strokeStyle =
      "#fff";


    ctx.lineWidth =
      4;


    ctx.strokeRect(

      -pulse,

      -pulse,

      pulse*2,

      pulse*2
    );


    ctx.fillStyle =
      "#fff";


    ctx.fillRect(
      -pulse-8,
      -3,
      6,
      6
    );


    ctx.fillRect(
      pulse+2,
      -3,
      6,
      6
    );


    ctx.fillRect(
      -3,
      -pulse-8,
      6,
      6
    );


    ctx.fillRect(
      -3,
      pulse+2,
      6,
      6
    );
  }


  ctx.restore();
}


/* =========================================================
   SHAKE
========================================================= */

function motionHandler(e){

  if(
    !running

    ||

    !creatureVisible

    ||

    locked
  ){

    return;
  }


  const a =
    e.accelerationIncludingGravity;


  if(
    !a
  ){

    return;
  }


  const x =
    a.x || 0;


  const y =
    a.y || 0;


  const z =
    a.z || 0;


  const magnitude =

    Math.sqrt(

      x*x

      +

      y*y

      +

      z*z
    );


  const shake =

    Math.abs(

      magnitude

      -

      9.81
    );


  if(
    shake <
    SHAKE_THRESHOLD
  ){

    return;
  }


  const now =
    performance.now();


  /*
    連続誤判定防止
  */

  if(
    now-lastShake <
    500
  ){

    return;
  }


  lastShake =
    now;


  lockCreature(
    shake
  );
}


/* =========================================================
   LOCK
========================================================= */

function lockCreature(power){

  if(
    !creatureVisible

    ||

    locked
  ){

    return;
  }


  locked =
    true;


  /*
    ロックした位置で停止。
  */

  escaping =
    false;


  /*
    振った強さで

    最低1.5秒
    最大6秒
  */

  let seconds =

    MIN_LOCK

    +

    (
      power

      -

      SHAKE_THRESHOLD
    )

    *

    .35;


  seconds =

    clamp(

      seconds,

      MIN_LOCK,

      MAX_LOCK
    );


  lockEnd =

    performance.now()

    +

    seconds

    *

    1000;


  lockText.textContent =
    "⚡ LOCK!";


  lockText.style.display =
    "block";


  timer.style.display =
    "block";


  timer.textContent =
    seconds.toFixed(1);


  /*
    対応端末なら振動
  */

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [
        70,
        40,
        120
      ]
    );
  }
}


/* =========================================================
   HP
========================================================= */

function updateHP(){

  hpNumber.textContent =

    Math.ceil(
      hp
    );


  hpInner.style.width =

    (
      hp

      /

      MAX_HP

      *

      100
    )

    +

    "%";
}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera(){

  const stream =
    camera.srcObject;


  if(
    !stream
  ){

    return;
  }


  for(
    const track
    of
    stream.getTracks()
  ){

    track.stop();
  }


  camera.srcObject =
    null;
}


addEventListener(
  "pagehide",
  stopCamera
);


addEventListener(
  "beforeunload",
  stopCamera
);

</script>
