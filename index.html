<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Camera Motion AR Test</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

/* ===============================
   CAMERA
================================ */

#camera{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#000;

    display:none;

    z-index:1;
}

/* ===============================
   CHARACTER
================================ */

#character{

    position:fixed;

    width:100px;
    height:100px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    display:none;

    align-items:center;
    justify-content:center;

    font-size:75px;

    z-index:5;

    pointer-events:none;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(0,0,0,.5)
        );
}

/* ===============================
   CENTER LINE
================================ */

#centerLine{

    position:fixed;

    left:50%;
    top:0;

    width:1px;
    height:100%;

    background:
        rgba(255,255,255,.25);

    z-index:3;

    display:none;

    pointer-events:none;
}

/* ===============================
   START SCREEN
================================ */

#startScreen{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:30px;

    background:

        radial-gradient(
            circle at 50% 35%,
            #333,
            #111 55%,
            #000
        );

    color:white;

    text-align:center;
}

#startScreen h1{

    margin:0 0 15px;

    font-size:28px;
}

#startScreen p{

    margin:0;

    max-width:400px;

    font-size:14px;

    line-height:1.8;

    opacity:.75;
}

/* ===============================
   START BUTTON
================================ */

#startButton{

    appearance:none;

    border:0;

    margin-top:30px;

    padding:
        18px
        28px;

    min-width:260px;

    border-radius:100px;

    background:white;

    color:#111;

    font-size:17px;

    font-weight:800;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.5);
}

#startButton:active{

    transform:
        scale(.96);
}

/* ===============================
   ERROR
================================ */

#error{

    display:none;

    width:min(
        90vw,
        430px
    );

    margin-top:25px;

    padding:15px;

    border-radius:14px;

    background:
        rgba(
            255,
            60,
            60,
            .13
        );

    border:
        1px solid
        rgba(
            255,
            100,
            100,
            .3
        );

    color:#ffaaaa;

    text-align:left;

    font-size:12px;

    line-height:1.7;

    white-space:pre-line;
}

/* ===============================
   DEBUG PANEL
================================ */

#debug{

    position:fixed;

    top:
        calc(
            15px +
            env(
                safe-area-inset-top
            )
        );

    left:15px;

    z-index:20;

    display:none;

    min-width:180px;

    padding:12px 14px;

    border-radius:12px;

    background:
        rgba(
            0,
            0,
            0,
            .65
        );

    color:white;

    font-family:
        monospace;

    font-size:12px;

    line-height:1.7;

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);
}

.value{

    color:#7cff9b;

}

/* ===============================
   CONTROLS
================================ */

#controls{

    position:fixed;

    left:50%;

    bottom:
        calc(
            25px +
            env(
                safe-area-inset-bottom
            )
        );

    transform:
        translateX(-50%);

    z-index:20;

    display:none;

    gap:8px;

    padding:8px;

    border-radius:100px;

    background:
        rgba(
            0,
            0,
            0,
            .55
        );

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);
}

.control{

    appearance:none;

    border:0;

    height:48px;

    padding:
        0 17px;

    border-radius:100px;

    background:
        rgba(
            255,
            255,
            255,
            .16
        );

    color:white;

    font-size:14px;

    font-weight:bold;
}

.control:active{

    transform:
        scale(.94);

}

#stopButton{

    background:
        rgba(
            255,
            60,
            60,
            .65
        );
}

/* ===============================
   SENSOR INDICATOR
================================ */

#sensorDot{

    display:inline-block;

    width:8px;
    height:8px;

    margin-right:5px;

    border-radius:50%;

    background:#888;
}

</style>
</head>


<body>


<!-- ===============================
     CAMERA
================================ -->

<video
    id="camera"
    autoplay
    muted
    playsinline
    webkit-playsinline>
</video>


<!-- ===============================
     CENTER
================================ -->

<div id="centerLine"></div>


<!-- ===============================
     CHARACTER
================================ -->

<div id="character">
    👾
</div>


<!-- ===============================
     DEBUG
================================ -->

<div id="debug">

    <div>
        <span id="sensorDot"></span>
        SENSOR
    </div>

    <br>

    X ACCEL:
    <span
        id="accelerationText"
        class="value">
        0.000
    </span>

    <br>

    FILTER:
    <span
        id="filterText"
        class="value">
        0.000
    </span>

    <br>

    VELOCITY:
    <span
        id="velocityText"
        class="value">
        0.000
    </span>

    <br>

    CHARACTER X:
    <span
        id="positionText"
        class="value">
        0
    </span>

</div>


<!-- ===============================
     CONTROLS
================================ -->

<div id="controls">

    <button
        id="sensitivityDown"
        class="control">
        感度 −
    </button>

    <button
        id="resetButton"
        class="control">
        中央
    </button>

    <button
        id="sensitivityUp"
        class="control">
        感度 ＋
    </button>

    <button
        id="stopButton"
        class="control">
        ✕
    </button>

</div>


<!-- ===============================
     START
================================ -->

<div id="startScreen">

    <div
        style="
        font-size:70px;
        margin-bottom:15px;
        ">
        📱
    </div>

    <h1>
        MOTION AR TEST
    </h1>

    <p>
        スマホの横方向の動きを検出して、
        カメラ上のキャラクターを動かします。
        <br><br>

        起動後、スマホを傾けずに
        左右へスッと平行移動してください。
    </p>

    <button id="startButton">
        カメラ＋センサー起動
    </button>

    <div id="error"></div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const camera =
    document.getElementById(
        "camera"
    );

const character =
    document.getElementById(
        "character"
    );

const centerLine =
    document.getElementById(
        "centerLine"
    );

const debug =
    document.getElementById(
        "debug"
    );

const controls =
    document.getElementById(
        "controls"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const errorBox =
    document.getElementById(
        "error"
    );

const accelerationText =
    document.getElementById(
        "accelerationText"
    );

const filterText =
    document.getElementById(
        "filterText"
    );

const velocityText =
    document.getElementById(
        "velocityText"
    );

const positionText =
    document.getElementById(
        "positionText"
    );

const sensorDot =
    document.getElementById(
        "sensorDot"
    );


/* =========================================
   STATE
========================================= */

let stream = null;

let characterX =
    window.innerWidth / 2;

let velocity = 0;

let filteredAcceleration = 0;

let lastTime = null;

let sensorReceived = false;


/* =========================================
   SETTINGS
========================================= */

/*
   大きいほどキャラが
   大きく移動する
*/

let sensitivity = 180;


/*
   小さな揺れを無視
*/

const DEAD_ZONE = 0.06;


/*
   速度減衰

   小さいほど早く止まる
*/

const FRICTION = 0.88;


/*
   ローパスフィルタ
*/

const FILTER_AMOUNT = 0.25;


/* =========================================
   START BUTTON

   ★重要

   iPhone Safariでは
   DeviceMotionEvent.requestPermission()
   をユーザー操作から直接呼ぶ必要がある。

   そのためカメラより先に
   モーション許可を要求する。
========================================= */

startButton.addEventListener(
    "click",
    startEverything
);


async function startEverything(){

    errorBox.style.display =
        "none";

    errorBox.textContent =
        "";


    try{

        /* =================================
           STEP 1
           MOTION PERMISSION

           ★最優先
        ================================= */

        if(
            typeof DeviceMotionEvent !==
            "undefined"
        ){

            if(
                typeof
                DeviceMotionEvent
                .requestPermission ===
                "function"
            ){

                const result =
                    await
                    DeviceMotionEvent
                    .requestPermission();


                if(
                    result !==
                    "granted"
                ){

                    throw new Error(
                        "モーションセンサーへのアクセスが許可されませんでした。"
                    );

                }

            }

        }


        /*
           許可されたら
           即イベント登録
        */

        window.addEventListener(
            "devicemotion",
            handleMotion,
            {
                passive:true
            }
        );


        /* =================================
           STEP 2
           CAMERA CHECK
        ================================= */

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices
                .getUserMedia
        ){

            throw new Error(
                "このページではカメラAPIを使用できません。\n\nHTTPSのWebページとしてSafariから開いてください。"
            );

        }


        /* =================================
           STEP 3
           CAMERA
        ================================= */

        try{

            stream =
                await
                navigator.mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{

                        facingMode:{
                            ideal:
                                "environment"
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        }

                    }

                });

        }

        catch(firstCameraError){

            console.log(
                "背面カメラ指定失敗",
                firstCameraError
            );


            /*
               条件を緩くして
               もう一度
            */

            stream =
                await
                navigator.mediaDevices
                .getUserMedia({

                    audio:false,

                    video:true

                });

        }


        /* =================================
           STEP 4
           VIDEO
        ================================= */

        camera.srcObject =
            stream;

        camera.muted =
            true;

        camera.setAttribute(
            "playsinline",
            ""
        );

        camera.setAttribute(
            "webkit-playsinline",
            ""
        );


        await camera.play();


        /* =================================
           STEP 5
           SHOW
        ================================= */

        startScreen.style.display =
            "none";

        camera.style.display =
            "block";

        character.style.display =
            "flex";

        centerLine.style.display =
            "block";

        debug.style.display =
            "block";

        controls.style.display =
            "flex";


        resetMotion();

    }

    catch(error){

        console.error(
            error
        );

        showError(
            error
        );

    }

}


/* =========================================
   MOTION
========================================= */

function handleMotion(event){

    sensorReceived =
        true;

    sensorDot.style.background =
        "#62ff7e";


    /*
       accelerationは
       重力を除いた加速度。

       iPhoneを縦持ちした場合、
       x が概ね左右方向。
    */

    const data =
        event.acceleration;


    if(!data){

        sensorDot.style.background =
            "#ffba55";

        return;

    }


    let ax =
        Number(
            data.x
        );


    if(
        !Number.isFinite(ax)
    ){

        ax = 0;

    }


    accelerationText.textContent =
        ax.toFixed(3);


    /* =================================
       LOW PASS FILTER
    ================================= */

    filteredAcceleration =

        filteredAcceleration *
        (1 - FILTER_AMOUNT)

        +

        ax *
        FILTER_AMOUNT;


    let movement =
        filteredAcceleration;


    filterText.textContent =
        movement.toFixed(3);


    /* =================================
       DEAD ZONE
    ================================= */

    if(
        Math.abs(movement)
        <
        DEAD_ZONE
    ){

        movement = 0;

    }


    /* =================================
       TIME
    ================================= */

    const now =
        performance.now();


    if(
        lastTime === null
    ){

        lastTime = now;

        return;

    }


    let dt =
        (
            now -
            lastTime
        )
        /
        1000;


    lastTime = now;


    /*
       タブ復帰などで
       dtが巨大になるのを防ぐ
    */

    dt =
        Math.min(
            dt,
            0.05
        );


    /* =================================
       ACCELERATION
       ↓
       VELOCITY
    ================================= */

    velocity +=

        movement

        *

        sensitivity

        *

        dt;


    /* =================================
       FRICTION
    ================================= */

    velocity *=
        FRICTION;


    /*
       非常に小さい速度は
       0にする
    */

    if(
        Math.abs(velocity)
        <
        0.02
    ){

        velocity = 0;

    }


    /* =================================
       POSITION

       スマホ →
       キャラ ←

       にするためマイナス
    ================================= */

    characterX -=

        velocity

        *

        dt;


    /* =================================
       SCREEN LIMIT
    ================================= */

    const halfWidth =
        character.offsetWidth
        /
        2;


    characterX =
        Math.max(

            halfWidth,

            Math.min(

                window.innerWidth
                -
                halfWidth,

                characterX

            )

        );


    /* =================================
       DRAW
    ================================= */

    character.style.left =
        characterX +
        "px";


    velocityText.textContent =
        velocity.toFixed(3);


    positionText.textContent =
        Math.round(
            characterX
        );

}


/* =========================================
   RESET
========================================= */

function resetMotion(){

    characterX =
        window.innerWidth
        /
        2;

    velocity =
        0;

    filteredAcceleration =
        0;

    lastTime =
        null;


    character.style.left =
        characterX +
        "px";


    accelerationText.textContent =
        "0.000";

    filterText.textContent =
        "0.000";

    velocityText.textContent =
        "0.000";

    positionText.textContent =
        Math.round(
            characterX
        );

}


document
.getElementById(
    "resetButton"
)
.addEventListener(
    "click",
    resetMotion
);


/* =========================================
   SENSITIVITY
========================================= */

document
.getElementById(
    "sensitivityUp"
)
.addEventListener(
    "click",
    () => {

        sensitivity +=
            50;

    }
);


document
.getElementById(
    "sensitivityDown"
)
.addEventListener(
    "click",
    () => {

        sensitivity =
            Math.max(
                50,
                sensitivity - 50
            );

    }
);


/* =========================================
   STOP
========================================= */

document
.getElementById(
    "stopButton"
)
.addEventListener(
    "click",
    () => {

        stopCamera();

        camera.style.display =
            "none";

        character.style.display =
            "none";

        centerLine.style.display =
            "none";

        debug.style.display =
            "none";

        controls.style.display =
            "none";

        startScreen.style.display =
            "flex";

    }
);


function stopCamera(){

    if(!stream){
        return;
    }


    stream
    .getTracks()
    .forEach(
        track => {

            track.stop();

        }
    );


    stream = null;


    camera.srcObject =
        null;

}


/* =========================================
   ERROR
========================================= */

function showError(error){

    let text =
        "起動できませんでした。\n\n";


    if(
        error.name ===
        "NotAllowedError"
    ){

        text +=
`カメラまたはセンサーへのアクセスが拒否されました。

SafariのWebサイト設定で
「カメラ」を許可してください。

モーションセンサーの確認画面が出た場合も「許可」を選択してください。`;

    }

    else if(
        error.name ===
        "NotFoundError"
    ){

        text +=
            "使用できるカメラが見つかりません。";

    }

    else{

        text +=
            (
                error.name
                ?
                error.name +
                "\n\n"
                :
                ""
            );

        text +=
            error.message
            ||
            String(error);

    }


    errorBox.textContent =
        text;

    errorBox.style.display =
        "block";

}


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    () => {

        const halfWidth =
            character.offsetWidth
            /
            2;


        characterX =
            Math.max(

                halfWidth,

                Math.min(

                    window.innerWidth
                    -
                    halfWidth,

                    characterX

                )

            );


        character.style.left =
            characterX +
            "px";

    }
);


/* =========================================
   PAGE CLOSE
========================================= */

window.addEventListener(
    "pagehide",
    stopCamera
);

</script>

</body>
</html>
