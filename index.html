<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>CAMERA HUNT 360</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:monospace;
}

/* =========================================================
   NORMAL CAMERA
========================================================= */

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  z-index:0;
  display:none;
}

/* =========================================================
   PIXEL CAMERA
========================================================= */

#world{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  z-index:0;

  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

/* =========================================================
   GAME CANVAS
========================================================= */

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  pointer-events:none;
  image-rendering:pixelated;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  pointer-events:none;
}

#hp{
  position:absolute;
  top:calc(14px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  width:min(82vw,390px);
}

#hpText{
  color:#fff;
  font-size:13px;
  font-weight:900;
  text-shadow:2px 2px 0 #000;
}

#hpOuter{
  height:17px;
  margin-top:5px;
  border:3px solid #fff;
  background:#111;
  box-shadow:3px 3px 0 #000;
}

#hpInner{
  width:100%;
  height:100%;
  background:#fff;
}

/* =========================================================
   LOCK
========================================================= */

#lock{
  position:absolute;
  top:18%;
  left:50%;
  transform:translate(-50%,-50%);

  display:none;

  padding:9px 15px;

  background:#111;
  border:3px solid #fff;
  box-shadow:4px 4px 0 #000;

  color:#fff;
  font-size:22px;
  font-weight:900;
}

#timer{
  position:absolute;
  bottom:17%;
  left:50%;
  transform:translateX(-50%);

  display:none;

  padding:6px 12px;

  background:#111;
  border:3px solid #fff;
  box-shadow:4px 4px 0 #000;

  color:#fff;
  font-size:30px;
  font-weight:900;
}

/* =========================================================
   SENSOR
========================================================= */

#sensorWait{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

  display:none;

  padding:10px 17px;

  background:#111;
  border:3px solid #fff;

  color:#fff;
  font-weight:900;
}

/* =========================================================
   MODE SWITCH
========================================================= */

#modeSwitch{
  position:absolute;

  left:50%;

  bottom:calc(
    24px +
    env(safe-area-inset-bottom)
  );

  transform:translateX(-50%);

  display:flex;
  gap:5px;

  padding:5px;

  background:rgba(0,0,0,.68);

  border:2px solid #fff;

  pointer-events:auto;
}

#modeSwitch button{
  min-width:92px;

  padding:11px 16px;

  border:0;

  background:transparent;

  color:#fff;

  font-family:monospace;
  font-size:12px;
  font-weight:900;
}

#modeSwitch button.active{
  background:#fff;
  color:#111;
}

/* =========================================================
   DEBUG
========================================================= */

#debug{
  position:absolute;
  right:6px;
  bottom:6px;

  padding:5px 7px;

  background:rgba(0,0,0,.68);

  border:1px solid rgba(255,255,255,.7);

  color:#fff;

  font-size:8px;

  line-height:1.45;
}

/* =========================================================
   START SCREEN
========================================================= */

#start{
  position:fixed;
  inset:0;
  z-index:100;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  padding:
    calc(25px + env(safe-area-inset-top))
    25px
    calc(25px + env(safe-area-inset-bottom));

  background:#161925;

  color:#fff;

  text-align:center;
}

#startIcon{
  font-size:64px;
}

#start h1{
  margin:8px 0 10px;
  font-size:25px;
}

#start p{
  max-width:430px;

  margin:5px 0;

  font-size:13px;

  line-height:1.75;

  opacity:.86;
}

#secureStatus{
  margin-top:12px;

  padding:6px 10px;

  border:1px solid rgba(255,255,255,.35);

  font-size:11px;

  opacity:.85;
}

#startButton{
  min-width:250px;

  margin-top:18px;

  padding:17px 25px;

  border:3px solid #fff;

  background:#fff;

  color:#111;

  box-shadow:6px 6px 0 #000;

  font-family:monospace;
  font-size:16px;
  font-weight:900;
}

#startButton:active{
  transform:translate(3px,3px);
  box-shadow:3px 3px 0 #000;
}

#startButton:disabled{
  opacity:.55;
}

#error{
  max-width:430px;

  margin-top:16px;

  color:#ffaaaa;

  font-size:11px;

  line-height:1.55;

  white-space:pre-line;
}
</style>
</head>

<body>

     CAMERA
     録画・保存・送信なし
======================================================= -->

<video

<!-- 70 DOT CAMERA -->

<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const camera =
  document.getElementById("camera");

const world =
  document.getElementById("world");

const wctx =
  world.getContext(
    "2d",
    {
      alpha:false
    }
  );

const game =
  document.getElementById("game");

const ctx =
  game.getContext("2d");

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("startButton");

const errorBox =
  document.getElementById("error");

const secureStatus =
  document.getElementById("secureStatus");

const hud =
  document.getElementById("hud");

const hpNumber =
  document.getElementById("hpNumber");

const hpInner =
  document.getElementById("hpInner");

const lockText =
  document.getElementById("lock");

const timer =
  document.getElementById("timer");

const sensorWait =
  document.getElementById("sensorWait");

const debug =
  document.getElementById("debug");

const pixelModeButton =
  document.getElementById("pixelMode");

const cameraModeButton =
  document.getElementById("cameraMode");


/* =========================================================
   HTTPS CHECK
========================================================= */

if(window.isSecureContext){

  secureStatus.textContent =
    "✓ SECURE";

}else{

  secureStatus.textContent =
    "⚠ HTTPS REQUIRED";

  secureStatus.style.color =
    "#ff9999";
}


/* =========================================================
   SCREEN
========================================================= */

let W =
  innerWidth;

let H =
  innerHeight;

let DPR =
  1;


function resize(){

  W =
    innerWidth;

  H =
    innerHeight;


  DPR =
    Math.min(
      devicePixelRatio || 1,
      2
    );


  game.width =
    Math.round(
      W * DPR
    );

  game.height =
    Math.round(
      H * DPR
    );


  game.style.width =
    W + "px";

  game.style.height =
    H + "px";


  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  ctx.imageSmoothingEnabled =
    false;
}


addEventListener(
  "resize",
  resize
);


addEventListener(
  "orientationchange",
  ()=>{
    setTimeout(
      resize,
      250
    );
  }
);


resize();


/* =========================================================
   PIXEL SETTINGS

   ★70ドット
========================================================= */

const PIXEL_WIDTH =
  70;


const rawCanvas =
  document.createElement(
    "canvas"
  );


const rawCtx =
  rawCanvas.getContext(
    "2d",
    {
      alpha:false
    }
  );


let pixelW =
  PIXEL_WIDTH;

let pixelH =
  100;


/* =========================================================
   DISPLAY MODE
========================================================= */

let displayMode =
  "pixel";


function setDisplayMode(mode){

  displayMode =
    mode;


  if(mode === "pixel"){

    world.style.display =
      "block";

    camera.style.display =
      "none";


    pixelModeButton
      .classList
      .add("active");

    cameraModeButton
      .classList
      .remove("active");

  }else{

    world.style.display =
      "none";

    camera.style.display =
      "block";


    pixelModeButton
      .classList
      .remove("active");

    cameraModeButton
      .classList
      .add("active");
  }
}


pixelModeButton.addEventListener(
  "click",
  ()=>{
    setDisplayMode("pixel");
  }
);


cameraModeButton.addEventListener(
  "click",
  ()=>{
    setDisplayMode("camera");
  }
);


/* =========================================================
   GAME SETTINGS
========================================================= */

const HFOV =
  68;

const VFOV =
  55;


const MAX_HP =
  100;

const DAMAGE_PER_SECOND =
  12;


const SHAKE_THRESHOLD =
  9;

const MIN_LOCK =
  1.5;

const MAX_LOCK =
  6;


const ESCAPE_SPEED_MIN =
  7;

const ESCAPE_SPEED_MAX =
  11;


const ESCAPE_DISTANCE_MIN =
  55;

const ESCAPE_DISTANCE_MAX =
  160;


const YAW_SMOOTH =
  .24;

const PITCH_SMOOTH =
  .20;


/* =========================================================
   CREATURE ZONES
========================================================= */

const CREATURE_ZONES = {

  SKY:{
    minPitch:20,
    maxPitch:34
  },

  FRONT:{
    minPitch:-6,
    maxPitch:6
  },

  EARTH:{
    minPitch:-34,
    maxPitch:-20
  }

};


/* =========================================================
   SENSOR
========================================================= */

let cameraYaw =
  0;

let cameraPitch =
  0;

let targetYaw =
  0;

let targetPitch =
  0;

let sensorReady =
  false;


/* =========================================================
   CREATURE
========================================================= */

let creatureZone =
  "FRONT";

let creatureYaw =
  0;

let creaturePitch =
  0;

let creatureBasePitch =
  0;

let creatureBobAmplitude =
  10;

let creatureBobPhase =
  0;

let creatureBobSpeed =
  1;

let creatureVisible =
  false;

let discovered =
  false;

let escaping =
  false;

let escapeDirection =
  1;

let escapeSpeed =
  0;

let escapeDistance =
  0;

let escapeTravel =
  0;


/* =========================================================
   GAME STATE
========================================================= */

let running =
  false;

let hp =
  MAX_HP;

let locked =
  false;

let lockEnd =
  0;

let lastShake =
  0;

let lastTime =
  0;


/* =========================================================
   MATH
========================================================= */

function rad(v){

  return (
    v *
    Math.PI /
    180
  );
}


function deg(v){

  return (
    v *
    180 /
    Math.PI
  );
}


function clamp(
  v,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      v
    )
  );
}


function random(
  min,
  max
){

  return (
    Math.random()
    *
    (max-min)
    +
    min
  );
}


function normalize360(a){

  a %= 360;

  if(a < 0){
    a += 360;
  }

  return a;
}


function angleDiff(
  target,
  current
){

  let d =
    normalize360(target)
    -
    normalize360(current);


  if(d > 180){
    d -= 360;
  }

  if(d < -180){
    d += 360;
  }


  return d;
}


function smoothAngle(
  current,
  target,
  amount
){

  return normalize360(

    current

    +

    angleDiff(
      target,
      current
    )

    *

    amount
  );
}


/* =========================================================
   SPAWN
========================================================= */

function spawnCreature(){

  const types = [
    "SKY",
    "FRONT",
    "EARTH"
  ];


  creatureZone =

    types[
      Math.floor(
        Math.random()
        *
        types.length
      )
    ];


  const zone =
    CREATURE_ZONES[
      creatureZone
    ];


  /*
    ★360度ランダム
  */

  creatureYaw =
    random(
      0,
      360
    );


  creatureBasePitch =
    random(
      zone.minPitch,
      zone.maxPitch
    );


  creaturePitch =
    creatureBasePitch;


  /*
    上下5〜20px程度
  */

  creatureBobAmplitude =
    random(
      5,
      20
    );


  creatureBobPhase =
    random(
      0,
      Math.PI*2
    );


  creatureBobSpeed =
    random(
      .7,
      1.3
    );


  creatureVisible =
    false;

  discovered =
    false;

  escaping =
    false;
}


/* =========================================================
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   ONE TAP START
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★

   重要：

   requestPermission() の前に
   awaitを一切置かない。

========================================================= */

startButton.addEventListener(
"click",
async function(){

  startButton.disabled =
    true;

  startButton.textContent =
    "STARTING...";

  errorBox.textContent =
    "";


  try{

    if(
      !window.isSecureContext
    ){

      throw new Error(
        "HTTPSで開いてください。"
      );
    }


    /* =====================================================
       ★STEP 1

       この場所ではまだ
       awaitを一度も実行していない。

       STARTボタンのタップイベント
       そのものの中。

       iOSで非常に重要。
    ===================================================== */


    let orientationPermissionPromise =
      null;


    let motionPermissionPromise =
      null;


    /*
      ★方向センサー許可

      Promiseを取得するだけ。

      ここではawaitしない。
    */

    if(
      typeof DeviceOrientationEvent
      !== "undefined"

      &&

      typeof DeviceOrientationEvent
        .requestPermission
      === "function"
    ){

      orientationPermissionPromise =

        DeviceOrientationEvent
          .requestPermission();
    }


    /*
      ★モーション許可

      これも同じユーザー操作内で
      即座に要求開始。

      awaitしない。
    */

    if(
      typeof DeviceMotionEvent
      !== "undefined"

      &&

      typeof DeviceMotionEvent
        .requestPermission
      === "function"
    ){

      motionPermissionPromise =

        DeviceMotionEvent
          .requestPermission();
    }


    /* =====================================================
       ★STEP 2

       センサー許可要求を開始したので
       ここからawaitしてよい。
    ===================================================== */


    if(
      orientationPermissionPromise
    ){

      const result =

        await orientationPermissionPromise;


      if(
        result !== "granted"
      ){

        throw new Error(
          "方向センサーが許可されませんでした。"
        );
      }
    }


    if(
      motionPermissionPromise
    ){

      const result =

        await motionPermissionPromise;


      if(
        result !== "granted"
      ){

        throw new Error(
          "モーションセンサーが許可されませんでした。"
        );
      }
    }


    /* =====================================================
       ★STEP 3
       CAMERA
    ===================================================== */

    if(
      !navigator.mediaDevices

      ||

      typeof navigator
        .mediaDevices
        .getUserMedia
      !== "function"
    ){

      throw new Error(
        "このブラウザではカメラを使用できません。"
      );
    }


    let stream;


    /*
      背面カメラ
    */

    try{

      stream =

        await navigator
          .mediaDevices
          .getUserMedia({

            video:{

              facingMode:{
                ideal:"environment"
              },

              width:{
                ideal:1920
              },

              height:{
                ideal:1080
              }

            },

            audio:false
          });

    }

    catch(firstError){

      /*
        一部Androidなどで
        facingMode指定が失敗した場合
      */

      console.warn(
        firstError
      );


      stream =

        await navigator
          .mediaDevices
          .getUserMedia({

            video:true,

            audio:false
          });
    }


    /* =====================================================
       CAMERA VIDEO
    ===================================================== */

    camera.srcObject =
      stream;


    camera.muted =
      true;


    camera.playsInline =
      true;


    await camera.play();


    /* =====================================================
       SENSOR LISTENERS
    ===================================================== */

    window.addEventListener(
      "deviceorientation",
      orientationHandler,
      true
    );


    window.addEventListener(
      "devicemotion",
      motionHandler,
      {
        passive:true
      }
    );


    /* =====================================================
       START GAME
    ===================================================== */

    hp =
      MAX_HP;


    locked =
      false;


    sensorReady =
      false;


    spawnCreature();


    updateHP();


    /*
      最初はPIXEL
    */

    setDisplayMode(
      "pixel"
    );


    start.style.display =
      "none";


    hud.style.display =
      "block";


    sensorWait.style.display =
      "block";


    running =
      true;


    lastTime =
      performance.now();


    requestAnimationFrame(
      cameraLoop
    );


    requestAnimationFrame(
      gameLoop
    );

  }

  catch(e){

    console.error(e);


    startButton.disabled =
      false;


    startButton.textContent =
      "START";


    let message =

      (e.name || "ERROR")

      +

      "\n"

      +

      (
        e.message ||
        String(e)
      );


    if(
      !window.isSecureContext
    ){

      message +=
        "\n\nGitHub PagesのHTTPS URLから開いてください。";
    }


    else if(
      String(
        e.message
      )
      .toLowerCase()
      .includes(
        "user gesture"
      )
    ){

      message +=

        "\n\nセンサー許可がユーザー操作として認識されませんでした。" +

        "\nSTARTをもう一度タップしてください。";
    }


    else if(
      e.name ===
      "NotAllowedError"
    ){

      message +=

        "\n\nカメラまたはセンサーが拒否されています。" +

        "\nSafari / Chromeのサイト設定を確認してください。";
    }


    else if(
      e.name ===
      "NotFoundError"
    ){

      message +=
        "\n\nカメラが見つかりませんでした。";
    }


    else if(
      e.name ===
      "NotReadableError"
    ){

      message +=

        "\n\nカメラを開始できません。" +

        "\n他のカメラアプリを閉じてから試してください。";
    }


    errorBox.textContent =
      message;
  }

});


/* =========================================================
   CAMERA LOOP
========================================================= */

function cameraLoop(){

  if(!running){
    return;
  }


  if(
    displayMode === "pixel"

    &&

    camera.readyState >= 2

    &&

    camera.videoWidth > 0
  ){

    drawPixelCamera();
  }


  requestAnimationFrame(
    cameraLoop
  );
}


/* =========================================================
   70 DOT PIXEL CAMERA

   色加工は一切しない。
========================================================= */

function drawPixelCamera(){

  const vw =
    camera.videoWidth;


  const vh =
    camera.videoHeight;


  if(
    !vw ||
    !vh
  ){
    return;
  }


  const screenRatio =
    W/H;


  const videoRatio =
    vw/vh;


  let sx =
    0;

  let sy =
    0;

  let sw =
    vw;

  let sh =
    vh;


  /*
    object-fit:cover と
    同じ切り抜き
  */

  if(
    videoRatio >
    screenRatio
  ){

    sw =
      vh *
      screenRatio;


    sx =
      (
        vw-sw
      )
      /
      2;

  }else{

    sh =
      vw /
      screenRatio;


    sy =
      (
        vh-sh
      )
      /
      2;
  }


  pixelW =
    PIXEL_WIDTH;


  pixelH =

    Math.max(

      1,

      Math.round(

        PIXEL_WIDTH

        *

        H/W
      )
    );


  if(
    rawCanvas.width !== pixelW

    ||

    rawCanvas.height !== pixelH
  ){

    rawCanvas.width =
      pixelW;


    rawCanvas.height =
      pixelH;


    world.width =
      pixelW;


    world.height =
      pixelH;


    /*
      縮小は平均化
    */

    rawCtx.imageSmoothingEnabled =
      true;


    /*
      拡大は補間しない
    */

    wctx.imageSmoothingEnabled =
      false;
  }


  /*
    ★色加工なし
  */

  rawCtx.drawImage(

    camera,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    pixelW,
    pixelH
  );


  wctx.drawImage(
    rawCanvas,
    0,
    0
  );
}


/* =========================================================
   ORIENTATION
========================================================= */

function orientationHandler(e){

  if(
    !Number.isFinite(e.alpha)

    ||

    !Number.isFinite(e.beta)

    ||

    !Number.isFinite(e.gamma)
  ){
    return;
  }


  const alpha =
    rad(e.alpha);


  const beta =
    rad(e.beta);


  const gamma =
    rad(e.gamma);


  const ca =
    Math.cos(alpha);

  const sa =
    Math.sin(alpha);

  const cb =
    Math.cos(beta);

  const sb =
    Math.sin(beta);

  const cg =
    Math.cos(gamma);

  const sg =
    Math.sin(gamma);


  /*
    カメラ前方ベクトル
  */

  let x =
    0;

  let y =
    0;

  let z =
    -1;


  /* GAMMA */

  let x1 =
    cg*x +
    sg*z;


  let y1 =
    y;


  let z1 =
    -sg*x +
    cg*z;


  /* BETA */

  let x2 =
    x1;


  let y2 =
    cb*y1 -
    sb*z1;


  let z2 =
    sb*y1 +
    cb*z1;


  /* ALPHA */

  let wx =
    ca*x2 -
    sa*y2;


  let wy =
    sa*x2 +
    ca*y2;


  let wz =
    z2;


  /* =====================================================
     SCREEN ROTATION
  ===================================================== */

  let screenAngle =
    0;


  if(
    screen.orientation

    &&

    typeof screen.orientation.angle
    === "number"
  ){

    screenAngle =
      screen.orientation.angle;

  }

  else if(
    typeof window.orientation
    === "number"
  ){

    screenAngle =
      window.orientation;
  }


  if(
    screenAngle !== 0
  ){

    const r =
      rad(
        -screenAngle
      );


    const c =
      Math.cos(r);


    const s =
      Math.sin(r);


    const nx =
      c*wx -
      s*wy;


    const ny =
      s*wx +
      c*wy;


    wx =
      nx;


    wy =
      ny;
  }


  /* =====================================================
     PITCH
  ===================================================== */

  const horizontal =

    Math.sqrt(

      wx*wx +

      wy*wy
    );


  targetPitch =

    clamp(

      deg(

        Math.atan2(

          wz,

          horizontal
        )
      ),

      -90,

      90
    );


  /* =====================================================
     YAW
  ===================================================== */

  let yaw =

    deg(

      Math.atan2(

        wx,

        -wy
      )
    );


  yaw =
    normalize360(
      yaw
    );


  /*
    iPhone compass
  */

  if(
    typeof e.webkitCompassHeading
    === "number"

    &&

    Number.isFinite(
      e.webkitCompassHeading
    )

    &&

    horizontal > .15
  ){

    yaw =
      normalize360(
        e.webkitCompassHeading
      );
  }


  targetYaw =
    yaw;


  if(
    !sensorReady
  ){

    cameraYaw =
      targetYaw;


    cameraPitch =
      targetPitch;


    sensorReady =
      true;


    sensorWait.style.display =
      "none";
  }
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

  if(!running){
    return;
  }


  let dt =

    (
      time -
      lastTime
    )

    /

    1000;


  lastTime =
    time;


  dt =
    Math.min(
      dt,
      .05
    );


  /* =====================================================
     SENSOR SMOOTH
  ===================================================== */

  if(sensorReady){

    cameraYaw =

      smoothAngle(

        cameraYaw,

        targetYaw,

        YAW_SMOOTH
      );


    cameraPitch +=

      (
        targetPitch -
        cameraPitch
      )

      *

      PITCH_SMOOTH;
  }


  /* =====================================================
     LOCK
  ===================================================== */

  if(locked){

    const remaining =
      lockEnd -
      time;


    hp -=
      DAMAGE_PER_SECOND *
      dt;


    hp =
      Math.max(
        0,
        hp
      );


    updateHP();


    if(hp <= 0){

      hp =
        0;


      updateHP();


      locked =
        false;


      running =
        false;


      lockText.textContent =
        "★ CAPTURED ★";


      lockText.style.display =
        "block";


      timer.style.display =
        "none";


      renderGame(
        time
      );


      return;
    }


    if(
      remaining <= 0
    ){

      locked =
        false;


      lockText.style.display =
        "none";


      timer.style.display =
        "none";


      startEscape();

    }else{

      timer.textContent =

        (
          remaining /
          1000
        )

        .toFixed(1);
    }
  }


  /* =====================================================
     ESCAPE
  ===================================================== */

  else if(escaping){

    const move =
      escapeSpeed *
      dt;


    /*
      一度決めた左右方向へ逃げる。
      途中で反転しない。
    */

    creatureYaw =

      normalize360(

        creatureYaw

        +

        escapeDirection

        *

        move
      );


    creaturePitch =
      creatureBasePitch;


    escapeTravel +=
      move;


    if(
      escapeTravel >=
      escapeDistance
    ){

      escaping =
        false;
    }
  }


  /* =====================================================
     VISIBILITY
  ===================================================== */

  if(sensorReady){

    const dx =

      angleDiff(

        creatureYaw,

        cameraYaw
      );


    const dy =

      creaturePitch

      -

      cameraPitch;


    creatureVisible =

      Math.abs(dx)
      <
      HFOV/2

      &&

      Math.abs(dy)
      <
      VFOV/2;


    /*
      最初に発見した瞬間
      逃げ始める。
    */

    if(
      creatureVisible

      &&

      !discovered
    ){

      discovered =
        true;


      startEscape();
    }
  }


  renderGame(
    time
  );


  requestAnimationFrame(
    gameLoop
  );
}


/* =========================================================
   ESCAPE
========================================================= */

function startEscape(){

  discovered =
    true;


  escaping =
    true;


  escapeTravel =
    0;


  /*
    左右ランダム
  */

  escapeDirection =

    Math.random() < .5

    ?

    -1

    :

    1;


  escapeSpeed =

    random(

      ESCAPE_SPEED_MIN,

      ESCAPE_SPEED_MAX
    );


  /*
    55〜160°
  */

  escapeDistance =

    random(

      ESCAPE_DISTANCE_MIN,

      ESCAPE_DISTANCE_MAX
    );


  creatureBobAmplitude =
    random(
      5,
      20
    );


  creatureBobPhase =
    random(
      0,
      Math.PI*2
    );


  creatureBobSpeed =
    random(
      .7,
      1.3
    );
}


/* =========================================================
   360° PROJECTION
========================================================= */

function projectCreature(
  yaw,
  pitch
){

  const dx =

    angleDiff(

      yaw,

      cameraYaw
    );


  const dy =

    pitch

    -

    cameraPitch;


  /*
    キャラが右にある
      → 画面右

    カメラを右に向ける
      → キャラは左へ流れる
  */

  const x =

    W/2

    +

    (
      dx /
      (HFOV/2)
    )

    *

    (
      W/2
    );


  /*
    キャラが上
      → 画面上

    カメラを上に向ける
      → キャラは下へ流れる
  */

  const y =

    H/2

    -

    (
      dy /
      (VFOV/2)
    )

    *

    (
      H/2
    );


  return{

    x,
    y,

    dx,
    dy,

    visible:

      Math.abs(dx)
      <
      HFOV/2

      &&

      Math.abs(dy)
      <
      VFOV/2
  };
}


/* =========================================================
   RENDER
========================================================= */

function renderGame(time){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawCreature(
    time
  );


  debug.innerHTML =

    "YAW " +
    cameraYaw.toFixed(1) +
    "°" +

    "<br>PITCH " +
    cameraPitch.toFixed(1) +
    "°" +

    "<br>TYPE " +
    creatureZone +

    "<br>MODE " +
    displayMode.toUpperCase() +

    "<br>PIXEL " +
    pixelW +
    "×" +
    pixelH +

    "<br>HP " +
    Math.ceil(hp);
}


/* =========================================================
   DRAW CREATURE
========================================================= */

function drawCreature(time){

  if(!creatureVisible){
    return;
  }


  const p =

    projectCreature(

      creatureYaw,

      creaturePitch
    );


  if(!p.visible){
    return;
  }


  const bob =

    Math.sin(

      time *
      .001 *
      creatureBobSpeed

      +

      creatureBobPhase
    )

    *

    creatureBobAmplitude;


  const x =
    Math.round(
      p.x
    );


  const y =
    Math.round(
      p.y + bob
    );


  const size =

    clamp(

      Math.min(
        W,
        H
      )

      *

      .09,

      38,

      68
    );


  const bodyColor =

    locked

    ?

    "#40e8ff"

    :

    "#8458e8";


  ctx.save();


  ctx.translate(
    x,
    y
  );


  /* SHADOW */

  ctx.fillStyle =
    "rgba(0,0,0,.4)";


  ctx.fillRect(
    -size*.36,
    size*.38,
    size*.72,
    size*.12
  );


  /* BODY OUTLINE */

  ctx.fillStyle =
    "#17121e";


  ctx.fillRect(
    -size*.37,
    -size*.30,
    size*.74,
    size*.60
  );


  /* BODY */

  ctx.fillStyle =
    bodyColor;


  ctx.fillRect(
    -size*.31,
    -size*.24,
    size*.62,
    size*.49
  );


  /* EARS */

  ctx.fillStyle =
    "#17121e";


  ctx.fillRect(
    -size*.40,
    -size*.46,
    size*.18,
    size*.27
  );


  ctx.fillRect(
    size*.22,
    -size*.46,
    size*.18,
    size*.27
  );


  ctx.fillStyle =
    bodyColor;


  ctx.fillRect(
    -size*.35,
    -size*.40,
    size*.09,
    size*.18
  );


  ctx.fillRect(
    size*.26,
    -size*.40,
    size*.09,
    size*.18
  );


  /* EYES */

  ctx.fillStyle =
    "#fff";


  ctx.fillRect(
    -size*.23,
    -size*.12,
    size*.16,
    size*.15
  );


  ctx.fillRect(
    size*.07,
    -size*.12,
    size*.16,
    size*.15
  );


  /* PUPILS */

  ctx.fillStyle =
    "#111";


  ctx.fillRect(
    -size*.15,
    -size*.08,
    size*.06,
    size*.08
  );


  ctx.fillRect(
    size*.09,
    -size*.08,
    size*.06,
    size*.08
  );


  /* MOUTH */

  ctx.fillRect(
    -size*.09,
    size*.10,
    size*.18,
    size*.055
  );


  /* LEGS */

  ctx.fillStyle =
    "#17121e";


  ctx.fillRect(
    -size*.26,
    size*.23,
    size*.11,
    size*.27
  );


  ctx.fillRect(
    -size*.055,
    size*.23,
    size*.11,
    size*.30
  );


  ctx.fillRect(
    size*.15,
    size*.23,
    size*.11,
    size*.27
  );


  ctx.fillStyle =
    bodyColor;


  ctx.fillRect(
    -size*.22,
    size*.24,
    size*.05,
    size*.21
  );


  ctx.fillRect(
    -size*.025,
    size*.24,
    size*.05,
    size*.24
  );


  ctx.fillRect(
    size*.17,
    size*.24,
    size*.05,
    size*.21
  );


  /* =====================================================
     LOCK EFFECT
  ===================================================== */

  if(locked){

    const pulse =

      Math.round(

        size

        *

        (
          .65

          +

          Math.sin(
            time*.015
          )

          *

          .04
        )
      );


    ctx.strokeStyle =
      "#fff";


    ctx.lineWidth =
      4;


    ctx.strokeRect(
      -pulse,
      -pulse,
      pulse*2,
      pulse*2
    );


    ctx.fillStyle =
      "#fff";


    ctx.fillRect(
      -pulse-8,
      -3,
      6,
      6
    );


    ctx.fillRect(
      pulse+2,
      -3,
      6,
      6
    );


    ctx.fillRect(
      -3,
      -pulse-8,
      6,
      6
    );


    ctx.fillRect(
      -3,
      pulse+2,
      6,
      6
    );
  }


  ctx.restore();
}


/* =========================================================
   SHAKE
========================================================= */

function motionHandler(e){

  if(
    !running

    ||

    !creatureVisible

    ||

    locked
  ){
    return;
  }


  const a =
    e.accelerationIncludingGravity;


  if(!a){
    return;
  }


  const x =
    a.x || 0;

  const y =
    a.y || 0;

  const z =
    a.z || 0;


  const magnitude =

    Math.sqrt(

      x*x +

      y*y +

      z*z
    );


  const shake =

    Math.abs(

      magnitude

      -

      9.81
    );


  if(
    shake <
    SHAKE_THRESHOLD
  ){
    return;
  }


  const now =
    performance.now();


  if(
    now -
    lastShake
    <
    500
  ){
    return;
  }


  lastShake =
    now;


  lockCreature(
    shake
  );
}


/* =========================================================
   LOCK
========================================================= */

function lockCreature(power){

  if(
    !creatureVisible

    ||

    locked
  ){
    return;
  }


  locked =
    true;


  /*
    その場で停止
  */

  escaping =
    false;


  /*
    1.5〜6秒
  */

  let seconds =

    MIN_LOCK

    +

    (
      power

      -

      SHAKE_THRESHOLD
    )

    *

    .35;


  seconds =

    clamp(

      seconds,

      MIN_LOCK,

      MAX_LOCK
    );


  lockEnd =

    performance.now()

    +

    seconds *
    1000;


  lockText.textContent =
    "⚡ LOCK!";


  lockText.style.display =
    "block";


  timer.style.display =
    "block";


  timer.textContent =
    seconds.toFixed(1);


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [
        70,
        40,
        120
      ]
    );
  }
}


/* =========================================================
   HP
========================================================= */

function updateHP(){

  hpNumber.textContent =
    Math.ceil(
      hp
    );


  hpInner.style.width =

    (
      hp /
      MAX_HP *
      100
    )

    +

    "%";
}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera(){

  running =
    false;


  const stream =
    camera.srcObject;


  if(!stream){
    return;
  }


  stream
    .getTracks()
    .forEach(
      track=>{
        track.stop();
      }
    );


  camera.srcObject =
    null;
}


window.addEventListener(
  "pagehide",
  stopCamera
);


window.addEventListener(
  "beforeunload",
  stopCamera
);

</script>
