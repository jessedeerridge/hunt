<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>横移動AR実験</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

#character{
  position:fixed;
  left:50%;
  top:50%;
  width:100px;
  height:100px;
  transform:translate(-50%,-50%);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:75px;
  filter:drop-shadow(0 5px 5px #0008);
  z-index:5;
  pointer-events:none;
}

#start{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#111;
  color:white;
  z-index:20;
  padding:30px;
  text-align:center;
}

#start h1{
  font-size:26px;
}

#start p{
  opacity:.7;
  line-height:1.7;
}

#startButton{
  margin-top:20px;
  border:0;
  border-radius:100px;
  padding:18px 28px;
  font-size:18px;
  font-weight:bold;
}

#debug{
  position:fixed;
  top:calc(15px + env(safe-area-inset-top));
  left:15px;
  z-index:10;
  color:white;
  background:#0009;
  padding:12px 14px;
  border-radius:12px;
  font-family:monospace;
  font-size:12px;
  line-height:1.6;
  display:none;
  backdrop-filter:blur(8px);
}

#centerLine{
  position:fixed;
  top:0;
  bottom:0;
  left:50%;
  width:1px;
  background:#ffffff55;
  z-index:3;
  display:none;
}

#reset{
  position:fixed;
  bottom:calc(25px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  display:none;

  border:0;
  border-radius:100px;
  padding:14px 24px;
  font-weight:bold;
  background:#000a;
  color:white;
}

#error{
  margin-top:20px;
  color:#ff8b8b;
  font-size:13px;
  white-space:pre-line;
}
</style>
</head>

<body>

<video
  id="camera"
  autoplay
  muted
  playsinline>
</video>

<div id="centerLine"></div>

<div id="character">👾</div>

<div id="debug">
  X加速度: <span id="accel">0.000</span><br>
  推定速度: <span id="velocity">0.000</span><br>
  キャラX: <span id="position">0</span><br>
  センサー: <span id="sensorStatus">待機</span>
</div>

<button id="reset">
  中央に戻す
</button>

<div id="start">

  <h1>📱 横移動テスト</h1>

  <p>
    カメラとモーションセンサーを使います。<br><br>
    起動後、スマホを<strong>傾けずに</strong><br>
    左右へ平行移動してみてください。
  </p>

  <button id="startButton">
    カメラ＋センサー起動
  </button>

  <div id="error"></div>

</div>

<script>

const camera =
  document.getElementById("camera");

const character =
  document.getElementById("character");

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("startButton");

const debug =
  document.getElementById("debug");

const reset =
  document.getElementById("reset");

const centerLine =
  document.getElementById("centerLine");

const errorBox =
  document.getElementById("error");

const accelText =
  document.getElementById("accel");

const velocityText =
  document.getElementById("velocity");

const positionText =
  document.getElementById("position");

const sensorStatus =
  document.getElementById("sensorStatus");


/* ==========================================
   移動データ
========================================== */

let characterX =
  window.innerWidth / 2;

let velocity = 0;

let filteredAcceleration = 0;

let lastTime = null;


/*
 感度

 大きくするとキャラが大きく動く
*/

const sensitivity = 150;


/*
 小さなセンサーノイズを無視
*/

const deadZone = 0.08;


/*
 速度減衰

 1に近いほど慣性が強い
*/

const friction = 0.90;


/* ==========================================
   START
========================================== */

startButton.addEventListener(
  "click",
  async () => {

    errorBox.textContent = "";

    try{

      /* ==============================
         CAMERA
      ============================== */

      if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ){
        throw new Error(
          "カメラAPIが使用できません。\nHTTPSのSafariで開いてください。"
        );
      }


      const stream =
        await navigator.mediaDevices.getUserMedia({

          audio:false,

          video:{
            facingMode:{
              ideal:"environment"
            }
          }

        });


      camera.srcObject =
        stream;

      await camera.play();


      /* ==============================
         iPhone MOTION PERMISSION
      ============================== */

      if(
        typeof DeviceMotionEvent !==
        "undefined"
      ){

        if(
          typeof DeviceMotionEvent.requestPermission ===
          "function"
        ){

          const permission =
            await DeviceMotionEvent.requestPermission();

          if(permission !== "granted"){

            throw new Error(
              "モーションセンサーの使用が許可されませんでした。"
            );

          }

        }

      }


      /* ==============================
         SENSOR
      ============================== */

      window.addEventListener(
        "devicemotion",
        motionHandler
      );


      /* ==============================
         SHOW
      ============================== */

      camera.style.display =
        "block";

      character.style.display =
        "flex";

      debug.style.display =
        "block";

      reset.style.display =
        "block";

      centerLine.style.display =
        "block";

      start.style.display =
        "none";

      sensorStatus.textContent =
        "動作中";

    }

    catch(error){

      console.error(error);

      errorBox.textContent =
        error.message ||
        "起動できませんでした。";

    }

  }
);


/* ==========================================
   MOTION SENSOR
========================================== */

function motionHandler(event){

  /*
    acceleration は
    重力を除いた加速度。

    x = 左右方向
  */

  const acceleration =
    event.acceleration;

  if(!acceleration){
    return;
  }


  let ax =
    acceleration.x || 0;


  /* ======================================
     NOISE FILTER
  ====================================== */

  filteredAcceleration =
    filteredAcceleration * 0.75 +
    ax * 0.25;


  let usableAcceleration =
    filteredAcceleration;


  /* ======================================
     DEAD ZONE
  ====================================== */

  if(
    Math.abs(usableAcceleration)
    < deadZone
  ){

    usableAcceleration = 0;

  }


  /* ======================================
     TIME
  ====================================== */

  const now =
    performance.now();


  if(lastTime === null){

    lastTime = now;
    return;

  }


  let dt =
    (now - lastTime) / 1000;


  lastTime = now;


  /*
    センサーイベントが一瞬止まった場合の
    大ジャンプ防止
  */

  dt =
    Math.min(dt,0.1);


  /* ======================================
     ACCELERATION → VELOCITY
  ====================================== */

  velocity +=
    usableAcceleration *
    sensitivity *
    dt;


  /*
    加速度だけだと速度が永遠に残るので
    徐々に減衰させる
  */

  velocity *= friction;


  /* ======================================
     PHONE →
     CHARACTER ←

     ARっぽくするため逆方向
  ====================================== */

  characterX -=
    velocity * dt;


  /* ======================================
     LIMIT
  ====================================== */

  const half =
    character.offsetWidth / 2;


  characterX =
    Math.max(
      half,
      Math.min(
        window.innerWidth - half,
        characterX
      )
    );


  /* ======================================
     DISPLAY
  ====================================== */

  character.style.left =
    characterX + "px";


  /* ======================================
     DEBUG
  ====================================== */

  accelText.textContent =
    usableAcceleration.toFixed(3);

  velocityText.textContent =
    velocity.toFixed(3);

  positionText.textContent =
    Math.round(characterX);

}


/* ==========================================
   RESET
========================================== */

reset.addEventListener(
  "click",
  () => {

    characterX =
      window.innerWidth / 2;

    velocity = 0;

    filteredAcceleration = 0;

    lastTime = null;

    character.style.left =
      "50%";

  }
);


/* ==========================================
   RESIZE
========================================== */

window.addEventListener(
  "resize",
  () => {

    characterX =
      Math.min(
        characterX,
        window.innerWidth -
        character.offsetWidth / 2
      );

  }
);

</script>

</body>
</html>
