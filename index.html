<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PIXEL CAMERA HUNT 360</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  touch-action:none;font-family:monospace
}
#camera,#world,#game{position:fixed;inset:0;width:100%;height:100%}
#camera{object-fit:cover;background:#000;z-index:0;display:none}
#world{z-index:0;background:#000;image-rendering:pixelated}
#game{z-index:2;pointer-events:none;image-rendering:pixelated}
#hud{
  position:fixed;inset:0;z-index:10;
  display:none;pointer-events:none
}
#hp{
  position:absolute;
  top:calc(14px + env(safe-area-inset-top));
  left:50%;transform:translateX(-50%);
  width:min(82vw,390px)
}
#hpText{
  color:#fff;font-size:13px;font-weight:900;
  text-shadow:2px 2px #000
}
#hpOuter{
  height:17px;margin-top:5px;border:3px solid #fff;
  background:#111;box-shadow:3px 3px #000
}
#hpInner{width:100%;height:100%;background:#fff}

#lock{
  position:absolute;top:18%;left:50%;
  transform:translate(-50%,-50%);
  display:none;padding:9px 15px;background:#111;
  border:3px solid #fff;box-shadow:4px 4px #000;
  color:#fff;font-size:22px;font-weight:900
}
#timer{
  position:absolute;bottom:17%;left:50%;
  transform:translateX(-50%);
  display:none;padding:6px 12px;background:#111;
  border:3px solid #fff;box-shadow:4px 4px #000;
  color:#fff;font-size:30px;font-weight:900
}
#cooldown{
  position:absolute;top:25%;left:50%;
  transform:translateX(-50%);
  display:none;padding:7px 12px;
  background:rgba(0,0,0,.72);
  border:2px solid #fff;color:#fff;
  font-size:13px;font-weight:900
}
#sensorWait{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  display:none;padding:10px 17px;background:#111;
  border:3px solid #fff;color:#fff;font-weight:900
}
#modeSwitch{
  position:absolute;left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  display:flex;gap:5px;padding:5px;
  background:rgba(0,0,0,.68);
  border:2px solid #fff;pointer-events:auto
}
#modeSwitch button{
  min-width:92px;padding:11px 16px;border:0;
  background:transparent;color:#fff;
  font:900 12px monospace
}
#modeSwitch button.active{background:#fff;color:#111}
#debug{
  position:absolute;right:6px;bottom:6px;
  padding:5px 7px;background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.7);
  color:#fff;font-size:8px;line-height:1.45
}
#start{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  padding:25px;background:#161925;color:#fff;text-align:center
}
#startIcon{font-size:64px}
#start h1{margin:8px 0 10px;font-size:25px}
#start p{
  max-width:430px;margin:5px 0;
  font-size:13px;line-height:1.7;opacity:.86
}
#secureStatus{
  margin-top:12px;padding:6px 10px;
  border:1px solid rgba(255,255,255,.35);
  font-size:11px
}
#startButton{
  min-width:250px;margin-top:18px;padding:17px 25px;
  border:3px solid #fff;background:#fff;color:#111;
  box-shadow:6px 6px #000;font:900 16px monospace
}
#startButton:active{
  transform:translate(3px,3px);box-shadow:3px 3px #000
}
#startButton:disabled{opacity:.55}
#error{
  max-width:430px;margin-top:16px;color:#faa;
  font-size:11px;line-height:1.55;white-space:pre-line
}
</style>
</head>

<body>

<video id="camera" autoplay muted playsinline></video>
<canvas id="world"></canvas>
<canvas id="game"></canvas>

<div id="hud">

  <div id="hp">
    <div id="hpText">
      CREATURE HP <span id="hpNumber">100</span> / 100
    </div>
    <div id="hpOuter"><div id="hpInner"></div></div>
  </div>

  <div id="lock">⚡ LOCK!</div>
  <div id="timer">5.0</div>
  <div id="cooldown">LOCK DISABLED 3.0</div>
  <div id="sensorWait">SENSOR...</div>

  <div id="modeSwitch">
    <button id="pixelMode" class="active">PIXEL</button>
    <button id="cameraMode">CAMERA</button>
  </div>

  <div id="debug"></div>
</div>

<div id="start">
  <div id="startIcon">👾</div>
  <h1>PIXEL CAMERA HUNT 360</h1>
  <p>
    STARTをタップしてください。<br><br>
    360°スマホを動かしてキャラクターを探します。<br>
    発見すると0.5秒後に気づき、高速で逃走します。<br><br>
    キャラクターを捉えながらスマホを振るとロック。<br>
    <b>振っている間だけロックが続きます。</b><br>
    振るのをやめると即解除されます。
  </p>
  <div id="secureStatus">CHECKING...</div>
  <button id="startButton">START</button>
  <div id="error"></div>
</div>

<script>
"use strict";

/* =========================================================
   ELEMENT
========================================================= */

const camera = document.getElementById("camera");
const world = document.getElementById("world");
const wctx = world.getContext("2d",{alpha:false});

const game = document.getElementById("game");
const ctx = game.getContext("2d");

const start = document.getElementById("start");
const startButton = document.getElementById("startButton");
const errorBox = document.getElementById("error");
const secureStatus = document.getElementById("secureStatus");
const hud = document.getElementById("hud");

const hpNumber = document.getElementById("hpNumber");
const hpInner = document.getElementById("hpInner");

const lockText = document.getElementById("lock");
const timer = document.getElementById("timer");
const cooldownText = document.getElementById("cooldown");
const sensorWait = document.getElementById("sensorWait");
const debug = document.getElementById("debug");

const pixelModeButton = document.getElementById("pixelMode");
const cameraModeButton = document.getElementById("cameraMode");

/* =========================================================
   HTTPS
========================================================= */

if(window.isSecureContext){
  secureStatus.textContent = "✓ SECURE";
}else{
  secureStatus.textContent = "⚠ HTTPS REQUIRED";
  secureStatus.style.color = "#ff9999";
}

/* =========================================================
   SCREEN
========================================================= */

let W = innerWidth;
let H = innerHeight;
let DPR = 1;

function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR = Math.min(devicePixelRatio || 1,2);

  game.width = Math.round(W*DPR);
  game.height = Math.round(H*DPR);

  game.style.width = W+"px";
  game.style.height = H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = false;
}

addEventListener("resize",resize);
addEventListener("orientationchange",()=>setTimeout(resize,250));

resize();

/* =========================================================
   PIXEL CAMERA
========================================================= */

const PIXEL_WIDTH = 70;

const rawCanvas = document.createElement("canvas");
const rawCtx = rawCanvas.getContext("2d",{alpha:false});

let pixelW = PIXEL_WIDTH;
let pixelH = 100;

/* =========================================================
   MODE
========================================================= */

let displayMode = "pixel";

function setDisplayMode(mode){

  displayMode = mode;

  if(mode === "pixel"){

    world.style.display = "block";
    camera.style.display = "none";

    pixelModeButton.classList.add("active");
    cameraModeButton.classList.remove("active");

  }else{

    world.style.display = "none";
    camera.style.display = "block";

    pixelModeButton.classList.remove("active");
    cameraModeButton.classList.add("active");
  }
}

pixelModeButton.onclick = ()=>setDisplayMode("pixel");
cameraModeButton.onclick = ()=>setDisplayMode("camera");

/* =========================================================
   SETTINGS
========================================================= */

const HFOV = 68;
const VFOV = 55;

const MAX_HP = 100;
const DAMAGE_PER_SECOND = 12;

/*
  SHAKE

  SHAKE_THRESHOLD:
  この値以上で振っている判定。

  SHAKE_RELEASE_DELAY:
  最後に振動を検出してから
  180ms経ったら「振るのをやめた」とする。
*/

const SHAKE_THRESHOLD = 9;
const SHAKE_RELEASE_THRESHOLD = 4.0;
const SHAKE_RELEASE_DELAY = 180;

const MAX_LOCK = 5;
const LOCK_COOLDOWN = 3000;

const NOTICE_DELAY = 500;
const NOTICE_DURATION = 220;

/* WALK */

const WALK_SPEED_MIN = 22;
const WALK_SPEED_MAX = 29;

/* RUN */

const RUN_SPEED_MIN = 75;
const RUN_SPEED_MAX = 100;

/* RELEASE RUN */

const RELEASE_RUN_MIN = 95;
const RELEASE_RUN_MAX = 125;

/* RUN DISTANCE */

const RUN_DISTANCE_MIN = 90;
const RUN_DISTANCE_MAX = 160;

/* 60% reverse */

const RUN_REVERSE_CHANCE = .60;

/* SLEEP */

const NORMAL_SLEEP_CHANCE = .30;
const LONG_SLEEP_CHANCE = .50;
const LONG_UNSEEN_TIME = 30000;

const SLEEP_MIN = 2500;
const SLEEP_MAX = 6000;

const SLEEP_CHECK_MIN = 3500;
const SLEEP_CHECK_MAX = 7000;

/* SENSOR */

const YAW_SMOOTH = .24;
const PITCH_SMOOTH = .20;

/* =========================================================
   ZONES
========================================================= */

const CREATURE_ZONES = {

  SKY:{
    minPitch:20,
    maxPitch:34
  },

  FRONT:{
    minPitch:-6,
    maxPitch:6
  },

  EARTH:{
    minPitch:-34,
    maxPitch:-20
  }
};

/* =========================================================
   SENSOR STATE
========================================================= */

let cameraYaw = 0;
let cameraPitch = 0;

let targetYaw = 0;
let targetPitch = 0;

let sensorReady = false;

/* =========================================================
   CREATURE
========================================================= */

let creatureZone = "FRONT";

let creatureYaw = 0;
let creaturePitch = 0;
let creatureBasePitch = 0;

let moveDirection =
  Math.random() < .5 ? -1 : 1;

let walkSpeed = 25;

/* RUN */

let runningAway = false;

let runSpeed = 0;
let runDistance = 0;
let runTravel = 0;

/* BOB */

let bobAmplitude = 10;
let bobPhase = 0;
let bobSpeed = 1;

/* VISIBLE */

let creatureVisible = false;
let wasCreatureVisible = false;

/* DETECTION */

let detected = false;
let detectedAt = 0;

/* SLEEP */

let sleeping = false;
let sleepUntil = 0;
let nextSleepCheck = 0;
let lastDetectedTime = 0;

/* =========================================================
   ANIMATION
========================================================= */

let animState = "move";
let animFrame = 1;
let animStateStart = 0;

let nextSpecialTime = 0;
let nextAttackTime = 0;

/* =========================================================
   LOCK STATE
========================================================= */

let locked = false;

/*
  ロックを開始した時刻
*/

let lockStartedAt = 0;

/*
  最大5秒の終了時刻
*/

let lockEnd = 0;

/*
  最後にSHAKEを検出した時刻
*/

let lastShakeActivity = 0;

/*
  現在のSHAKE強度
*/

let currentShakePower = 0;

/*
  再ロック禁止
*/

let lockCooldownUntil = 0;

/* =========================================================
   GAME
========================================================= */

let gameRunning = false;
let hp = MAX_HP;

let lastTime = 0;

/* =========================================================
   MATH
========================================================= */

function rad(v){
  return v*Math.PI/180;
}

function deg(v){
  return v*180/Math.PI;
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function random(min,max){
  return Math.random()*(max-min)+min;
}

function normalize360(a){

  a %= 360;

  if(a < 0){
    a += 360;
  }

  return a;
}

function angleDiff(target,current){

  let d =
    normalize360(target)-
    normalize360(current);

  if(d > 180){
    d -= 360;
  }

  if(d < -180){
    d += 360;
  }

  return d;
}

function smoothAngle(current,target,amount){

  return normalize360(
    current+
    angleDiff(target,current)*
    amount
  );
}

/* =========================================================
   SPAWN
========================================================= */

function spawnCreature(){

  const now = performance.now();

  const types = [
    "SKY",
    "FRONT",
    "EARTH"
  ];

  creatureZone =
    types[
      Math.floor(
        Math.random()*types.length
      )
    ];

  const zone =
    CREATURE_ZONES[creatureZone];

  creatureYaw =
    random(0,360);

  creatureBasePitch =
    random(
      zone.minPitch,
      zone.maxPitch
    );

  creaturePitch =
    creatureBasePitch;

  moveDirection =
    Math.random() < .5
    ? -1
    : 1;

  walkSpeed =
    random(
      WALK_SPEED_MIN,
      WALK_SPEED_MAX
    );

  runningAway = false;

  runSpeed = 0;
  runDistance = 0;
  runTravel = 0;

  bobAmplitude =
    random(5,20);

  bobPhase =
    random(0,Math.PI*2);

  bobSpeed =
    random(.7,1.25);

  creatureVisible = false;
  wasCreatureVisible = false;

  detected = false;
  detectedAt = 0;

  lastDetectedTime = now;

  /*
    ★30%で初期睡眠
  */

  sleeping =
    Math.random() <
    NORMAL_SLEEP_CHANCE;

  if(sleeping){

    sleepUntil =
      now+
      random(
        SLEEP_MIN,
        SLEEP_MAX
      );

    setAnimation(
      "sleep",
      now
    );

  }else{

    sleepUntil = 0;

    setAnimation(
      "move",
      now
    );
  }

  nextSleepCheck =
    now+
    random(
      SLEEP_CHECK_MIN,
      SLEEP_CHECK_MAX
    );

  nextSpecialTime =
    now+
    random(3000,6500);

  nextAttackTime =
    now+
    random(4500,8500);
}

/* =========================================================
   START
========================================================= */

startButton.addEventListener("click",async()=>{

  startButton.disabled = true;
  startButton.textContent = "STARTING...";
  errorBox.textContent = "";

  try{

    if(!window.isSecureContext){

      throw new Error(
        "HTTPSで開いてください。"
      );
    }

    let orientationPromise = null;
    let motionPromise = null;

    /*
      iOS:
      STARTという1回のユーザー操作から
      センサー許可を要求
    */

    if(
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ){

      orientationPromise =
        DeviceOrientationEvent.requestPermission();
    }

    if(
      typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function"
    ){

      motionPromise =
        DeviceMotionEvent.requestPermission();
    }

    if(orientationPromise){

      const result =
        await orientationPromise;

      if(result !== "granted"){

        throw new Error(
          "方向センサーが許可されませんでした。"
        );
      }
    }

    if(motionPromise){

      const result =
        await motionPromise;

      if(result !== "granted"){

        throw new Error(
          "モーションセンサーが許可されませんでした。"
        );
      }
    }

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "カメラを使用できません。"
      );
    }

    let stream;

    try{

      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },
            width:{
              ideal:1920
            },
            height:{
              ideal:1080
            }
          },

          audio:false
        });

    }catch(e){

      stream =
        await navigator.mediaDevices.getUserMedia({
          video:true,
          audio:false
        });
    }

    camera.srcObject = stream;
    camera.muted = true;
    camera.playsInline = true;

    await camera.play();

    addEventListener(
      "deviceorientation",
      orientationHandler,
      true
    );

    addEventListener(
      "devicemotion",
      motionHandler,
      {passive:true}
    );

    hp = MAX_HP;

    locked = false;

    lockStartedAt = 0;
    lockEnd = 0;
    lastShakeActivity = 0;
    currentShakePower = 0;

    lockCooldownUntil = 0;

    sensorReady = false;

    spawnCreature();

    updateHP();

    setDisplayMode("pixel");

    start.style.display = "none";
    hud.style.display = "block";
    sensorWait.style.display = "block";

    gameRunning = true;

    lastTime =
      performance.now();

    requestAnimationFrame(cameraLoop);
    requestAnimationFrame(gameLoop);

  }catch(e){

    console.error(e);

    startButton.disabled = false;
    startButton.textContent = "START";

    errorBox.textContent =
      (e.name || "ERROR")+
      "\n"+
      (e.message || String(e));
  }
});

/* =========================================================
   CAMERA LOOP
========================================================= */

function cameraLoop(){

  if(!gameRunning){
    return;
  }

  if(
    displayMode === "pixel" &&
    camera.readyState >= 2 &&
    camera.videoWidth > 0
  ){

    drawPixelCamera();
  }

  requestAnimationFrame(cameraLoop);
}

/* =========================================================
   PIXEL CAMERA
========================================================= */

function drawPixelCamera(){

  const vw = camera.videoWidth;
  const vh = camera.videoHeight;

  if(!vw || !vh){
    return;
  }

  const screenRatio = W/H;
  const videoRatio = vw/vh;

  let sx = 0;
  let sy = 0;

  let sw = vw;
  let sh = vh;

  if(videoRatio > screenRatio){

    sw = vh*screenRatio;
    sx = (vw-sw)/2;

  }else{

    sh = vw/screenRatio;
    sy = (vh-sh)/2;
  }

  pixelW = PIXEL_WIDTH;

  pixelH =
    Math.max(
      1,
      Math.round(
        PIXEL_WIDTH*
        H/W
      )
    );

  if(
    rawCanvas.width !== pixelW ||
    rawCanvas.height !== pixelH
  ){

    rawCanvas.width = pixelW;
    rawCanvas.height = pixelH;

    world.width = pixelW;
    world.height = pixelH;

    rawCtx.imageSmoothingEnabled = true;
    wctx.imageSmoothingEnabled = false;
  }

  rawCtx.drawImage(
    camera,
    sx,sy,sw,sh,
    0,0,pixelW,pixelH
  );

  wctx.drawImage(
    rawCanvas,
    0,0
  );
}

/* =========================================================
   ORIENTATION
========================================================= */

function orientationHandler(e){

  if(
    !Number.isFinite(e.alpha) ||
    !Number.isFinite(e.beta) ||
    !Number.isFinite(e.gamma)
  ){
    return;
  }

  const alpha = rad(e.alpha);
  const beta = rad(e.beta);
  const gamma = rad(e.gamma);

  const ca = Math.cos(alpha);
  const sa = Math.sin(alpha);

  const cb = Math.cos(beta);
  const sb = Math.sin(beta);

  const cg = Math.cos(gamma);
  const sg = Math.sin(gamma);

  let x = 0;
  let y = 0;
  let z = -1;

  let x1 = cg*x+sg*z;
  let y1 = y;
  let z1 = -sg*x+cg*z;

  let x2 = x1;
  let y2 = cb*y1-sb*z1;
  let z2 = sb*y1+cb*z1;

  let wx = ca*x2-sa*y2;
  let wy = sa*x2+ca*y2;
  let wz = z2;

  let screenAngle = 0;

  if(
    screen.orientation &&
    typeof screen.orientation.angle === "number"
  ){

    screenAngle =
      screen.orientation.angle;

  }else if(
    typeof window.orientation === "number"
  ){

    screenAngle =
      window.orientation;
  }

  if(screenAngle !== 0){

    const r =
      rad(-screenAngle);

    const c = Math.cos(r);
    const s = Math.sin(r);

    const nx =
      c*wx-s*wy;

    const ny =
      s*wx+c*wy;

    wx = nx;
    wy = ny;
  }

  const horizontal =
    Math.sqrt(
      wx*wx+
      wy*wy
    );

  targetPitch =
    clamp(
      deg(
        Math.atan2(
          wz,
          horizontal
        )
      ),
      -90,
      90
    );

  let yaw =
    deg(
      Math.atan2(
        wx,
        -wy
      )
    );

  yaw =
    normalize360(yaw);

  if(
    typeof e.webkitCompassHeading === "number" &&
    Number.isFinite(e.webkitCompassHeading) &&
    horizontal > .15
  ){

    yaw =
      normalize360(
        e.webkitCompassHeading
      );
  }

  targetYaw = yaw;

  if(!sensorReady){

    cameraYaw = targetYaw;
    cameraPitch = targetPitch;

    sensorReady = true;

    sensorWait.style.display =
      "none";
  }
}

/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

  if(!gameRunning){
    return;
  }

  let dt =
    (time-lastTime)/1000;

  lastTime = time;

  dt =
    Math.min(dt,.05);

  /* SENSOR */

  if(sensorReady){

    cameraYaw =
      smoothAngle(
        cameraYaw,
        targetYaw,
        YAW_SMOOTH
      );

    cameraPitch +=
      (
        targetPitch-
        cameraPitch
      )*
      PITCH_SMOOTH;
  }

  /* =====================================================
     ★LOCK

     1. 振っている間だけ継続
     2. 振るのをやめたら即解除
     3. 最大5秒
  ===================================================== */

  if(locked){

    const remaining =
      lockEnd-time;

    const sinceLastShake =
      time-
      lastShakeActivity;

    /*
      ★SHAKE停止判定

      180ms以上、
      SHAKEとして認識されていない
      ↓
      ロック解除
    */

    const shakeStopped =
      sinceLastShake >
      SHAKE_RELEASE_DELAY;

    /*
      最大5秒
    */

    const maxTimeReached =
      remaining <= 0;

    if(
      shakeStopped ||
      maxTimeReached
    ){

      releaseLock(
        time,
        shakeStopped
        ? "SHAKE_STOP"
        : "MAX_TIME"
      );

    }else{

      /*
        振っている間だけダメージ
      */

      hp -=
        DAMAGE_PER_SECOND*
        dt;

      hp =
        Math.max(
          0,
          hp
        );

      updateHP();

      if(hp <= 0){

        hp = 0;

        updateHP();

        locked = false;
        gameRunning = false;

        lockText.textContent =
          "★ CAPTURED ★";

        lockText.style.display =
          "block";

        timer.style.display =
          "none";

        cooldownText.style.display =
          "none";

        renderGame(time);

        return;
      }

      timer.textContent =
        Math.max(
          0,
          remaining/1000
        ).toFixed(1);
    }
  }

  /* =====================================================
     MOVEMENT
  ===================================================== */

  if(!locked){

    /* RUN */

    if(runningAway){

      const move =
        runSpeed*
        dt;

      creatureYaw =
        normalize360(
          creatureYaw+
          moveDirection*
          move
        );

      runTravel +=
        Math.abs(move);

      if(
        runTravel >=
        runDistance
      ){

        runningAway = false;

        sleeping = false;

        setAnimation(
          "move",
          time
        );

        nextSleepCheck =
          time+
          random(
            SLEEP_CHECK_MIN,
            SLEEP_CHECK_MAX
          );
      }

    }else{

      /* ===============================================
         SLEEP AI
      =============================================== */

      if(!creatureVisible){

        if(sleeping){

          if(
            time >=
            sleepUntil
          ){

            sleeping = false;
            sleepUntil = 0;

            setAnimation(
              "move",
              time
            );

            nextSleepCheck =
              time+
              random(
                SLEEP_CHECK_MIN,
                SLEEP_CHECK_MAX
              );
          }

        }else if(
          time >=
          nextSleepCheck
        ){

          const unseenTime =
            time-
            lastDetectedTime;

          const sleepChance =
            unseenTime >=
            LONG_UNSEEN_TIME
            ? LONG_SLEEP_CHANCE
            : NORMAL_SLEEP_CHANCE;

          if(
            Math.random() <
            sleepChance
          ){

            sleeping = true;

            sleepUntil =
              time+
              random(
                SLEEP_MIN,
                SLEEP_MAX
              );

            setAnimation(
              "sleep",
              time
            );

          }else{

            nextSleepCheck =
              time+
              random(
                SLEEP_CHECK_MIN,
                SLEEP_CHECK_MAX
              );
          }
        }
      }

      /* WALK */

      if(!sleeping){

        const move =
          walkSpeed*
          dt;

        creatureYaw =
          normalize360(
            creatureYaw+
            moveDirection*
            move
          );
      }
    }

    creaturePitch =
      creatureBasePitch;
  }

  /* =====================================================
     VISIBILITY
  ===================================================== */

  if(sensorReady){

    const dx =
      angleDiff(
        creatureYaw,
        cameraYaw
      );

    const dy =
      creaturePitch-
      cameraPitch;

    creatureVisible =
      Math.abs(dx)<HFOV/2 &&
      Math.abs(dy)<VFOV/2;

    /*
      ★画面に入った瞬間
    */

    if(
      creatureVisible &&
      !wasCreatureVisible &&
      !locked &&
      !runningAway
    ){

      lastDetectedTime =
        time;

      /*
        SLEEP解除
      */

      sleeping = false;
      sleepUntil = 0;

      /*
        発見開始
      */

      detected = true;
      detectedAt = time;

      setAnimation(
        "move",
        time
      );
    }

    /*
      0.5秒以内に逃した
    */

    if(
      !creatureVisible &&
      detected &&
      !runningAway
    ){

      detected = false;
      detectedAt = 0;

      sleeping = false;

      setAnimation(
        "move",
        time
      );

      nextSleepCheck =
        time+
        random(
          SLEEP_CHECK_MIN,
          SLEEP_CHECK_MAX
        );
    }

    /*
      ★0.5秒捉えた
    */

    if(
      creatureVisible &&
      detected &&
      !locked &&
      !runningAway &&
      time-detectedAt >=
      NOTICE_DELAY
    ){

      detected = false;
      detectedAt = 0;

      sleeping = false;

      /*
        FRAME 9
      */

      setAnimation(
        "notice",
        time
      );

      /*
        RUN
      */

      startRun(
        "found",
        time,
        true
      );
    }

    wasCreatureVisible =
      creatureVisible;
  }

  /* ANIMATION */

  updateAnimation(time);

  /* COOLDOWN */

  if(
    !locked &&
    time <
    lockCooldownUntil
  ){

    const r =
      (
        lockCooldownUntil-
        time
      )/
      1000;

    cooldownText.style.display =
      "block";

    cooldownText.textContent =
      "LOCK DISABLED "+
      r.toFixed(1);

  }else{

    cooldownText.style.display =
      "none";
  }

  renderGame(time);

  requestAnimationFrame(gameLoop);
}

/* =========================================================
   RUN
========================================================= */

function startRun(
  reason,
  time,
  keepAnimation=false
){

  runningAway = true;

  runTravel = 0;

  sleeping = false;
  sleepUntil = 0;

  /*
    ★60%でWALKと逆方向
  */

  if(
    Math.random() <
    RUN_REVERSE_CHANCE
  ){

    moveDirection *= -1;
  }

  if(
    reason === "release"
  ){

    runSpeed =
      random(
        RELEASE_RUN_MIN,
        RELEASE_RUN_MAX
      );

  }else{

    runSpeed =
      random(
        RUN_SPEED_MIN,
        RUN_SPEED_MAX
      );
  }

  runDistance =
    random(
      RUN_DISTANCE_MIN,
      RUN_DISTANCE_MAX
    );

  bobAmplitude =
    random(5,20);

  bobPhase =
    random(
      0,
      Math.PI*2
    );

  bobSpeed =
    random(1.1,1.8);

  if(!keepAnimation){

    setAnimation(
      "move",
      time
    );
  }

  nextSpecialTime =
    time+
    random(
      2200,
      5000
    );

  nextAttackTime =
    time+
    random(
      4000,
      7000
    );
}

/* =========================================================
   ANIMATION
========================================================= */

function setAnimation(state,time){

  animState = state;
  animStateStart = time;

  switch(state){

    case "sleep":
      animFrame = 8;
      break;

    case "notice":
      animFrame = 9;
      break;

    case "move":
      animFrame = 1;
      break;

    case "damage":
      animFrame = 10;
      break;

    case "attack":
      animFrame = 12;
      break;

    case "special":
      animFrame = 14;
      break;
  }
}

/* =========================================================
   UPDATE ANIMATION
========================================================= */

function updateAnimation(time){

  /*
    ロック中
    10-11 DAMAGE
  */

  if(locked){

    animState =
      "damage";

    animFrame =
      10+
      (
        Math.floor(
          time/140
        )%2
      );

    return;
  }

  const elapsed =
    time-
    animStateStart;

  /*
    9 NOTICE
  */

  if(
    animState ===
    "notice"
  ){

    animFrame = 9;

    if(
      elapsed >=
      NOTICE_DURATION
    ){

      setAnimation(
        "move",
        time
      );
    }

    return;
  }

  /*
    SPECIAL
  */

  if(
    animState ===
    "special"
  ){

    animFrame =
      14+
      (
        Math.floor(
          elapsed/120
        )%2
      );

    if(
      elapsed >= 360
    ){

      setAnimation(
        "move",
        time
      );

      nextSpecialTime =
        time+
        random(
          2500,
          5500
        );
    }

    return;
  }

  /*
    ATTACK
  */

  if(
    animState ===
    "attack"
  ){

    animFrame =
      12+
      (
        Math.floor(
          elapsed/120
        )%2
      );

    if(
      elapsed >= 360
    ){

      setAnimation(
        "move",
        time
      );

      nextAttackTime =
        time+
        random(
          4000,
          7500
        );
    }

    return;
  }

  /*
    SLEEP
  */

  if(
    sleeping &&
    !creatureVisible &&
    !detected &&
    !runningAway
  ){

    animState =
      "sleep";

    animFrame = 8;

    return;
  }

  /*
    RUN
  */

  if(runningAway){

    animState =
      "move";

    animFrame =
      1+
      (
        Math.floor(
          time/55
        )%4
      );

    if(
      time >=
      nextSpecialTime &&
      Math.random() < .03
    ){

      setAnimation(
        "special",
        time
      );

      return;
    }

    return;
  }

  /*
    WALK
  */

  animState =
    "move";

  animFrame =
    1+
    (
      Math.floor(
        time/105
      )%4
    );
}

/* =========================================================
   PROJECT
========================================================= */

function projectCreature(
  yaw,
  pitch
){

  const dx =
    angleDiff(
      yaw,
      cameraYaw
    );

  const dy =
    pitch-
    cameraPitch;

  const x =
    W/2+
    (
      dx/
      (HFOV/2)
    )*
    (W/2);

  const y =
    H/2-
    (
      dy/
      (VFOV/2)
    )*
    (H/2);

  return{

    x,
    y,
    dx,
    dy,

    visible:
      Math.abs(dx)<HFOV/2 &&
      Math.abs(dy)<VFOV/2
  };
}

/* =========================================================
   RENDER
========================================================= */

function renderGame(time){

  ctx.clearRect(
    0,0,W,H
  );

  drawCreature(time);

  let detectionRemaining = 0;

  if(detected){

    detectionRemaining =
      Math.max(
        0,
        (
          NOTICE_DELAY-
          (
            time-
            detectedAt
          )
        )/
        1000
      );
  }

  const unseen =
    Math.max(
      0,
      (
        time-
        lastDetectedTime
      )/
      1000
    );

  const sleepChance =
    unseen >= 30
    ? 50
    : 30;

  const shakeAge =
    locked
    ? Math.max(
        0,
        time-lastShakeActivity
      )
    : 0;

  debug.innerHTML =

    "YAW "+
    cameraYaw.toFixed(1)+"°"+

    "<br>PITCH "+
    cameraPitch.toFixed(1)+"°"+

    "<br>TYPE "+
    creatureZone+

    "<br>FRAME "+
    animFrame+

    "<br>VISIBLE "+
    creatureVisible+

    "<br>DETECT "+
    detectionRemaining.toFixed(2)+

    "<br>STATE "+
    (
      locked
      ? "LOCK"
      : runningAway
        ? "RUN"
        : sleeping
          ? "SLEEP"
          : "WALK"
    )+

    "<br>DIR "+
    (
      moveDirection > 0
      ? "RIGHT"
      : "LEFT"
    )+

    "<br>WALK "+
    walkSpeed.toFixed(1)+"°/s"+

    "<br>RUN "+
    runSpeed.toFixed(1)+"°/s"+

    "<br>SHAKE "+
    currentShakePower.toFixed(1)+

    "<br>SHAKE AGE "+
    shakeAge.toFixed(0)+"ms"+

    "<br>UNSEEN "+
    unseen.toFixed(1)+"s"+

    "<br>SLEEP "+
    sleepChance+"%"+

    "<br>HP "+
    Math.ceil(hp);
}

/* =========================================================
   DRAW CREATURE
========================================================= */

function drawCreature(time){

  if(!creatureVisible){
    return;
  }

  const p =
    projectCreature(
      creatureYaw,
      creaturePitch
    );

  if(!p.visible){
    return;
  }

  let bob = 0;

  if(
    !sleeping &&
    !locked
  ){

    bob =
      Math.sin(
        time*.001*
        bobSpeed+
        bobPhase
      )*
      bobAmplitude;
  }

  const x =
    Math.round(
      p.x
    );

  const y =
    Math.round(
      p.y+
      bob
    );

  const S =
    clamp(
      Math.round(
        Math.min(W,H)/72
      ),
      5,
      8
    );

  ctx.save();

  ctx.translate(
    x,
    y
  );

  if(
    moveDirection < 0
  ){

    ctx.scale(
      -1,
      1
    );
  }

  drawPixelFrame(
    animFrame,
    S,
    time
  );

  if(locked){

    ctx.strokeStyle =
      "#fff";

    ctx.lineWidth =
      3;

    const pulse =
      12*S+
      Math.sin(
        time*.015
      )*
      S;

    ctx.strokeRect(
      -pulse,
      -pulse,
      pulse*2,
      pulse*2
    );
  }

  ctx.restore();
}

/* =========================================================
   PIXEL
========================================================= */

function px(
  x,y,w,h,
  color,S
){

  ctx.fillStyle =
    color;

  ctx.fillRect(
    Math.round(x*S),
    Math.round(y*S),
    Math.round(w*S),
    Math.round(h*S)
  );
}

/* =========================================================
   BODY
========================================================= */

function bodyBase(
  S,
  BODY,
  LIGHT,
  DARK,
  OUTLINE
){

  px(-6,-8,4,5,OUTLINE,S);
  px(3,-8,4,5,OUTLINE,S);

  px(-5,-7,2,4,BODY,S);
  px(4,-7,2,4,BODY,S);

  px(-6,-4,13,11,OUTLINE,S);
  px(-5,-3,11,9,BODY,S);

  px(-4,-3,7,1,LIGHT,S);
  px(4,-1,2,6,DARK,S);
}

/* =========================================================
   FACE
========================================================= */

function faceNormal(
  S,
  WHITE,
  BLACK
){

  px(-4,-2,3,3,WHITE,S);
  px(-2,-1,1,2,BLACK,S);

  px(2,-2,3,3,WHITE,S);
  px(2,-1,1,2,BLACK,S);

  px(-1,3,2,1,BLACK,S);
}

function faceHappy(
  S,
  BLACK,
  PINK
){

  px(-4,-1,3,1,BLACK,S);
  px(2,-1,3,1,BLACK,S);

  px(-2,2,5,1,BLACK,S);
  px(-1,3,3,1,PINK,S);
}

/* =========================================================
   X EYE
========================================================= */

function drawXEye(
  x,y,S,color
){

  px(x-1,y-1,1,1,color,S);
  px(x+1,y-1,1,1,color,S);

  px(x,y,1,1,color,S);

  px(x+1,y+1,1,1,color,S);

/* =========================================================
   ★SHAKE SENSOR
========================================================= */

function motionHandler(e){

  if(!gameRunning){
    return;
  }

  const a =
    e.accelerationIncludingGravity;

  if(!a){
    return;
  }

  const x =
    a.x || 0;

  const y =
    a.y || 0;

  const z =
    a.z || 0;

  const magnitude =
    Math.sqrt(
      x*x+
      y*y+
      z*z
    );

  /*
    重力分9.81を除外
  */

  const shake =
    Math.abs(
      magnitude-
      9.81
    );

  currentShakePower =
    shake;

  const now =
    performance.now();

  /*
    ============================================
    ★すでにLOCK中

    振動が続いていれば
    最終SHAKE時刻を更新
    ============================================
  */

  if(locked){

    /*
      ロック開始後は少し低い閾値で
      「まだ振っている」を判定。

      開始には9必要だが、
      維持には4でよい。
    */

    if(
      shake >=
      SHAKE_RELEASE_THRESHOLD
    ){

      lastShakeActivity =
        now;
    }

    return;
  }

  /*
    ============================================
    LOCKしていない
    ============================================
  */

  if(
    !creatureVisible
  ){
    return;
  }

  if(
    now <
    lockCooldownUntil
  ){
    return;
  }

  /*
    ★9以上でLOCK開始
  */

  if(
    shake >=
    SHAKE_THRESHOLD
  ){

    lockCreature(
      shake,
      now
    );
  }
}

/* =========================================================
   ★LOCK START
========================================================= */

function lockCreature(
  power,
  now
){

  if(
    !creatureVisible ||
    locked ||
    now <
    lockCooldownUntil
  ){
    return;
  }

  locked = true;

  /*
    ★ロック開始
  */

  lockStartedAt =
    now;

  /*
    ★最大5秒
  */

  lockEnd =
    now+
    MAX_LOCK*1000;

  /*
    ★今まさに振っているので
    最終SHAKE時刻もnow
  */

  lastShakeActivity =
    now;

  /*
    キャラクター停止
  */

  runningAway = false;

  sleeping = false;
  sleepUntil = 0;

  detected = false;
  detectedAt = 0;

  setAnimation(
    "damage",
    now
  );

  lockText.textContent =
    "⚡ LOCK!";

  lockText.style.display =
    "block";

  timer.style.display =
    "block";

  timer.textContent =
    MAX_LOCK.toFixed(1);

  cooldownText.style.display =
    "none";

  if(
    navigator.vibrate
  ){

    navigator.vibrate([
      70,
      40,
      120
    ]);
  }
}

/* =========================================================
   ★LOCK RELEASE

   SHAKE停止でも
   5秒経過でも
   ここを通る
========================================================= */

function releaseLock(
  time,
  reason
){

  if(!locked){
    return;
  }

  locked = false;

  lockText.style.display =
    "none";

  timer.style.display =
    "none";

  /*
    ★解除後3秒
    再ロック不可
  */

  lockCooldownUntil =
    time+
    LOCK_COOLDOWN;

  detected = false;
  detectedAt = 0;

  sleeping = false;
  sleepUntil = 0;

  currentShakePower = 0;

  /*
    ★解除した瞬間
    高速RUN
  */

  startRun(
    "release",
    time
  );
}

/* =========================================================
   HP
========================================================= */

function updateHP(){

  hpNumber.textContent =
    Math.ceil(hp);

  hpInner.style.width =
    (
      hp/
      MAX_HP*
      100
    )+
    "%";
}

/* =========================================================
   STOP
========================================================= */

function stopCamera(){

  gameRunning = false;

  const stream =
    camera.srcObject;

  if(!stream){
    return;
  }

  stream
    .getTracks()
    .forEach(
      track=>track.stop()
    );

  camera.srcObject =
    null;
}

addEventListener(
  "pagehide",
  stopCamera
);

addEventListener(
  "beforeunload",
  stopCamera
);

</script>
