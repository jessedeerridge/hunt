<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>AR Catch Game</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* CAMERA */

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
  display:none;
}

/* CHARACTER */

#character{
  position:fixed;

  left:50%;
  top:50%;

  width:90px;
  height:90px;

  transform:translate(-50%,-50%);

  display:none;
  align-items:center;
  justify-content:center;

  font-size:70px;

  z-index:5;

  pointer-events:none;

  filter:drop-shadow(0 6px 5px #0008);

  will-change:left,top,transform;
}

/* TARGET */

#target{
  position:fixed;

  left:50%;
  top:50%;

  width:130px;
  height:130px;

  transform:translate(-50%,-50%);

  border:3px solid rgba(255,255,255,.8);

  border-radius:50%;

  z-index:6;

  display:none;

  pointer-events:none;

  transition:
    border-color .1s,
    box-shadow .1s,
    transform .1s;
}

#target::before,
#target::after{
  content:"";

  position:absolute;

  background:white;
}

#target::before{
  width:30px;
  height:2px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);
}

#target::after{
  width:2px;
  height:30px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);
}

/* CHARACTER IS INSIDE TARGET */

#target.aiming{
  border-color:#69ff83;

  box-shadow:
    0 0 20px #69ff83,
    inset 0 0 20px #69ff8355;

  transform:
    translate(-50%,-50%)
    scale(1.08);
}

/* CAPTURE */

#target.locked{
  border-color:#5cecff;

  box-shadow:
    0 0 30px #5cecff,
    inset 0 0 30px #5cecff66;
}

/* MESSAGE */

#message{
  position:fixed;

  top:
    calc(
      30px +
      env(safe-area-inset-top)
    );

  left:50%;

  transform:translateX(-50%);

  z-index:20;

  color:white;

  font-size:20px;
  font-weight:900;

  text-shadow:
    0 3px 10px #000;

  display:none;

  white-space:nowrap;
}

/* LOCK TIMER */

#lockTimer{
  position:fixed;

  left:50%;

  top:
    calc(50% + 90px);

  transform:translateX(-50%);

  z-index:20;

  display:none;

  color:white;

  font-size:28px;

  font-weight:900;

  text-shadow:
    0 3px 8px black;
}

/* POWER BAR */

#barContainer{
  position:fixed;

  left:50%;

  bottom:
    calc(
      30px +
      env(safe-area-inset-bottom)
    );

  transform:translateX(-50%);

  width:min(80vw,350px);

  height:12px;

  border-radius:20px;

  background:#ffffff44;

  overflow:hidden;

  z-index:20;

  display:none;
}

#bar{
  width:0%;
  height:100%;

  background:white;

  transition:width .05s;
}

/* START */

#startScreen{
  position:fixed;
  inset:0;

  z-index:100;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:30px;

  text-align:center;

  color:white;

  background:
    radial-gradient(
      circle at 50% 35%,
      #333,
      #111 55%,
      #000
    );
}

#startScreen h1{
  margin:0 0 15px;
  font-size:30px;
}

#startScreen p{
  line-height:1.8;
  opacity:.75;
}

#startButton{
  margin-top:25px;

  border:0;

  border-radius:100px;

  padding:18px 30px;

  min-width:260px;

  font-size:18px;

  font-weight:900;

  background:white;

  color:#111;
}

#error{
  margin-top:20px;

  color:#ff9999;

  font-size:13px;

  white-space:pre-line;
}

</style>
</head>

<body>


<!-- CAMERA -->

<video
id="camera"
autoplay
muted
playsinline
webkit-playsinline>
</video>


<!-- CHARACTER -->

<div id="character">
👾
</div>


<!-- TARGET -->

<div id="target"></div>


<!-- MESSAGE -->

<div id="message">
🎯 とらえた！振れ！
</div>


<!-- TIMER -->

<div id="lockTimer">
6.0
</div>


<!-- SHAKE POWER -->

<div id="barContainer">
  <div id="bar"></div>
</div>


<!-- START -->

<div id="startScreen">

  <div style="font-size:70px">
    👾
  </div>

  <h1>
    CATCH!
  </h1>

  <p>
    👾が左右へ逃げます。
    <br><br>

    中央の照準にとらえたら
    <br>

    <strong>
      スマホを振れ！
    </strong>

    <br><br>

    振る強さによって
    <br>

    最大6秒間動きを止められます。
  </p>

  <button id="startButton">
    GAME START
  </button>

  <div id="error"></div>

</div>


<script>

/* ===============================
   ELEMENTS
================================ */

const camera =
document.getElementById("camera");

const character =
document.getElementById("character");

const target =
document.getElementById("target");

const message =
document.getElementById("message");

const lockTimer =
document.getElementById("lockTimer");

const barContainer =
document.getElementById("barContainer");

const bar =
document.getElementById("bar");

const startScreen =
document.getElementById("startScreen");

const startButton =
document.getElementById("startButton");

const errorBox =
document.getElementById("error");


/* ===============================
   GAME
================================ */

let stream;

let x =
window.innerWidth / 2;

let y =
window.innerHeight / 2;

let velocityX = 0;

let targetX = x;

let locked = false;

let lockEnd = 0;

let lastTime =
performance.now();

let nextDirectionChange = 0;

let shakePower = 0;

let lastShakeTime = 0;

let captured = false;


/* ===============================
   SETTINGS
================================ */

/*
  逃げる速さ
*/

const MIN_SPEED = 350;

const MAX_SPEED = 750;


/*
  方向転換までの時間
*/

const MIN_CHANGE = 180;

const MAX_CHANGE = 700;


/*
  捕捉範囲
*/

const CAPTURE_RADIUS = 65;


/*
  振った判定
*/

const SHAKE_THRESHOLD = 10;


/*
  最大拘束時間
*/

const MAX_LOCK_TIME = 6000;


/* ===============================
   RANDOM
================================ */

function random(min,max){

  return (
    Math.random() *
    (max-min)
    +
    min
  );

}


/* ===============================
   START
================================ */

startButton.addEventListener(
"click",
async()=>{

  errorBox.textContent="";

  try{

    /* --------------------------
       MOTION PERMISSION FIRST
    -------------------------- */

    if(
      typeof DeviceMotionEvent !==
      "undefined"
      &&
      typeof DeviceMotionEvent
      .requestPermission ===
      "function"
    ){

      const permission =
      await DeviceMotionEvent
      .requestPermission();

      if(permission !== "granted"){

        throw new Error(
          "モーションセンサーが許可されませんでした。"
        );

      }

    }


    window.addEventListener(
      "devicemotion",
      motionHandler,
      {passive:true}
    );


    /* --------------------------
       CAMERA
    -------------------------- */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices
      .getUserMedia
    ){

      throw new Error(
        "カメラを使用できません。HTTPSで開いてください。"
      );

    }


    stream =
    await navigator.mediaDevices
    .getUserMedia({

      audio:false,

      video:{

        facingMode:{
          ideal:"environment"
        }

      }

    });


    camera.srcObject =
    stream;

    camera.muted=true;

    camera.setAttribute(
      "playsinline",
      ""
    );

    await camera.play();


    /* --------------------------
       SHOW GAME
    -------------------------- */

    startScreen.style.display=
    "none";

    camera.style.display=
    "block";

    character.style.display=
    "flex";

    target.style.display=
    "block";

    barContainer.style.display=
    "block";


    x =
    window.innerWidth/2;

    y =
    window.innerHeight/2;


    chooseNewDirection();

    lastTime =
    performance.now();


    requestAnimationFrame(
      gameLoop
    );

  }

  catch(error){

    console.error(error);

    errorBox.textContent =
    (error.name || "") +
    "\n" +
    (error.message || error);

  }

});


/* ===============================
   ESCAPE AI
================================ */

function chooseNewDirection(){

  /*
    ランダムで
    左右どちらかへ逃げる
  */

  const direction =
  Math.random() < .5
  ? -1
  : 1;


  velocityX =
  direction *
  random(
    MIN_SPEED,
    MAX_SPEED
  );


  nextDirectionChange =
  performance.now()
  +
  random(
    MIN_CHANGE,
    MAX_CHANGE
  );

}


/* ===============================
   GAME LOOP
================================ */

function gameLoop(time){

  let dt =
  (time-lastTime)/1000;

  lastTime=time;


  dt =
  Math.min(
    dt,
    .04
  );


  /* ===========================
     LOCKED
  =========================== */

  if(locked){

    const remaining =
    lockEnd-time;


    if(remaining <= 0){

      locked=false;

      captured=false;

      lockTimer.style.display=
      "none";

      target.classList.remove(
        "locked"
      );


      message.textContent =
      "💨 逃げた！";

      message.style.display =
      "block";


      setTimeout(()=>{

        if(!locked){

          message.style.display=
          "none";

        }

      },500);


      /*
        ロック終了直後は
        高速で逃げる
      */

      chooseNewDirection();

      velocityX *=1.2;

    }

    else{

      lockTimer.textContent =
      (
        remaining/1000
      ).toFixed(1);

    }

  }


  /* ===========================
     ESCAPING
  =========================== */

  else{

    if(
      time >
      nextDirectionChange
    ){

      chooseNewDirection();

    }


    x +=
    velocityX *
    dt;


    /* ===========================
       WALL BOUNCE
    =========================== */

    const half =
    character.offsetWidth/2;


    if(
      x <
      half
    ){

      x=half;

      velocityX =
      Math.abs(
        velocityX
      );

    }


    if(
      x >
      window.innerWidth-half
    ){

      x =
      window.innerWidth-half;

      velocityX =
      -Math.abs(
        velocityX
      );

    }

  }


  /* ===========================
     DRAW
  =========================== */

  character.style.left =
  x+"px";

  character.style.top =
  y+"px";


  /*
    キャラの向き
  */

  if(!locked){

    const flip =
    velocityX >= 0
    ? 1
    : -1;


    character.style.transform =
    `
    translate(-50%,-50%)
    scaleX(${flip})
    `;

  }


  /* ===========================
     AIM CHECK
  =========================== */

  if(!locked){

    const centerX =
    window.innerWidth/2;

    const centerY =
    window.innerHeight/2;


    const dx =
    x-centerX;

    const dy =
    y-centerY;


    const distance =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


    captured =
    distance <
    CAPTURE_RADIUS;


    if(captured){

      target.classList.add(
        "aiming"
      );


      message.textContent =
      "🎯 とらえた！振れ！";

      message.style.display =
      "block";

    }

    else{

      target.classList.remove(
        "aiming"
      );

      message.style.display =
      "none";

    }

  }


  /* ===========================
     SHAKE BAR
  =========================== */

  shakePower *= .92;


  bar.style.width =
  Math.min(
    shakePower*8,
    100
  )
  +"%";


  requestAnimationFrame(
    gameLoop
  );

}


/* ===============================
   MOTION
================================ */

function motionHandler(event){

  const a =
  event.accelerationIncludingGravity;

  if(!a){
    return;
  }


  const ax =
  a.x || 0;

  const ay =
  a.y || 0;

  const az =
  a.z || 0;


  /*
    加速度の大きさ
  */

  const total =
  Math.sqrt(
    ax*ax +
    ay*ay +
    az*az
  );


  /*
    重力 9.8 を除いた
    大まかな振動量
  */

  const shake =
  Math.abs(
    total-9.81
  );


  shakePower =
  Math.max(
    shakePower,
    shake
  );


  /* ===========================
     SHAKE DETECTED
  =========================== */

  if(
    shake >
    SHAKE_THRESHOLD
    &&
    captured
    &&
    !locked
  ){

    const now =
    performance.now();


    /*
      連続判定防止
    */

    if(
      now-lastShakeTime
      <
      400
    ){
      return;
    }


    lastShakeTime =
    now;


    captureCharacter(
      shake
    );

  }

}


/* ===============================
   CAPTURE
================================ */

function captureCharacter(
  power
){

  locked=true;


  /*
    振った強さから
    1.5〜6秒
  */

  let seconds =

  1.5

  +

  (
    power-
    SHAKE_THRESHOLD
  )

  *
  .35;


  seconds =
  Math.max(
    1.5,
    Math.min(
      6,
      seconds
    )
  );


  lockEnd =
  performance.now()
  +
  seconds*1000;


  velocityX=0;


  target.classList.remove(
    "aiming"
  );


  target.classList.add(
    "locked"
  );


  message.textContent =
  "⚡ LOCK!";


  message.style.display=
  "block";


  lockTimer.textContent =
  seconds.toFixed(1);


  lockTimer.style.display=
  "block";


  /*
    バイブ
  */

  if(navigator.vibrate){

    navigator.vibrate(
      [80,40,120]
    );

  }

}

</script>

</body>
</html>
