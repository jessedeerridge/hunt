<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>CAMERA HUNT 360</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}

/* ===== REAL CAMERA ===== */

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  z-index:0;

  /*
    ★リアカメラなので反転しない
  */
  transform:none;
}

/* ===== AR CANVAS ===== */

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
}

/* ===== HUD ===== */

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  pointer-events:none;
}

#hp{
  position:absolute;
  top:calc(15px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  width:min(82vw,380px);
}

#hpText{
  color:#fff;
  font-size:13px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#hpOuter{
  height:15px;
  margin-top:5px;
  border:2px solid #fff;
  border-radius:8px;
  overflow:hidden;
  background:#1118;
}

#hpInner{
  width:100%;
  height:100%;
  background:#fff;
}

#lock{
  position:absolute;
  top:20%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
  padding:8px 14px;
  border-radius:20px;
  background:#0009;
  color:#fff;
  font-size:24px;
  font-weight:bold;
}

#timer{
  position:absolute;
  bottom:15%;
  left:50%;
  transform:translateX(-50%);
  display:none;
  color:#fff;
  font-size:34px;
  font-weight:bold;
  text-shadow:0 2px 6px #000;
}

#debug{
  position:absolute;
  right:7px;
  bottom:7px;
  padding:6px 8px;
  border-radius:6px;
  background:#0009;
  color:#fff;
  font-size:9px;
  line-height:1.5;
}

#sensorWait{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
  padding:12px 18px;
  border-radius:20px;
  background:#0009;
  color:#fff;
  font-size:13px;
}

/* ===== START ===== */

#start{
  position:fixed;
  inset:0;
  z-index:100;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  padding:30px;

  background:
    linear-gradient(
      #18242d,
      #0c1116
    );

  color:#fff;
  text-align:center;
}

#startIcon{
  font-size:70px;
}

#start h1{
  margin:8px 0 5px;
  font-size:27px;
}

#start p{
  max-width:430px;
  margin-top:12px;
  font-size:13px;
  line-height:1.8;
  opacity:.85;
}

#startButton{
  min-width:250px;
  margin-top:20px;
  padding:17px 25px;

  border:2px solid #fff;
  border-radius:30px;

  background:#fff;
  color:#111;

  font-size:16px;
  font-weight:bold;
}

#startButton:active{
  transform:scale(.96);
}

#error{
  max-width:400px;
  margin-top:17px;
  color:#ffaaaa;
  font-size:12px;
  line-height:1.5;
  white-space:pre-line;
}
</style>
</head>

<body>

<!-- REAL CAMERA -->
<video
  id="camera"
  autoplay
  playsinline
  muted>
</video>

<!-- CHARACTER -->
<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud">

  <div id="hp">
    <div id="hpText">
      CREATURE HP
      <span id="hpNumber">100</span>/100
    </div>

    <div id="hpOuter">
      <div id="hpInner"></div>
    </div>
  </div>

  <div id="lock">⚡ LOCK!</div>

  <div id="timer">6.0</div>

  <div id="sensorWait">
    SENSOR...
  </div>

  <div id="debug"></div>

</div>

<!-- START -->
<div id="start">

  <div id="startIcon">👾</div>

  <h1>CAMERA HUNT 360°</h1>

  <p>
    カメラの中に隠れたキャラクターを探してください。
    <br><br>
    キャラクターは360°のどこかにいます。
    <br>
    SKY / FRONT / EARTH の属性はランダム。
    <br><br>
    見つけると左右どちらかへ逃走します。
    <br>
    画面内にいるときスマホを振るとロック！
  </p>

  <button id="startButton">
    START CAMERA
  </button>

  <div id="error"></div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const camera =
  document.getElementById("camera");

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("startButton");

const error =
  document.getElementById("error");

const hud =
  document.getElementById("hud");

const hpNumber =
  document.getElementById("hpNumber");

const hpInner =
  document.getElementById("hpInner");

const lockText =
  document.getElementById("lock");

const timer =
  document.getElementById("timer");

const debug =
  document.getElementById("debug");

const sensorWait =
  document.getElementById("sensorWait");


/* =========================================================
   CANVAS
========================================================= */

let W=0;
let H=0;

function resize(){

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W =
    window.innerWidth;

  H =
    window.innerHeight;

  canvas.width =
    Math.round(W*dpr);

  canvas.height =
    Math.round(H*dpr);

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   SETTINGS
========================================================= */

const HFOV = 68;
const VFOV = 55;

const MAX_HP = 100;

const DAMAGE_PER_SECOND = 12;

const SHAKE_THRESHOLD = 9;

const MIN_LOCK = 1.5;
const MAX_LOCK = 6;

const ESCAPE_SPEED_MIN = 7;
const ESCAPE_SPEED_MAX = 11;

const ESCAPE_DISTANCE_MIN = 55;
const ESCAPE_DISTANCE_MAX = 160;

const YAW_SMOOTH = .24;
const PITCH_SMOOTH = .20;


/* =========================================================
   CHARACTER TYPES
========================================================= */

const CREATURE_ZONES = {

  SKY:{
    minPitch:20,
    maxPitch:34
  },

  FRONT:{
    minPitch:-6,
    maxPitch:6
  },

  EARTH:{
    minPitch:-34,
    maxPitch:-20
  }

};


/* =========================================================
   CAMERA SENSOR
========================================================= */

let cameraYaw = 0;
let cameraPitch = 0;

let targetYaw = 0;
let targetPitch = 0;

let sensorReady = false;


/* =========================================================
   CREATURE
========================================================= */

let creatureZone = "FRONT";

let creatureYaw = 0;

let creaturePitch = 0;

let creatureBasePitch = 0;


/*
 画面上だけの上下揺れ。
*/
let creatureBobAmplitude = 10;

let creatureBobPhase = 0;

let creatureBobSpeed = 1;


let creatureVisible = false;

let discovered = false;

let escaping = false;


/*
 -1 / +1
*/
let escapeDirection = 1;

let escapeSpeed = 0;

let escapeDistance = 0;

let escapeTravel = 0;


/* =========================================================
   GAME
========================================================= */

let running = false;

let hp = MAX_HP;

let locked = false;

let lockEnd = 0;

let lastShake = 0;

let lastTime = 0;


/* =========================================================
   MATH
========================================================= */

function rad(v){
  return v*Math.PI/180;
}

function deg(v){
  return v*180/Math.PI;
}

function clamp(v,min,max){

  return Math.max(
    min,
    Math.min(max,v)
  );

}

function random(min,max){

  return (
    Math.random()*
    (max-min)
    +
    min
  );

}

function normalize360(a){

  a%=360;

  if(a<0){
    a+=360;
  }

  return a;

}

function angleDiff(
  target,
  current
){

  let d =
    normalize360(target)
    -
    normalize360(current);

  if(d>180){
    d-=360;
  }

  if(d<-180){
    d+=360;
  }

  return d;

}

function smoothAngle(
  current,
  target,
  amount
){

  return normalize360(

    current

    +

    angleDiff(
      target,
      current
    )

    *

    amount

  );

}


/* =========================================================
   SPAWN
========================================================= */

function spawnCreature(){

  const types = [
    "SKY",
    "FRONT",
    "EARTH"
  ];


  /*
   ★属性ランダム
  */

  creatureZone =

    types[
      Math.floor(
        Math.random()*
        types.length
      )
    ];


  const zone =
    CREATURE_ZONES[
      creatureZone
    ];


  /*
   ★360°ランダム
  */

  creatureYaw =
    random(
      0,
      360
    );


  /*
   ★属性ごとの高さ
  */

  creatureBasePitch =
    random(
      zone.minPitch,
      zone.maxPitch
    );


  creaturePitch =
    creatureBasePitch;


  /*
   ★5～20pxの上下揺れ
  */

  creatureBobAmplitude =
    random(
      5,
      20
    );


  creatureBobPhase =
    random(
      0,
      Math.PI*2
    );


  creatureBobSpeed =
    random(
      .7,
      1.3
    );


  creatureVisible = false;

  discovered = false;

  escaping = false;

}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
"click",
async()=>{

  try{

    startButton.disabled=true;

    startButton.textContent=
      "STARTING...";

    error.textContent="";


    /* =====================================================
       CAMERA

       ★ブラウザにすでに許可が保存されていれば
       通常は再度確認されない。

       HTML側から許可ダイアログを
       強制的に消すことはできない。
    ===================================================== */

    if(
      !navigator.mediaDevices
      ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "このブラウザではカメラを使用できません。"
      );

    }


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{

          facingMode:{
            ideal:"environment"
          },

          width:{
            ideal:1920
          },

          height:{
            ideal:1080
          }

        },

        audio:false

      });


    camera.srcObject =
      stream;


    await camera.play();


    /* =====================================================
       iOS ORIENTATION PERMISSION
    ===================================================== */

    if(
      typeof DeviceOrientationEvent!=="undefined"
      &&
      typeof DeviceOrientationEvent.requestPermission
      ===
      "function"
    ){

      const result =
        await DeviceOrientationEvent
        .requestPermission();


      if(result!=="granted"){

        throw new Error(
          "方向センサーを許可してください。"
        );

      }

    }


    /* =====================================================
       iOS MOTION PERMISSION
    ===================================================== */

    if(
      typeof DeviceMotionEvent!=="undefined"
      &&
      typeof DeviceMotionEvent.requestPermission
      ===
      "function"
    ){

      const result =
        await DeviceMotionEvent
        .requestPermission();


      if(result!=="granted"){

        throw new Error(
          "モーションセンサーを許可してください。"
        );

      }

    }


    /* =====================================================
       EVENTS
    ===================================================== */

    window.addEventListener(
      "deviceorientation",
      orientationHandler,
      true
    );


    window.addEventListener(
      "devicemotion",
      motionHandler,
      {passive:true}
    );


    /* =====================================================
       RESET
    ===================================================== */

    hp = MAX_HP;

    locked = false;

    sensorReady = false;


    spawnCreature();

    updateHP();


    start.style.display =
      "none";


    hud.style.display =
      "block";


    sensorWait.style.display =
      "block";


    running = true;

    lastTime =
      performance.now();


    requestAnimationFrame(
      loop
    );

  }

  catch(e){

    console.error(e);


    startButton.disabled=false;

    startButton.textContent=
      "START CAMERA";


    error.textContent=

      (e.name || "ERROR")

      +

      "\n"

      +

      (e.message || String(e))

      +

      "\n\nHTTPSで開いているか確認してください。";

  }

});


/* =========================================================
   ORIENTATION
========================================================= */

function orientationHandler(e){

  if(
    !Number.isFinite(e.alpha)
    ||
    !Number.isFinite(e.beta)
    ||
    !Number.isFinite(e.gamma)
  ){

    return;

  }


  const alpha =
    rad(e.alpha);

  const beta =
    rad(e.beta);

  const gamma =
    rad(e.gamma);


  const ca = Math.cos(alpha);
  const sa = Math.sin(alpha);

  const cb = Math.cos(beta);
  const sb = Math.sin(beta);

  const cg = Math.cos(gamma);
  const sg = Math.sin(gamma);


  /*
   DEVICE FORWARD VECTOR
  */

  let x=0;
  let y=0;
  let z=-1;


  /* GAMMA */

  let x1 =
    cg*x +
    sg*z;

  let y1 = y;

  let z1 =
    -sg*x +
    cg*z;


  /* BETA */

  let x2 = x1;

  let y2 =
    cb*y1 -
    sb*z1;

  let z2 =
    sb*y1 +
    cb*z1;


  /* ALPHA */

  let wx =
    ca*x2 -
    sa*y2;

  let wy =
    sa*x2 +
    ca*y2;

  let wz =
    z2;


  /* =====================================================
     SCREEN ORIENTATION
  ===================================================== */

  let screenAngle=0;


  if(
    screen.orientation
    &&
    typeof screen.orientation.angle
    ===
    "number"
  ){

    screenAngle =
      screen.orientation.angle;

  }

  else if(
    typeof window.orientation
    ===
    "number"
  ){

    screenAngle =
      window.orientation;

  }


  if(screenAngle!==0){

    const r =
      rad(
        -screenAngle
      );

    const c =
      Math.cos(r);

    const s =
      Math.sin(r);


    const nx =
      c*wx -
      s*wy;

    const ny =
      s*wx +
      c*wy;


    wx = nx;

    wy = ny;

  }


  /* =====================================================
     PITCH

     + = UP
      0 = LEVEL
     - = DOWN
  ===================================================== */

  const horizontal =
    Math.sqrt(
      wx*wx+
      wy*wy
    );


  const pitch =
    deg(
      Math.atan2(
        wz,
        horizontal
      )
    );


  targetPitch =
    clamp(
      pitch,
      -90,
      90
    );


  /* =====================================================
     YAW
  ===================================================== */

  let yaw =
    deg(
      Math.atan2(
        wx,
        -wy
      )
    );


  yaw =
    normalize360(
      yaw
    );


  /*
   iPhone compass heading
  */

  if(
    typeof e.webkitCompassHeading
    ===
    "number"

    &&

    Number.isFinite(
      e.webkitCompassHeading
    )

    &&

    horizontal>.15
  ){

    yaw =
      normalize360(
        e.webkitCompassHeading
      );

  }


  targetYaw =
    yaw;


  if(!sensorReady){

    cameraYaw =
      targetYaw;


    cameraPitch =
      targetPitch;


    sensorReady =
      true;


    sensorWait.style.display =
      "none";

  }

}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!running){
    return;
  }


  let dt =
    (
      time-
      lastTime
    )
    /
    1000;


  lastTime =
    time;


  dt =
    Math.min(
      dt,
      .05
    );


  /* =====================================================
     CAMERA SENSOR
  ===================================================== */

  if(sensorReady){

    cameraYaw =
      smoothAngle(
        cameraYaw,
        targetYaw,
        YAW_SMOOTH
      );


    cameraPitch +=
      (
        targetPitch-
        cameraPitch
      )
      *
      PITCH_SMOOTH;

  }


  /* =====================================================
     LOCK
  ===================================================== */

  if(locked){

    const remaining =
      lockEnd-
      time;


    hp -=
      DAMAGE_PER_SECOND*
      dt;


    hp =
      Math.max(
        0,
        hp
      );


    updateHP();


    if(hp<=0){

      hp=0;

      updateHP();

      locked=false;

      running=false;


      lockText.textContent =
        "★ CAPTURED ★";


      lockText.style.display =
        "block";


      timer.style.display =
        "none";


      render(time);

      return;

    }


    if(remaining<=0){

      locked=false;


      lockText.style.display =
        "none";


      timer.style.display =
        "none";


      startEscape();

    }

    else{

      timer.textContent =
        (
          remaining/
          1000
        )
        .toFixed(1);

    }

  }


  /* =====================================================
     ESCAPE

     ★左右だけ
  ===================================================== */

  else if(escaping){

    const move =
      escapeSpeed*
      dt;


    creatureYaw =
      normalize360(

        creatureYaw

        +

        escapeDirection*
        move

      );


    /*
     SKY / FRONT / EARTHの
     高さを維持
    */

    creaturePitch =
      creatureBasePitch;


    escapeTravel +=
      move;


    if(
      escapeTravel>=
      escapeDistance
    ){

      escaping=false;

    }

  }


  /* =====================================================
     VISIBILITY
  ===================================================== */

  if(sensorReady){

    const dx =
      angleDiff(
        creatureYaw,
        cameraYaw
      );


    const dy =
      creaturePitch-
      cameraPitch;


    creatureVisible =

      Math.abs(dx)
      <
      HFOV/2

      &&

      Math.abs(dy)
      <
      VFOV/2;


    /*
     初発見
    */

    if(
      creatureVisible
      &&
      !discovered
    ){

      discovered=true;

      startEscape();

    }

  }


  render(time);


  requestAnimationFrame(
    loop
  );

}


/* =========================================================
   ESCAPE
========================================================= */

function startEscape(){

  discovered=true;

  escaping=true;

  escapeTravel=0;


  /*
   ★左右ランダム

   一度決定したら
   この逃走中は反転しない。
  */

  escapeDirection =
    Math.random()<.5
    ?
    -1
    :
    1;


  escapeSpeed =
    random(
      ESCAPE_SPEED_MIN,
      ESCAPE_SPEED_MAX
    );


  escapeDistance =
    random(
      ESCAPE_DISTANCE_MIN,
      ESCAPE_DISTANCE_MAX
    );


  /*
   5～20px上下
  */

  creatureBobAmplitude =
    random(
      5,
      20
    );


  creatureBobPhase =
    random(
      0,
      Math.PI*2
    );


  creatureBobSpeed =
    random(
      .7,
      1.3
    );

}


/* =========================================================
   RENDER
========================================================= */

function render(time){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawCreature(
    time
  );


  let look =
    "LEVEL";


  if(cameraPitch>8){

    look =
      "UP";

  }

  else if(cameraPitch<-8){

    look =
      "DOWN";

  }


  debug.innerHTML =

    "YAW "
    +
    cameraYaw.toFixed(1)
    +
    "°"

    +

    "<br>PITCH "
    +
    cameraPitch.toFixed(1)
    +
    "°"

    +

    "<br>"
    +
    look

    +

    "<br>TYPE "
    +
    creatureZone;

}


/* =========================================================
   CREATURE PROJECTION

   ★★★★★★★★★★★★★★★★★★★★★★★

   今回の左右修正部分

   前版:
       W/2 - ...

   今回:
       W/2 + ...

   ★★★★★★★★★★★★★★★★★★★★★★★
========================================================= */

function projectCreature(
  yaw,
  pitch
){

  const dx =
    angleDiff(
      yaw,
      cameraYaw
    );


  const dy =
    pitch-
    cameraPitch;


  /* =====================================================
     ★ HORIZONTAL FIX
  ===================================================== */

  const x =

    W/2

    +

    (
      dx/
      (HFOV/2)
    )

    *

    (W/2);


  /* =====================================================
     VERTICAL

     上のキャラ → 画面上
  ===================================================== */

  const y =

    H/2

    -

    (
      dy/
      (VFOV/2)
    )

    *

    (H/2);


  return{

    x,
    y,
    dx,
    dy,

    visible:

      Math.abs(dx)
      <
      HFOV/2

      &&

      Math.abs(dy)
      <
      VFOV/2

  };

}


/* =========================================================
   DRAW CREATURE
========================================================= */

function drawCreature(time){

  if(!creatureVisible){
    return;
  }


  const p =
    projectCreature(
      creatureYaw,
      creaturePitch
    );


  if(!p.visible){
    return;
  }


  /* =====================================================
     5～20px VERTICAL BOB

     球面座標は動かさない。
  ===================================================== */

  const bob =
    Math.sin(

      time*
      .001*
      creatureBobSpeed

      +

      creatureBobPhase

    )

    *

    creatureBobAmplitude;


  const x =
    p.x;


  const y =
    p.y+
    bob;


  const size =
    clamp(

      Math.min(
        W,
        H
      )

      *

      .085,

      32,

      62

    );


  ctx.save();


  ctx.translate(
    x,
    y
  );


  /* =====================================================
     AURA
  ===================================================== */

  ctx.beginPath();


  ctx.arc(
    0,
    0,
    size*.72,
    0,
    Math.PI*2
  );


  ctx.fillStyle =
    locked
    ?
    "rgba(90,240,255,.30)"
    :
    "rgba(160,100,255,.24)";


  ctx.fill();


  /* =====================================================
     SHADOW
  ===================================================== */

  ctx.beginPath();


  ctx.ellipse(
    0,
    size*.45,
    size*.38,
    size*.10,
    0,
    0,
    Math.PI*2
  );


  ctx.fillStyle =
    "rgba(0,0,0,.25)";


  ctx.fill();


  /* =====================================================
     BODY
  ===================================================== */

  ctx.beginPath();


  ctx.ellipse(
    0,
    0,
    size*.38,
    size*.35,
    0,
    0,
    Math.PI*2
  );


  ctx.fillStyle =
    locked
    ?
    "#69efff"
    :
    "#8257d6";


  ctx.fill();


  /* =====================================================
     EARS
  ===================================================== */

  ctx.beginPath();

  ctx.moveTo(
    -size*.27,
    -size*.25
  );

  ctx.lineTo(
    -size*.42,
    -size*.50
  );

  ctx.lineTo(
    -size*.08,
    -size*.31
  );

  ctx.fill();


  ctx.beginPath();

  ctx.moveTo(
    size*.27,
    -size*.25
  );

  ctx.lineTo(
    size*.42,
    -size*.50
  );

  ctx.lineTo(
    size*.08,
    -size*.31
  );

  ctx.fill();


  /* =====================================================
     EYES
  ===================================================== */

  ctx.fillStyle="#fff";


  ctx.beginPath();

  ctx.arc(
    -size*.13,
    -size*.07,
    size*.07,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    size*.13,
    -size*.07,
    size*.07,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* pupils */

  ctx.fillStyle="#151020";


  ctx.beginPath();

  ctx.arc(
    -size*.13,
    -size*.06,
    size*.032,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    size*.13,
    -size*.06,
    size*.032,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* =====================================================
     LEGS
  ===================================================== */

  ctx.strokeStyle =
    locked
    ?
    "#69efff"
    :
    "#8257d6";


  ctx.lineWidth =
    Math.max(
      4,
      size*.07
    );


  ctx.lineCap =
    "round";


  ctx.beginPath();


  ctx.moveTo(
    -size*.20,
    size*.25
  );

  ctx.lineTo(
    -size*.25,
    size*.43
  );


  ctx.moveTo(
    0,
    size*.27
  );

  ctx.lineTo(
    0,
    size*.47
  );


  ctx.moveTo(
    size*.20,
    size*.25
  );

  ctx.lineTo(
    size*.25,
    size*.43
  );


  ctx.stroke();


  ctx.restore();

}


/* =========================================================
   MOTION / SHAKE
========================================================= */

function motionHandler(e){

  if(
    !running
    ||
    !creatureVisible
    ||
    locked
  ){

    return;

  }


  const a =
    e.accelerationIncludingGravity;


  if(!a){
    return;
  }


  const x =
    a.x || 0;

  const y =
    a.y || 0;

  const z =
    a.z || 0;


  const magnitude =
    Math.sqrt(
      x*x+
      y*y+
      z*z
    );


  const shake =
    Math.abs(
      magnitude-
      9.81
    );


  if(
    shake<
    SHAKE_THRESHOLD
  ){

    return;

  }


  const now =
    performance.now();


  if(
    now-lastShake<
    500
  ){

    return;

  }


  lastShake =
    now;


  lockCreature(
    shake
  );

}


/* =========================================================
   LOCK
========================================================= */

function lockCreature(power){

  if(
    !creatureVisible
    ||
    locked
  ){

    return;

  }


  locked=true;

  escaping=false;


  let seconds =

    MIN_LOCK

    +

    (
      power-
      SHAKE_THRESHOLD
    )

    *

    .35;


  seconds =
    clamp(
      seconds,
      MIN_LOCK,
      MAX_LOCK
    );


  lockEnd =
    performance.now()
    +
    seconds*
    1000;


  lockText.textContent =
    "⚡ LOCK!";


  lockText.style.display =
    "block";


  timer.style.display =
    "block";


  timer.textContent =
    seconds.toFixed(1);


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [
        70,
        40,
        120
      ]
    );

  }

}


/* =========================================================
   HP
========================================================= */

function updateHP(){

  hpNumber.textContent =
    Math.ceil(
      hp
    );


  hpInner.style.width =
    (
      hp/
      MAX_HP*
      100
    )
    +
    "%";

}


/* =========================================================
   STOP CAMERA WHEN LEAVING PAGE
========================================================= */

window.addEventListener(
"pagehide",
()=>{

  const stream =
    camera.srcObject;


  if(stream){

    for(
      const track
      of
      stream.getTracks()
    ){

      track.stop();

    }

  }

});
