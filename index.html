<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>360 Hunt</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* =========================
   CAMERA
========================= */

#camera{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    display:none;

    background:#000;

    z-index:1;
}

/* =========================
   CHARACTER
========================= */

#character{
    position:fixed;

    left:50%;
    top:52%;

    width:100px;
    height:100px;

    transform:
        translate(-50%,-50%);

    display:none;

    align-items:center;
    justify-content:center;

    font-size:76px;

    z-index:10;

    pointer-events:none;

    filter:
        drop-shadow(
            0 7px 7px
            rgba(0,0,0,.55)
        );

    will-change:
        left,
        top,
        transform;
}

/* =========================
   HP
========================= */

#hpPanel{
    position:fixed;

    top:
        calc(
            18px +
            env(safe-area-inset-top)
        );

    left:50%;

    transform:
        translateX(-50%);

    width:min(82vw,380px);

    z-index:30;

    display:none;
}

#hpTitle{
    margin-bottom:6px;

    color:white;

    font-size:13px;

    font-weight:800;

    text-shadow:
        0 2px 5px black;
}

#hpBack{
    height:14px;

    overflow:hidden;

    border:
        2px solid white;

    border-radius:20px;

    background:
        rgba(0,0,0,.6);
}

#hpBar{
    width:100%;
    height:100%;

    background:white;

    transition:
        width .1s;
}

/* =========================
   MESSAGE
========================= */

#message{
    position:fixed;

    left:50%;
    top:23%;

    transform:
        translate(-50%,-50%);

    z-index:40;

    display:none;

    color:white;

    font-size:25px;

    font-weight:900;

    text-align:center;

    text-shadow:
        0 3px 10px black;

    white-space:nowrap;
}

/* =========================
   LOCK EFFECT
========================= */

#lockRing{
    position:fixed;

    left:50%;
    top:52%;

    width:180px;
    height:180px;

    transform:
        translate(-50%,-50%);

    border:
        5px solid #67f5ff;

    border-radius:50%;

    box-shadow:
        0 0 30px #67f5ff,
        inset 0 0 30px #67f5ff55;

    display:none;

    z-index:8;

    pointer-events:none;
}

#lockTime{
    position:fixed;

    left:50%;
    top:calc(52% + 115px);

    transform:
        translateX(-50%);

    z-index:30;

    display:none;

    color:white;

    font-size:32px;

    font-weight:900;

    text-shadow:
        0 3px 8px black;
}

/* =========================
   DEBUG
========================= */

#debug{
    position:fixed;

    right:10px;

    bottom:
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    z-index:50;

    display:none;

    padding:8px 10px;

    border-radius:10px;

    background:
        rgba(0,0,0,.55);

    color:white;

    font-family:monospace;

    font-size:10px;

    line-height:1.5;

    pointer-events:none;
}

/* =========================
   START
========================= */

#startScreen{
    position:fixed;
    inset:0;

    z-index:100;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    padding:30px;

    text-align:center;

    color:white;

    background:
        radial-gradient(
            circle at 50% 30%,
            #353535,
            #111 55%,
            #000
        );
}

#startScreen h1{
    margin:8px 0 12px;

    font-size:31px;
}

#startScreen p{
    max-width:420px;

    margin:0;

    opacity:.75;

    font-size:14px;

    line-height:1.8;
}

#startButton{
    margin-top:28px;

    min-width:260px;

    padding:18px 30px;

    border:0;

    border-radius:100px;

    background:white;

    color:#111;

    font-size:18px;

    font-weight:900;
}

#error{
    margin-top:20px;

    color:#ff9999;

    font-size:13px;

    white-space:pre-line;
}

</style>
</head>

<body>


<!-- CAMERA -->

<video
id="camera"
autoplay
muted
playsinline
webkit-playsinline>
</video>


<!-- CHARACTER -->

<div id="character">
👾
</div>


<!-- LOCK -->

<div id="lockRing"></div>

<div id="lockTime">
6.0
</div>


<!-- HP -->

<div id="hpPanel">

    <div id="hpTitle">
        👾 HP
        <span id="hpNumber">
            100
        </span>
        / 100
    </div>

    <div id="hpBack">
        <div id="hpBar"></div>
    </div>

</div>


<!-- MESSAGE -->

<div id="message"></div>


<!-- DEBUG -->

<div id="debug">

PHONE:
<span id="phoneDebug">0</span>°

<br>

ENEMY:
<span id="enemyDebug">0</span>°

<br>

DIFF:
<span id="diffDebug">0</span>°

<br>

STATE:
<span id="stateDebug">SEARCH</span>

</div>


<!-- START -->

<div id="startScreen">

    <div style="font-size:72px">
        📱 👾
    </div>

    <h1>
        360° HUNT
    </h1>

    <p>
        👾はあなたの周囲360°の
        どこかに出現します。
        <br><br>

        スマホを持って、
        実際に周囲を見回してください。
        <br><br>

        👾を画面内にとらえた状態で
        スマホを振ると拘束できます。
        <br><br>

        HPを0にすると捕獲成功。
    </p>

    <button id="startButton">
        HUNT START
    </button>

    <div id="error"></div>

</div>


<script>

/* =====================================
   ELEMENTS
===================================== */

const camera =
document.getElementById("camera");

const character =
document.getElementById("character");

const hpPanel =
document.getElementById("hpPanel");

const hpBar =
document.getElementById("hpBar");

const hpNumber =
document.getElementById("hpNumber");

const message =
document.getElementById("message");

const lockRing =
document.getElementById("lockRing");

const lockTime =
document.getElementById("lockTime");

const startScreen =
document.getElementById("startScreen");

const startButton =
document.getElementById("startButton");

const errorBox =
document.getElementById("error");

const debug =
document.getElementById("debug");

const phoneDebug =
document.getElementById("phoneDebug");

const enemyDebug =
document.getElementById("enemyDebug");

const diffDebug =
document.getElementById("diffDebug");

const stateDebug =
document.getElementById("stateDebug");


/* =====================================
   SETTINGS
===================================== */

/*
 カメラ水平視野角

 iPhoneによって実際には違うが、
 ゲーム用として約65°
*/

const FOV = 65;


/*
 キャラクターHP
*/

const MAX_HP = 100;


/*
 ロック中のダメージ / 秒
*/

const DAMAGE_PER_SECOND = 10;


/*
 最大ロック時間
*/

const MAX_LOCK_TIME = 6000;


/*
 最低ロック時間
*/

const MIN_LOCK_TIME = 1500;


/*
 振った判定
*/

const SHAKE_THRESHOLD = 10;


/*
 発見後の逃走速度

 度 / 秒

 前の版よりかなり遅い
*/

const ESCAPE_MIN_SPEED = 18;

const ESCAPE_MAX_SPEED = 35;


/*
 潜伏エリア

 逃げた方向160°
*/

const HIDE_AREA_SIZE = 160;


/* =====================================
   STATE
===================================== */

let stream = null;


/*
 端末の現在方向

 開始方向 = 0°
*/

let phoneAngle = 0;


/*
 前回取得したraw alpha
*/

let previousRawAngle = null;


/*
 累積回転角

 360°を超えても
 連続する
*/

let accumulatedRotation = 0;


/*
 キャラ位置

 0〜360°
*/

let enemyAngle = 0;


/*
 HP
*/

let hp = MAX_HP;


/*
 キャラを一度でも
 発見したか
*/

let discovered = false;


/*
 発見後の逃走方向

 -1 左
 +1 右
*/

let escapeDirection = 0;


/*
 逃走速度
*/

let escapeSpeed = 0;


/*
 逃走開始角度
*/

let escapeStartAngle = 0;


/*
 最大移動距離
*/

let escapeDistance = 0;


/*
 現在までの逃走距離
*/

let travelledDistance = 0;


/*
 潜伏状態
*/

let hiding = false;


/*
 画面内か
*/

let enemyVisible = false;


/*
 ロック
*/

let locked = false;

let lockEnd = 0;


/*
 振り判定
*/

let lastShake = 0;


/*
 animation
*/

let lastFrame =
performance.now();

let gameRunning = false;


/* =====================================
   UTIL
===================================== */

function random(min,max){

    return (
        Math.random() *
        (max-min)
        +
        min
    );

}


function normalize(angle){

    angle %= 360;

    if(angle < 0){
        angle += 360;
    }

    return angle;

}


/*
 2つの角度の最短差

 -180〜180
*/

function angleDifference(
    target,
    current
){

    let diff =
        normalize(target)
        -
        normalize(current);


    if(diff > 180){
        diff -= 360;
    }


    if(diff < -180){
        diff += 360;
    }


    return diff;

}


/* =====================================
   START
===================================== */

startButton.addEventListener(
"click",
async()=>{

    try{

        errorBox.textContent="";


        /* =================================
           SENSOR PERMISSION

           ★カメラより先
        ================================= */

        if(
            typeof
            DeviceOrientationEvent
            !==
            "undefined"

            &&

            typeof
            DeviceOrientationEvent
            .requestPermission
            ===
            "function"
        ){

            const result =
                await
                DeviceOrientationEvent
                .requestPermission();


            if(result !== "granted"){

                throw new Error(
                    "方向センサーが許可されませんでした。"
                );

            }

        }


        if(
            typeof
            DeviceMotionEvent
            !==
            "undefined"

            &&

            typeof
            DeviceMotionEvent
            .requestPermission
            ===
            "function"
        ){

            const result =
                await
                DeviceMotionEvent
                .requestPermission();


            if(result !== "granted"){

                throw new Error(
                    "モーションセンサーが許可されませんでした。"
                );

            }

        }


        /* =================================
           SENSOR EVENTS
        ================================= */

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );


        window.addEventListener(
            "devicemotion",
            handleMotion,
            {
                passive:true
            }
        );


        /* =================================
           CAMERA
        ================================= */

        if(
            !navigator.mediaDevices
            ||
            !navigator.mediaDevices
            .getUserMedia
        ){

            throw new Error(
                "カメラを使用できません。HTTPSで開いてください。"
            );

        }


        stream =
            await
            navigator.mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:
                            "environment"
                    }

                }

            });


        camera.srcObject =
            stream;


        camera.muted=true;


        camera.setAttribute(
            "playsinline",
            ""
        );


        await camera.play();


        /* =================================
           RESET ORIENTATION
        ================================= */

        previousRawAngle =
            null;

        accumulatedRotation =
            0;

        phoneAngle =
            0;


        /* =================================
           RANDOM ENEMY

           0〜360°
           完全ランダム
        ================================= */

        enemyAngle =
            random(
                0,
                360
            );


        /*
         開始直後に目の前にいる
         可能性も普通にある。
        */


        hp =
            MAX_HP;


        discovered =
            false;


        hiding =
            false;


        locked =
            false;


        travelledDistance =
            0;


        updateHP();


        /* =================================
           SHOW
        ================================= */

        startScreen.style.display=
            "none";


        camera.style.display=
            "block";


        hpPanel.style.display=
            "block";


        /*
         デバッグを見たい場合だけ
         blockにする
        */

        debug.style.display=
            "none";


        gameRunning =
            true;


        lastFrame =
            performance.now();


        requestAnimationFrame(
            gameLoop
        );

    }

    catch(error){

        console.error(error);


        errorBox.textContent =

            (error.name || "")

            +

            "\n"

            +

            (
                error.message
                ||
                String(error)
            );

    }

});


/* =====================================
   ORIENTATION

   重要部分
===================================== */

function handleOrientation(event){

    let raw = null;


    /*
     iPhoneで
     compass headingが取れる場合
    */

    if(
        typeof
        event.webkitCompassHeading
        ===
        "number"
    ){

        raw =
            event.webkitCompassHeading;

    }

    else if(
        event.alpha !== null
    ){

        raw =
            360 -
            event.alpha;

    }


    if(raw === null){
        return;
    }


    raw =
        normalize(raw);


    /*
     最初の値
    */

    if(
        previousRawAngle ===
        null
    ){

        previousRawAngle =
            raw;

        phoneAngle =
            0;

        return;

    }


    /* =================================
       DELTA

       359° → 0°
       0° → 359°

       を正しく処理
    ================================= */

    let delta =
        raw -
        previousRawAngle;


    if(delta > 180){

        delta -= 360;

    }


    if(delta < -180){

        delta += 360;

    }


    /*
     異常な瞬間ジャンプを無視

     センサー誤差対策
    */

    if(
        Math.abs(delta)
        <
        45
    ){

        accumulatedRotation +=
            delta;

    }


    previousRawAngle =
        raw;


    /*
     ゲーム上では
     0〜360°
    */

    phoneAngle =
        normalize(
            accumulatedRotation
        );

}


/* =====================================
   GAME LOOP
===================================== */

function gameLoop(time){

    if(!gameRunning){
        return;
    }


    let dt =
        (
            time -
            lastFrame
        )
        /
        1000;


    lastFrame =
        time;


    dt =
        Math.min(
            dt,
            .05
        );


    /* =================================
       LOCKED
    ================================= */

    if(locked){

        const remaining =
            lockEnd -
            time;


        /*
         DAMAGE
        */

        hp -=
            DAMAGE_PER_SECOND
            *
            dt;


        hp =
            Math.max(
                0,
                hp
            );


        updateHP();


        /* =============================
           CAPTURED
        ============================= */

        if(hp <= 0){

            gameRunning =
                false;


            locked =
                false;


            lockRing.style.display=
                "none";


            lockTime.style.display=
                "none";


            character.style.display=
                "flex";


            message.innerHTML =
                "🎉 CAPTURED!<br>👾 GET!";


            message.style.display=
                "block";


            return;

        }


        /* =============================
           LOCK END
        ============================= */

        if(
            remaining <= 0
        ){

            locked =
                false;


            lockRing.style.display=
                "none";


            lockTime.style.display=
                "none";


            message.textContent =
                "💨";


            message.style.display=
                "block";


            setTimeout(
                ()=>{

                    if(!locked){

                        message.style.display=
                            "none";

                    }

                },
                400
            );


            /*
             また発見された扱いから
             新しい逃走開始
            */

            startEscape();

        }

        else{

            lockTime.textContent =
                (
                    remaining /
                    1000
                )
                .toFixed(1);

        }

    }


    /* =================================
       ESCAPING
    ================================= */

    else if(
        discovered
        &&
        !hiding
    ){

        const movement =
            escapeSpeed
            *
            dt;


        enemyAngle +=
            escapeDirection
            *
            movement;


        enemyAngle =
            normalize(
                enemyAngle
            );


        travelledDistance +=
            movement;


        /*
         160°以上は進まない
        */

        if(
            travelledDistance >=
            escapeDistance
        ){

            hiding =
                true;

        }

    }


    /* =================================
       ANGLE DIFFERENCE
    ================================= */

    const diff =
        angleDifference(
            enemyAngle,
            phoneAngle
        );


    /* =================================
       VISIBILITY
    ================================= */

    const halfFov =
        FOV / 2;


    const wasVisible =
        enemyVisible;


    enemyVisible =
        Math.abs(diff)
        <
        halfFov;


    /* =================================
       FIRST DISCOVERY
    ================================= */

    if(
        enemyVisible
        &&
        !discovered
    ){

        discovered =
            true;


        startEscape();

    }


    /* =================================
       DRAW CHARACTER
    ================================= */

    if(enemyVisible){

        character.style.display=
            "flex";


        /*
         方角差
         ↓
         画面位置
        */

        const ratio =
            diff /
            halfFov;


        let screenX =
            50
            -
            ratio *
            50;


        /*
         端で少し切れるようにする
        */

        screenX =
            Math.max(
                -4,
                Math.min(
                    104,
                    screenX
                )
            );


        character.style.left =
            screenX +
            "%";


        /*
         少しだけ上下する

         大きく動かさない
        */

        const bob =
            Math.sin(
                time *
                .004
            )
            *
            6;


        character.style.top =
            `calc(52% + ${bob}px)`;


        /*
         逃げている方向を向く
        */

        const flip =
            escapeDirection >= 0
            ?
            1
            :
            -1;


        character.style.transform =
            `
            translate(-50%,-50%)
            scaleX(${flip})
            `;

    }

    else{

        character.style.display=
            "none";

    }


    /* =================================
       DEBUG
    ================================= */

    phoneDebug.textContent =
        phoneAngle.toFixed(1);


    enemyDebug.textContent =
        enemyAngle.toFixed(1);


    diffDebug.textContent =
        diff.toFixed(1);


    if(locked){

        stateDebug.textContent =
            "LOCK";

    }

    else if(!discovered){

        stateDebug.textContent =
            "SEARCH";

    }

    else if(hiding){

        stateDebug.textContent =
            "HIDING";

    }

    else{

        stateDebug.textContent =
            "ESCAPE";

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================
   START ESCAPE
===================================== */

function startEscape(){

    discovered =
        true;


    hiding =
        false;


    travelledDistance =
        0;


    /*
     右 or 左

     一度決めたら
     今回の逃走中は逆行しない
    */

    escapeDirection =
        Math.random() < .5
        ?
        -1
        :
        1;


    /*
     ゆっくりめ
    */

    escapeSpeed =
        random(
            ESCAPE_MIN_SPEED,
            ESCAPE_MAX_SPEED
        );


    /*
     現在位置を
     逃走開始地点として記録
    */

    escapeStartAngle =
        enemyAngle;


    /*
     逃げる距離

     60〜160°

     最大160°。
    */

    escapeDistance =
        random(
            60,
            HIDE_AREA_SIZE
        );

}


/* =====================================
   SHAKE
===================================== */

function handleMotion(event){

    if(
        !gameRunning
        ||
        !enemyVisible
        ||
        locked
    ){

        return;

    }


    const a =
        event.accelerationIncludingGravity;


    if(!a){
        return;
    }


    const x =
        a.x || 0;

    const y =
        a.y || 0;

    const z =
        a.z || 0;


    const total =
        Math.sqrt(
            x*x +
            y*y +
            z*z
        );


    const shake =
        Math.abs(
            total -
            9.81
        );


    if(
        shake >
        SHAKE_THRESHOLD
    ){

        const now =
            performance.now();


        if(
            now -
            lastShake
            <
            500
        ){

            return;

        }


        lastShake =
            now;


        lockEnemy(
            shake
        );

    }

}


/* =====================================
   LOCK
===================================== */

function lockEnemy(power){

    if(
        !enemyVisible
        ||
        locked
    ){

        return;

    }


    locked =
        true;


    /* =================================
       SHAKE POWER
       ↓
       1.5〜6 sec
    ================================= */

    let seconds =

        1.5

        +

        (
            power -
            SHAKE_THRESHOLD
        )

        *
        .35;


    seconds =
        Math.max(

            1.5,

            Math.min(
                6,
                seconds
            )

        );


    lockEnd =
        performance.now()
        +
        seconds *
        1000;


    message.textContent =
        "⚡ LOCK";


    message.style.display=
        "block";


    lockRing.style.display=
        "block";


    lockTime.style.display=
        "block";


    lockTime.textContent =
        seconds.toFixed(1);


    /*
     バイブ対応端末
    */

    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            [
                70,
                40,
                120
            ]
        );

    }

}


/* =====================================
   HP
===================================== */

function updateHP(){

    hpNumber.textContent =
        Math.ceil(
            hp
        );


    const percentage =
        (
            hp /
            MAX_HP
        )
        *
        100;


    hpBar.style.width =
        percentage +
        "%";

}


/* =====================================
   PAGE CLOSE
===================================== */

window.addEventListener(
    "pagehide",
    ()=>{

        gameRunning =
            false;


        if(stream){

            stream
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );

        }

    }
);

</script>

</body>
</html>
