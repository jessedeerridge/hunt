<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>PIXEL CAMERA HUNT 360</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:monospace;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  z-index:0;
  display:none;
}

#world{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  z-index:0;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  pointer-events:none;
  image-rendering:pixelated;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  pointer-events:none;
}

/* HP */

#hp{
  position:absolute;
  top:calc(14px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  width:min(82vw,390px);
}

#hpText{
  color:#fff;
  font-size:13px;
  font-weight:900;
  text-shadow:2px 2px #000;
}

#hpOuter{
  height:17px;
  margin-top:5px;
  border:3px solid #fff;
  background:#111;
  box-shadow:3px 3px #000;
}

#hpInner{
  width:100%;
  height:100%;
  background:#fff;
}

/* LOCK */

#lock{
  position:absolute;
  top:18%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;

  padding:9px 15px;

  background:#111;
  border:3px solid #fff;
  box-shadow:4px 4px #000;

  color:#fff;
  font-size:22px;
  font-weight:900;
}

#timer{
  position:absolute;
  bottom:17%;
  left:50%;
  transform:translateX(-50%);
  display:none;

  padding:6px 12px;

  background:#111;
  border:3px solid #fff;
  box-shadow:4px 4px #000;

  color:#fff;
  font-size:30px;
  font-weight:900;
}

#cooldown{
  position:absolute;
  top:25%;
  left:50%;
  transform:translateX(-50%);
  display:none;

  padding:7px 12px;

  background:rgba(0,0,0,.72);
  border:2px solid #fff;

  color:#fff;
  font-size:13px;
  font-weight:900;
}

#sensorWait{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;

  padding:10px 17px;

  background:#111;
  border:3px solid #fff;

  color:#fff;
  font-weight:900;
}

/* MODE */

#modeSwitch{
  position:absolute;
  left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%);

  display:flex;
  gap:5px;

  padding:5px;

  background:rgba(0,0,0,.68);
  border:2px solid #fff;

  pointer-events:auto;
}

#modeSwitch button{
  min-width:92px;
  padding:11px 16px;

  border:0;
  background:transparent;

  color:#fff;

  font-family:monospace;
  font-size:12px;
  font-weight:900;
}

#modeSwitch button.active{
  background:#fff;
  color:#111;
}

#debug{
  position:absolute;
  right:6px;
  bottom:6px;

  padding:5px 7px;

  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.7);

  color:#fff;
  font-size:8px;
  line-height:1.45;
}

/* START */

#start{
  position:fixed;
  inset:0;
  z-index:100;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  padding:
    calc(25px + env(safe-area-inset-top))
    25px
    calc(25px + env(safe-area-inset-bottom));

  background:#161925;
  color:#fff;
  text-align:center;
}

#startIcon{
  font-size:64px;
}

#start h1{
  margin:8px 0 10px;
  font-size:25px;
}

#start p{
  max-width:430px;
  margin:5px 0;

  font-size:13px;
  line-height:1.7;
  opacity:.86;
}

#secureStatus{
  margin-top:12px;
  padding:6px 10px;

  border:1px solid rgba(255,255,255,.35);
  font-size:11px;
}

#startButton{
  min-width:250px;
  margin-top:18px;
  padding:17px 25px;

  border:3px solid #fff;

  background:#fff;
  color:#111;

  box-shadow:6px 6px #000;

  font-family:monospace;
  font-size:16px;
  font-weight:900;
}

#startButton:active{
  transform:translate(3px,3px);
  box-shadow:3px 3px #000;
}

#startButton:disabled{
  opacity:.55;
}

#error{
  max-width:430px;
  margin-top:16px;

  color:#ffaaaa;

  font-size:11px;
  line-height:1.55;
  white-space:pre-line;
}
</style>
</head>

<body>

<video
  id="camera"
  autoplay
  muted
  playsinline>
</video>

<canvas id="world"></canvas>
<canvas id="game"></canvas>

<div id="hud">

  <div id="hp">
    <div id="hpText">
      CREATURE HP
      <span id="hpNumber">100</span>
      / 100
    </div>

    <div id="hpOuter">
      <div id="hpInner"></div>
    </div>
  </div>

  <div id="lock">⚡ LOCK!</div>

  <div id="timer">5.0</div>

  <div id="cooldown">
    LOCK DISABLED 3.0
  </div>

  <div id="sensorWait">
    SENSOR...
  </div>

  <div id="modeSwitch">
    <button id="pixelMode" class="active">
      PIXEL
    </button>

    <button id="cameraMode">
      CAMERA
    </button>
  </div>

  <div id="debug"></div>

</div>

<div id="start">

  <div id="startIcon">👾</div>

  <h1>PIXEL CAMERA HUNT 360</h1>

  <p>
    STARTを1回タップしてください。
    <br><br>
    360°スマホを動かしてキャラクターを探します。
    <br><br>
    発見されるとキャラクターは逃走。
    スマホを振ると最大5秒間ロックできます。
    <br><br>
    ロック解除後3秒間は再ロックできません。
    <br><br>
    映像の録画・保存・送信は行いません。
  </p>

  <div id="secureStatus">
    CHECKING...
  </div>

  <button id="startButton">
    START
  </button>

  <div id="error"></div>

</div>


<script>
"use strict";

/* =========================================================
   ELEMENT
========================================================= */

const camera = document.getElementById("camera");

const world = document.getElementById("world");
const wctx = world.getContext("2d",{alpha:false});

const game = document.getElementById("game");
const ctx = game.getContext("2d");

const start = document.getElementById("start");
const startButton = document.getElementById("startButton");

const errorBox = document.getElementById("error");
const secureStatus = document.getElementById("secureStatus");

const hud = document.getElementById("hud");

const hpNumber = document.getElementById("hpNumber");
const hpInner = document.getElementById("hpInner");

const lockText = document.getElementById("lock");
const timer = document.getElementById("timer");
const cooldownText = document.getElementById("cooldown");

const sensorWait = document.getElementById("sensorWait");
const debug = document.getElementById("debug");

const pixelModeButton = document.getElementById("pixelMode");
const cameraModeButton = document.getElementById("cameraMode");


/* =========================================================
   HTTPS
========================================================= */

if(window.isSecureContext){

  secureStatus.textContent =
    "✓ SECURE";

}else{

  secureStatus.textContent =
    "⚠ HTTPS REQUIRED";

  secureStatus.style.color =
    "#ff9999";
}


/* =========================================================
   SCREEN
========================================================= */

let W = innerWidth;
let H = innerHeight;

let DPR = 1;


function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR = Math.min(
    devicePixelRatio || 1,
    2
  );

  game.width =
    Math.round(W * DPR);

  game.height =
    Math.round(H * DPR);

  game.style.width =
    W + "px";

  game.style.height =
    H + "px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  ctx.imageSmoothingEnabled =
    false;
}


addEventListener("resize",resize);

addEventListener(
  "orientationchange",
  ()=>setTimeout(resize,250)
);

resize();


/* =========================================================
   PIXEL CAMERA
========================================================= */

const PIXEL_WIDTH = 70;

const rawCanvas =
  document.createElement("canvas");

const rawCtx =
  rawCanvas.getContext(
    "2d",
    {alpha:false}
  );

let pixelW = PIXEL_WIDTH;
let pixelH = 100;


/* =========================================================
   DISPLAY MODE
========================================================= */

let displayMode = "pixel";


function setDisplayMode(mode){

  displayMode = mode;

  if(mode === "pixel"){

    world.style.display = "block";
    camera.style.display = "none";

    pixelModeButton.classList.add("active");
    cameraModeButton.classList.remove("active");

  }else{

    world.style.display = "none";
    camera.style.display = "block";

    pixelModeButton.classList.remove("active");
    cameraModeButton.classList.add("active");
  }
}


pixelModeButton.addEventListener(
  "click",
  ()=>setDisplayMode("pixel")
);

cameraModeButton.addEventListener(
  "click",
  ()=>setDisplayMode("camera")
);


/* =========================================================
   SETTINGS
========================================================= */

const HFOV = 68;
const VFOV = 55;

const MAX_HP = 100;

const DAMAGE_PER_SECOND = 12;

const SHAKE_THRESHOLD = 9;


/* LOCK */

const MIN_LOCK = 1.5;
const MAX_LOCK = 5;

const LOCK_COOLDOWN = 3000;


/* SPEED */

const ESCAPE_SPEED_MIN = 7;
const ESCAPE_SPEED_MAX = 10;

const VISIBLE_SPEED_BOOST = 1.35;

const RELEASE_SPEED_BOOST = 1.65;

const ESCAPE_DISTANCE_MIN = 55;
const ESCAPE_DISTANCE_MAX = 160;


/* SENSOR */

const YAW_SMOOTH = .24;
const PITCH_SMOOTH = .20;


/* =========================================================
   ZONES
========================================================= */

const CREATURE_ZONES = {

  SKY:{
    minPitch:20,
    maxPitch:34
  },

  FRONT:{
    minPitch:-6,
    maxPitch:6
  },

  EARTH:{
    minPitch:-34,
    maxPitch:-20
  }

};


/* =========================================================
   SENSOR STATE
========================================================= */

let cameraYaw = 0;
let cameraPitch = 0;

let targetYaw = 0;
let targetPitch = 0;

let sensorReady = false;


/* =========================================================
   CREATURE
========================================================= */

let creatureZone = "FRONT";

let creatureYaw = 0;
let creaturePitch = 0;

let creatureBasePitch = 0;

let creatureBobAmplitude = 10;
let creatureBobPhase = 0;
let creatureBobSpeed = 1;

let creatureVisible = false;
let wasCreatureVisible = false;

let escaping = false;

let escapeDirection = 1;
let escapeSpeed = 0;

let escapeDistance = 0;
let escapeTravel = 0;


/* =========================================================
   ANIMATION STATE

   1-4   MOVE
   5-7   TURN
   8     SLEEP
   9     NOTICE
   10-11 DAMAGE
   12-13 ATTACK
   14-15 SPECIAL
========================================================= */

let animState = "sleep";

let animFrame = 8;

let animStateStart = 0;

let nextSpecialTime = 0;

let nextAttackTime = 0;


/* =========================================================
   GAME
========================================================= */

let running = false;

let hp = MAX_HP;

let locked = false;

let lockEnd = 0;

let lockCooldownUntil = 0;

let lastShake = 0;

let lastTime = 0;


/* =========================================================
   MATH
========================================================= */

function rad(v){
  return v * Math.PI / 180;
}

function deg(v){
  return v * 180 / Math.PI;
}

function clamp(v,min,max){
  return Math.max(
    min,
    Math.min(max,v)
  );
}

function random(min,max){
  return Math.random()*(max-min)+min;
}

function normalize360(a){

  a %= 360;

  if(a < 0){
    a += 360;
  }

  return a;
}

function angleDiff(target,current){

  let d =
    normalize360(target) -
    normalize360(current);

  if(d > 180){
    d -= 360;
  }

  if(d < -180){
    d += 360;
  }

  return d;
}

function smoothAngle(current,target,amount){

  return normalize360(

    current +

    angleDiff(target,current) *
    amount
  );
}


/* =========================================================
   SPAWN
========================================================= */

function spawnCreature(){

  const types = [
    "SKY",
    "FRONT",
    "EARTH"
  ];

  creatureZone =
    types[
      Math.floor(
        Math.random()*types.length
      )
    ];

  const zone =
    CREATURE_ZONES[
      creatureZone
    ];

  /*
    360°ランダム
  */

  creatureYaw =
    random(0,360);

  creatureBasePitch =
    random(
      zone.minPitch,
      zone.maxPitch
    );

  creaturePitch =
    creatureBasePitch;

  creatureBobAmplitude =
    random(5,20);

  creatureBobPhase =
    random(0,Math.PI*2);

  creatureBobSpeed =
    random(.7,1.3);

  creatureVisible = false;
  wasCreatureVisible = false;

  escaping = false;

  animState = "sleep";
  animFrame = 8;

  animStateStart =
    performance.now();

  nextSpecialTime =
    performance.now() +
    random(3500,7000);

  nextAttackTime =
    performance.now() +
    random(5000,9000);
}


/* =========================================================
   ONE TAP START
========================================================= */

startButton.addEventListener(
"click",
async function(){

  startButton.disabled = true;
  startButton.textContent = "STARTING...";

  errorBox.textContent = "";

  try{

    if(!window.isSecureContext){

      throw new Error(
        "HTTPSで開いてください。"
      );
    }

    /*
      重要：
      requestPermission()の前に
      awaitしない
    */

    let orientationPromise = null;
    let motionPromise = null;

    if(
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ){

      orientationPromise =
        DeviceOrientationEvent.requestPermission();
    }

    if(
      typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function"
    ){

      motionPromise =
        DeviceMotionEvent.requestPermission();
    }


    if(orientationPromise){

      const result =
        await orientationPromise;

      if(result !== "granted"){

        throw new Error(
          "方向センサーが許可されませんでした。"
        );
      }
    }


    if(motionPromise){

      const result =
        await motionPromise;

      if(result !== "granted"){

        throw new Error(
          "モーションセンサーが許可されませんでした。"
        );
      }
    }


    if(
      !navigator.mediaDevices ||
      typeof navigator.mediaDevices.getUserMedia !== "function"
    ){

      throw new Error(
        "カメラを使用できません。"
      );
    }


    let stream;

    try{

      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            }
          },

          audio:false
        });

    }catch(e){

      stream =
        await navigator.mediaDevices.getUserMedia({
          video:true,
          audio:false
        });
    }


    camera.srcObject =
      stream;

    camera.muted = true;
    camera.playsInline = true;

    await camera.play();


    window.addEventListener(
      "deviceorientation",
      orientationHandler,
      true
    );

    window.addEventListener(
      "devicemotion",
      motionHandler,
      {passive:true}
    );


    hp = MAX_HP;

    locked = false;

    lockEnd = 0;
    lockCooldownUntil = 0;

    sensorReady = false;

    spawnCreature();

    updateHP();

    setDisplayMode("pixel");

    start.style.display =
      "none";

    hud.style.display =
      "block";

    sensorWait.style.display =
      "block";

    running = true;

    lastTime =
      performance.now();

    requestAnimationFrame(
      cameraLoop
    );

    requestAnimationFrame(
      gameLoop
    );

  }catch(e){

    console.error(e);

    startButton.disabled =
      false;

    startButton.textContent =
      "START";

    let message =
      (e.name || "ERROR") +
      "\n" +
      (e.message || String(e));

    if(
      String(e.message)
      .toLowerCase()
      .includes("user gesture")
    ){

      message +=
        "\n\nSTARTをもう一度タップしてください。";
    }

    errorBox.textContent =
      message;
  }
});


/* =========================================================
   CAMERA LOOP
========================================================= */

function cameraLoop(){

  if(!running){
    return;
  }

  if(
    displayMode === "pixel" &&
    camera.readyState >= 2 &&
    camera.videoWidth > 0
  ){

    drawPixelCamera();
  }

  requestAnimationFrame(
    cameraLoop
  );
}


/* =========================================================
   PIXEL CAMERA
========================================================= */

function drawPixelCamera(){

  const vw = camera.videoWidth;
  const vh = camera.videoHeight;

  if(!vw || !vh){
    return;
  }

  const screenRatio = W/H;
  const videoRatio = vw/vh;

  let sx = 0;
  let sy = 0;

  let sw = vw;
  let sh = vh;

  if(videoRatio > screenRatio){

    sw =
      vh * screenRatio;

    sx =
      (vw-sw)/2;

  }else{

    sh =
      vw/screenRatio;

    sy =
      (vh-sh)/2;
  }


  pixelW =
    PIXEL_WIDTH;

  pixelH =
    Math.max(
      1,
      Math.round(
        PIXEL_WIDTH *
        H/W
      )
    );


  if(
    rawCanvas.width !== pixelW ||
    rawCanvas.height !== pixelH
  ){

    rawCanvas.width =
      pixelW;

    rawCanvas.height =
      pixelH;

    world.width =
      pixelW;

    world.height =
      pixelH;

    rawCtx.imageSmoothingEnabled =
      true;

    wctx.imageSmoothingEnabled =
      false;
  }


  rawCtx.drawImage(
    camera,

    sx,sy,sw,sh,

    0,0,pixelW,pixelH
  );

  wctx.drawImage(
    rawCanvas,
    0,0
  );
}


/* =========================================================
   ORIENTATION
========================================================= */

function orientationHandler(e){

  if(
    !Number.isFinite(e.alpha) ||
    !Number.isFinite(e.beta) ||
    !Number.isFinite(e.gamma)
  ){
    return;
  }


  const alpha = rad(e.alpha);
  const beta  = rad(e.beta);
  const gamma = rad(e.gamma);

  const ca = Math.cos(alpha);
  const sa = Math.sin(alpha);

  const cb = Math.cos(beta);
  const sb = Math.sin(beta);

  const cg = Math.cos(gamma);
  const sg = Math.sin(gamma);


  let x = 0;
  let y = 0;
  let z = -1;


  /* GAMMA */

  let x1 = cg*x + sg*z;
  let y1 = y;
  let z1 = -sg*x + cg*z;


  /* BETA */

  let x2 = x1;
  let y2 = cb*y1 - sb*z1;
  let z2 = sb*y1 + cb*z1;


  /* ALPHA */

  let wx =
    ca*x2 -
    sa*y2;

  let wy =
    sa*x2 +
    ca*y2;

  let wz =
    z2;


  let screenAngle = 0;


  if(
    screen.orientation &&
    typeof screen.orientation.angle === "number"
  ){

    screenAngle =
      screen.orientation.angle;

  }else if(
    typeof window.orientation === "number"
  ){

    screenAngle =
      window.orientation;
  }


  if(screenAngle !== 0){

    const r =
      rad(-screenAngle);

    const c =
      Math.cos(r);

    const s =
      Math.sin(r);

    const nx =
      c*wx -
      s*wy;

    const ny =
      s*wx +
      c*wy;

    wx = nx;
    wy = ny;
  }


  const horizontal =
    Math.sqrt(
      wx*wx +
      wy*wy
    );


  targetPitch =
    clamp(

      deg(
        Math.atan2(
          wz,
          horizontal
        )
      ),

      -90,
      90
    );


  let yaw =
    deg(
      Math.atan2(
        wx,
        -wy
      )
    );


  yaw =
    normalize360(yaw);


  if(
    typeof e.webkitCompassHeading === "number" &&
    Number.isFinite(e.webkitCompassHeading) &&
    horizontal > .15
  ){

    yaw =
      normalize360(
        e.webkitCompassHeading
      );
  }


  targetYaw = yaw;


  if(!sensorReady){

    cameraYaw =
      targetYaw;

    cameraPitch =
      targetPitch;

    sensorReady = true;

    sensorWait.style.display =
      "none";
  }
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

  if(!running){
    return;
  }


  let dt =
    (time-lastTime)/1000;

  lastTime = time;

  dt =
    Math.min(dt,.05);


  /* SENSOR SMOOTH */

  if(sensorReady){

    cameraYaw =
      smoothAngle(
        cameraYaw,
        targetYaw,
        YAW_SMOOTH
      );

    cameraPitch +=
      (
        targetPitch -
        cameraPitch
      )
      *
      PITCH_SMOOTH;
  }


  /* =====================================================
     LOCK
  ===================================================== */

  if(locked){

    const remaining =
      lockEnd-time;

    hp -=
      DAMAGE_PER_SECOND *
      dt;

    hp =
      Math.max(0,hp);

    updateHP();


    if(hp <= 0){

      hp = 0;

      updateHP();

      locked = false;
      running = false;

      lockText.textContent =
        "★ CAPTURED ★";

      lockText.style.display =
        "block";

      timer.style.display =
        "none";

      cooldownText.style.display =
        "none";

      renderGame(time);

      return;
    }


    if(remaining <= 0){

      locked = false;

      lockText.style.display =
        "none";

      timer.style.display =
        "none";

      lockCooldownUntil =
        time +
        LOCK_COOLDOWN;

      startEscape(
        "release",
        time
      );

    }else{

      timer.textContent =
        Math.max(
          0,
          remaining/1000
        ).toFixed(1);
    }
  }


  /* =====================================================
     MOVEMENT
  ===================================================== */

  else if(escaping){

    const move =
      escapeSpeed *
      dt;

    creatureYaw =
      normalize360(

        creatureYaw +

        escapeDirection *
        move
      );

    creaturePitch =
      creatureBasePitch;

    escapeTravel +=
      move;

    if(
      escapeTravel >=
      escapeDistance
    ){

      escaping = false;

      /*
        停止すると眠る
      */

      setAnimation(
        "sleep",
        time
      );
    }
  }


  /* =====================================================
     VISIBILITY
  ===================================================== */

  if(sensorReady){

    const dx =
      angleDiff(
        creatureYaw,
        cameraYaw
      );

    const dy =
      creaturePitch -
      cameraPitch;

    creatureVisible =
      Math.abs(dx) <
      HFOV/2
      &&
      Math.abs(dy) <
      VFOV/2;


    /*
      ★画面に入った瞬間
    */

    if(
      creatureVisible &&
      !wasCreatureVisible &&
      !locked
    ){

      /*
        まず気づく
        FRAME 9
      */

      setAnimation(
        "notice",
        time
      );
    }


    wasCreatureVisible =
      creatureVisible;
  }


  /* =====================================================
     ANIMATION
  ===================================================== */

  updateAnimation(time);


  /* =====================================================
     COOLDOWN
  ===================================================== */

  if(
    !locked &&
    time < lockCooldownUntil
  ){

    const r =
      (
        lockCooldownUntil -
        time
      )/1000;

    cooldownText.style.display =
      "block";

    cooldownText.textContent =
      "LOCK DISABLED " +
      r.toFixed(1);

  }else{

    cooldownText.style.display =
      "none";
  }


  renderGame(time);

  requestAnimationFrame(
    gameLoop
  );
}


/* =========================================================
   ANIMATION CONTROL
========================================================= */

function setAnimation(
  state,
  time
){

  animState =
    state;

  animStateStart =
    time;


  switch(state){

    case "sleep":
      animFrame = 8;
      break;

    case "notice":
      animFrame = 9;
      break;

    case "turn":
      animFrame = 5;
      break;

    case "move":
      animFrame = 1;
      break;

    case "damage":
      animFrame = 10;
      break;

    case "attack":
      animFrame = 12;
      break;

    case "special":
      animFrame = 14;
      break;
  }
}


/* =========================================================
   UPDATE ANIMATION
========================================================= */

function updateAnimation(time){

  /*
    ★ロック中は必ず
    DAMAGE 10-11
  */

  if(locked){

    animState =
      "damage";

    animFrame =
      10 +
      (
        Math.floor(
          time/150
        ) % 2
      );

    return;
  }


  const elapsed =
    time -
    animStateStart;


  /* =====================================================
     NOTICE
     FRAME 9
  ===================================================== */

  if(animState === "notice"){

    animFrame = 9;

    if(elapsed >= 260){

      setAnimation(
        "turn",
        time
      );
    }

    return;
  }


  /* =====================================================
     TURN
     FRAME 5-7
  ===================================================== */

  if(animState === "turn"){

    const i =
      Math.floor(
        elapsed/110
      );

    animFrame =
      5 +
      Math.min(i,2);


    if(elapsed >= 330){

      startEscape(
        "visible",
        time
      );
    }

    return;
  }


  /* =====================================================
     SPECIAL
     FRAME 14-15
  ===================================================== */

  if(animState === "special"){

    animFrame =
      14 +
      (
        Math.floor(
          elapsed/150
        ) % 2
      );


    if(elapsed >= 450){

      setAnimation(
        "move",
        time
      );

      nextSpecialTime =
        time +
        random(3500,7000);
    }

    return;
  }


  /* =====================================================
     ATTACK
     FRAME 12-13
  ===================================================== */

  if(animState === "attack"){

    animFrame =
      12 +
      (
        Math.floor(
          elapsed/130
        ) % 2
      );


    if(elapsed >= 390){

      setAnimation(
        "move",
        time
      );

      nextAttackTime =
        time +
        random(5000,9000);
    }

    return;
  }


  /* =====================================================
     MOVE
     FRAME 1-4
  ===================================================== */

  if(escaping){

    /*
      移動速度に応じて
      足も少し速くする
    */

    const frameDuration =
      clamp(
        170 -
        escapeSpeed*5,
        80,
        145
      );


    animState =
      "move";


    animFrame =
      1 +
      (
        Math.floor(
          time/frameDuration
        ) % 4
      );


    /*
      特殊エモート
    */

    if(
      time >= nextSpecialTime &&
      Math.random() < .035
    ){

      setAnimation(
        "special",
        time
      );

      return;
    }


    /*
      攻撃

      画面内のときだけ
    */

    if(
      creatureVisible &&
      time >= nextAttackTime &&
      Math.random() < .025
    ){

      setAnimation(
        "attack",
        time
      );

      return;
    }


    return;
  }


  /* =====================================================
     SLEEP
  ===================================================== */

  animState =
    "sleep";

  animFrame = 8;
}


/* =========================================================
   ESCAPE
========================================================= */

function startEscape(
  reason="normal",
  time=performance.now()
){

  escaping = true;

  escapeTravel = 0;


  /*
    一度決めた方向には
    逃走中反転しない
  */

  escapeDirection =
    Math.random() < .5
    ? -1
    : 1;


  let speed =
    random(
      ESCAPE_SPEED_MIN,
      ESCAPE_SPEED_MAX
    );


  if(reason === "visible"){

    speed *=
      VISIBLE_SPEED_BOOST;
  }


  else if(reason === "release"){

    speed *=
      RELEASE_SPEED_BOOST;
  }


  escapeSpeed =
    speed;


  escapeDistance =
    random(
      ESCAPE_DISTANCE_MIN,
      ESCAPE_DISTANCE_MAX
    );


  creatureBobAmplitude =
    random(5,20);

  creatureBobPhase =
    random(
      0,
      Math.PI*2
    );

  creatureBobSpeed =
    random(.7,1.3);


  setAnimation(
    "move",
    time
  );


  nextSpecialTime =
    time +
    random(2500,6000);

  nextAttackTime =
    time +
    random(4000,8000);
}


/* =========================================================
   PROJECTION
========================================================= */

function projectCreature(
  yaw,
  pitch
){

  const dx =
    angleDiff(
      yaw,
      cameraYaw
    );

  const dy =
    pitch -
    cameraPitch;


  const x =
    W/2 +
    (
      dx /
      (HFOV/2)
    )
    *
    (W/2);


  const y =
    H/2 -
    (
      dy /
      (VFOV/2)
    )
    *
    (H/2);


  return{

    x,
    y,
    dx,
    dy,

    visible:
      Math.abs(dx) <
      HFOV/2
      &&
      Math.abs(dy) <
      VFOV/2
  };
}


/* =========================================================
   RENDER
========================================================= */

function renderGame(time){

  ctx.clearRect(
    0,0,W,H
  );

  drawCreature(time);


  const cd =
    Math.max(
      0,
      (
        lockCooldownUntil -
        time
      )/1000
    );


  debug.innerHTML =
    "YAW " +
    cameraYaw.toFixed(1) +
    "°" +

    "<br>PITCH " +
    cameraPitch.toFixed(1) +
    "°" +

    "<br>TYPE " +
    creatureZone +

    "<br>FRAME " +
    animFrame +

    "<br>ANIM " +
    animState.toUpperCase() +

    "<br>SPEED " +
    escapeSpeed.toFixed(1) +

    "<br>LOCK CD " +
    cd.toFixed(1) +

    "<br>HP " +
    Math.ceil(hp);
}


/* =========================================================
   PIXEL CHARACTER

   ★外部画像なし
   ★fillRectだけで15モーション
========================================================= */

function drawCreature(time){

  if(!creatureVisible){
    return;
  }


  const p =
    projectCreature(
      creatureYaw,
      creaturePitch
    );


  if(!p.visible){
    return;
  }


  /*
    移動時だけ軽い上下運動。

    5〜20px以内。
  */

  let bob = 0;


  if(
    animState === "move" ||
    animState === "special" ||
    animState === "attack"
  ){

    bob =
      Math.sin(
        time *
        .001 *
        creatureBobSpeed +
        creatureBobPhase
      )
      *
      creatureBobAmplitude;
  }


  const x =
    Math.round(p.x);

  const y =
    Math.round(
      p.y + bob
    );


  /*
    1ピクセルブロックの
    実画面サイズ
  */

  const S =
    clamp(
      Math.round(
        Math.min(W,H)/72
      ),
      5,
      8
    );


  ctx.save();

  ctx.translate(
    x,
    y
  );


  /*
    逃げる方向に
    キャラを向ける。

    +1 = 右
    -1 = 左
  */

  if(escapeDirection < 0){

    ctx.scale(
      -1,
      1
    );
  }


  drawPixelFrame(
    animFrame,
    S,
    time
  );


  /*
    LOCK BOX
  */

  if(locked){

    ctx.strokeStyle =
      "#fff";

    ctx.lineWidth =
      3;

    const pulse =
      12*S +
      Math.sin(time*.015)*S;

    ctx.strokeRect(
      -pulse,
      -pulse,
      pulse*2,
      pulse*2
    );
  }


  ctx.restore();
}


/* =========================================================
   PIXEL DRAW HELPERS
========================================================= */

function px(
  x,
  y,
  w,
  h,
  color,
  S
){

  ctx.fillStyle =
    color;

  ctx.fillRect(
    Math.round(x*S),
    Math.round(y*S),
    Math.round(w*S),
    Math.round(h*S)
  );
}

    px(2,6,4,4,OUTLINE,S);
    px(3,6,3,3,BODY,S);

}

/* =========================================================
   MOTION / SHAKE
========================================================= */

function motionHandler(e){

  if(
    !running ||
    !creatureVisible ||
    locked
  ){
    return;
  }


  const now =
    performance.now();


  /*
    解除後3秒ロック不可
  */

  if(
    now <
    lockCooldownUntil
  ){
    return;
  }


  const a =
    e.accelerationIncludingGravity;

  if(!a){
    return;
  }


  const x =
    a.x || 0;

  const y =
    a.y || 0;

  const z =
    a.z || 0;


  const magnitude =
    Math.sqrt(
      x*x +
      y*y +
      z*z
    );


  const shake =
    Math.abs(
      magnitude -
      9.81
    );


  if(
    shake <
    SHAKE_THRESHOLD
  ){
    return;
  }


  if(
    now-lastShake <
    500
  ){
    return;
  }


  lastShake =
    now;


  lockCreature(
    shake
  );
}


/* =========================================================
   LOCK
========================================================= */

function lockCreature(power){

  const now =
    performance.now();


  if(!creatureVisible){
    return;
  }

  if(locked){
    return;
  }

  if(
    now <
    lockCooldownUntil
  ){
    return;
  }


  locked = true;

  escaping = false;


  /*
    1.5〜最大5秒
  */

  let seconds =
    MIN_LOCK +
    (
      power -
      SHAKE_THRESHOLD
    )
    *
    .35;


  seconds =
    clamp(
      seconds,
      MIN_LOCK,
      MAX_LOCK
    );


  /*
    ロック開始時点から計測
  */

  lockEnd =
    now +
    seconds*1000;


  setAnimation(
    "damage",
    now
  );


  lockText.textContent =
    "⚡ LOCK!";

  lockText.style.display =
    "block";

  timer.style.display =
    "block";

  timer.textContent =
    seconds.toFixed(1);

  cooldownText.style.display =
    "none";


  if(navigator.vibrate){

    navigator.vibrate([
      70,
      40,
      120
    ]);
  }
}


/* =========================================================
   HP
========================================================= */

function updateHP(){

  hpNumber.textContent =
    Math.ceil(hp);

  hpInner.style.width =
    (
      hp /
      MAX_HP *
      100
    )
    +
    "%";
}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera(){

  running = false;

  const stream =
    camera.srcObject;

  if(!stream){
    return;
  }

  stream
    .getTracks()
    .forEach(
      track=>track.stop()
    );

  camera.srcObject =
    null;
}


window.addEventListener(
  "pagehide",
  stopCamera
);

window.addEventListener(
  "beforeunload",
  stopCamera
);
