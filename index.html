<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PIXEL CAMERA HUNT 360</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:monospace;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  z-index:0;
  display:none;
}

#world{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  z-index:0;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  pointer-events:none;
  image-rendering:pixelated;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  pointer-events:none;
}

/* =========================
   HP
========================= */

#hp{
  position:absolute;
  top:calc(14px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  width:min(82vw,390px);
}

#hpText{
  color:#fff;
  font-size:13px;
  font-weight:900;
  text-shadow:2px 2px #000;
}

#hpOuter{
  height:17px;
  margin-top:5px;
  border:3px solid #fff;
  background:#111;
  box-shadow:3px 3px #000;
}

#hpInner{
  width:100%;
  height:100%;
  background:#fff;
}

/* =========================
   LOCK
========================= */

#lock{
  position:absolute;
  top:18%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
  padding:9px 15px;
  background:#111;
  border:3px solid #fff;
  box-shadow:4px 4px #000;
  color:#fff;
  font-size:22px;
  font-weight:900;
}

#timer{
  position:absolute;
  bottom:17%;
  left:50%;
  transform:translateX(-50%);
  display:none;
  padding:6px 12px;
  background:#111;
  border:3px solid #fff;
  box-shadow:4px 4px #000;
  color:#fff;
  font-size:30px;
  font-weight:900;
}

#cooldown{
  position:absolute;
  top:25%;
  left:50%;
  transform:translateX(-50%);
  display:none;
  padding:7px 12px;
  background:rgba(0,0,0,.72);
  border:2px solid #fff;
  color:#fff;
  font-size:13px;
  font-weight:900;
}

#sensorWait{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
  padding:10px 17px;
  background:#111;
  border:3px solid #fff;
  color:#fff;
  font-weight:900;
}

/* =========================
   MODE
========================= */

#modeSwitch{
  position:absolute;
  left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  display:flex;
  gap:5px;
  padding:5px;
  background:rgba(0,0,0,.68);
  border:2px solid #fff;
  pointer-events:auto;
}

#modeSwitch button{
  min-width:92px;
  padding:11px 16px;
  border:0;
  background:transparent;
  color:#fff;
  font-family:monospace;
  font-size:12px;
  font-weight:900;
}

#modeSwitch button.active{
  background:#fff;
  color:#111;
}

#debug{
  position:absolute;
  right:6px;
  bottom:6px;
  padding:5px 7px;
  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.7);
  color:#fff;
  font-size:8px;
  line-height:1.45;
}

/* =========================
   START
========================= */

#start{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:
    calc(25px + env(safe-area-inset-top))
    25px
    calc(25px + env(safe-area-inset-bottom));
  background:#161925;
  color:#fff;
  text-align:center;
}

#startIcon{
  font-size:64px;
}

#start h1{
  margin:8px 0 10px;
  font-size:25px;
}

#start p{
  max-width:430px;
  margin:5px 0;
  font-size:13px;
  line-height:1.7;
  opacity:.86;
}

#secureStatus{
  margin-top:12px;
  padding:6px 10px;
  border:1px solid rgba(255,255,255,.35);
  font-size:11px;
}

#startButton{
  min-width:250px;
  margin-top:18px;
  padding:17px 25px;
  border:3px solid #fff;
  background:#fff;
  color:#111;
  box-shadow:6px 6px #000;
  font-family:monospace;
  font-size:16px;
  font-weight:900;
}

#startButton:active{
  transform:translate(3px,3px);
  box-shadow:3px 3px #000;
}

#startButton:disabled{
  opacity:.55;
}

#error{
  max-width:430px;
  margin-top:16px;
  color:#ffaaaa;
  font-size:11px;
  line-height:1.55;
  white-space:pre-line;
}
</style>
</head>

<body>

<video
  id="camera"
  autoplay
  muted
  playsinline>
</video>

<canvas id="world"></canvas>
<canvas id="game"></canvas>

<div id="hud">

  <div id="hp">
    <div id="hpText">
      CREATURE HP
      <span id="hpNumber">100</span> / 100
    </div>

    <div id="hpOuter">
      <div id="hpInner"></div>
    </div>
  </div>

  <div id="lock">⚡ LOCK!</div>
  <div id="timer">5.0</div>
  <div id="cooldown">LOCK DISABLED 3.0</div>
  <div id="sensorWait">SENSOR...</div>

  <div id="modeSwitch">
    <button id="pixelMode" class="active">PIXEL</button>
    <button id="cameraMode">CAMERA</button>
  </div>

  <div id="debug"></div>
</div>

<div id="start">

  <div id="startIcon">👾</div>

  <h1>PIXEL CAMERA HUNT 360</h1>

  <p>
    STARTをタップしてください。
    <br><br>
    360°スマホを動かしてキャラクターを探します。
    <br><br>
    キャラクターを画面に捉えると、
    0.5秒後に気づいて高速で逃走します。
    <br><br>
    スマホを振ると最大5秒ロック。
    <br>
    ロック解除後はさらに高速で逃げ、
    3秒間は再ロックできません。
    <br><br>
    映像は保存しません。
  </p>

  <div id="secureStatus">CHECKING...</div>

  <button id="startButton">
    START
  </button>

  <div id="error"></div>
</div>

<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const camera =
  document.getElementById("camera");

const world =
  document.getElementById("world");

const wctx =
  world.getContext(
    "2d",
    {alpha:false}
  );

const game =
  document.getElementById("game");

const ctx =
  game.getContext("2d");

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("startButton");

const errorBox =
  document.getElementById("error");

const secureStatus =
  document.getElementById("secureStatus");

const hud =
  document.getElementById("hud");

const hpNumber =
  document.getElementById("hpNumber");

const hpInner =
  document.getElementById("hpInner");

const lockText =
  document.getElementById("lock");

const timer =
  document.getElementById("timer");

const cooldownText =
  document.getElementById("cooldown");

const sensorWait =
  document.getElementById("sensorWait");

const debug =
  document.getElementById("debug");

const pixelModeButton =
  document.getElementById("pixelMode");

const cameraModeButton =
  document.getElementById("cameraMode");


/* =========================================================
   HTTPS
========================================================= */

if(window.isSecureContext){

  secureStatus.textContent =
    "✓ SECURE";

}else{

  secureStatus.textContent =
    "⚠ HTTPS REQUIRED";

  secureStatus.style.color =
    "#ff9999";
}


/* =========================================================
   SCREEN
========================================================= */

let W = innerWidth;
let H = innerHeight;

let DPR = 1;


function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR =
    Math.min(
      devicePixelRatio || 1,
      2
    );

  game.width =
    Math.round(W*DPR);

  game.height =
    Math.round(H*DPR);

  game.style.width =
    W+"px";

  game.style.height =
    H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  ctx.imageSmoothingEnabled =
    false;
}


addEventListener(
  "resize",
  resize
);

addEventListener(
  "orientationchange",
  ()=>setTimeout(resize,250)
);

resize();


/* =========================================================
   PIXEL CAMERA
========================================================= */

const PIXEL_WIDTH = 70;

const rawCanvas =
  document.createElement("canvas");

const rawCtx =
  rawCanvas.getContext(
    "2d",
    {alpha:false}
  );

let pixelW = PIXEL_WIDTH;
let pixelH = 100;


/* =========================================================
   DISPLAY MODE
========================================================= */

let displayMode = "pixel";


function setDisplayMode(mode){

  displayMode = mode;

  if(mode === "pixel"){

    world.style.display =
      "block";

    camera.style.display =
      "none";

    pixelModeButton
      .classList
      .add("active");

    cameraModeButton
      .classList
      .remove("active");

  }else{

    world.style.display =
      "none";

    camera.style.display =
      "block";

    pixelModeButton
      .classList
      .remove("active");

    cameraModeButton
      .classList
      .add("active");
  }
}


pixelModeButton.addEventListener(
  "click",
  ()=>setDisplayMode("pixel")
);

cameraModeButton.addEventListener(
  "click",
  ()=>setDisplayMode("camera")
);


/* =========================================================
   SETTINGS
========================================================= */

const HFOV = 68;
const VFOV = 55;


/* HP */

const MAX_HP = 100;

const DAMAGE_PER_SECOND = 12;


/* SHAKE */

const SHAKE_THRESHOLD = 9;


/* LOCK */

const MIN_LOCK = 1.5;

const MAX_LOCK = 5;

const LOCK_COOLDOWN = 3000;


/* =========================================================
   DETECTION

   画面に入ってから0.5秒後に気づく
========================================================= */

const NOTICE_DELAY = 500;


/*
  9番モーション表示時間
*/

const NOTICE_DURATION = 230;


/* =========================================================
   SPEED

   単位：degree / second
========================================================= */

/*
  通常逃走
*/

const NORMAL_SPEED_MIN = 22;
const NORMAL_SPEED_MAX = 29;


/*
  ★発見後

  約27.5〜36.25°/秒
*/

const FOUND_SPEED_BOOST = 1.25;


/*
  ★ロック解除後

  約33〜43.5°/秒
*/

const RELEASE_SPEED_BOOST = 1.50;


/*
  一度の逃走距離
*/

const ESCAPE_DISTANCE_MIN = 75;

const ESCAPE_DISTANCE_MAX = 160;


/* =========================================================
   SENSOR
========================================================= */

const YAW_SMOOTH = .24;

const PITCH_SMOOTH = .20;


/* =========================================================
   ZONES
========================================================= */

const CREATURE_ZONES = {

  SKY:{
    minPitch:20,
    maxPitch:34
  },

  FRONT:{
    minPitch:-6,
    maxPitch:6
  },

  EARTH:{
    minPitch:-34,
    maxPitch:-20
  }

};


/* =========================================================
   SENSOR STATE
========================================================= */

let cameraYaw = 0;

let cameraPitch = 0;

let targetYaw = 0;

let targetPitch = 0;

let sensorReady = false;


/* =========================================================
   CREATURE
========================================================= */

let creatureZone = "FRONT";

let creatureYaw = 0;

let creaturePitch = 0;

let creatureBasePitch = 0;


/*
  移動中の上下揺れ
*/

let creatureBobAmplitude = 10;

let creatureBobPhase = 0;

let creatureBobSpeed = 1;


/*
  画面内判定
*/

let creatureVisible = false;

let wasCreatureVisible = false;


/*
  ★発見状態
*/

let detected = false;

let detectedAt = 0;


/*
  逃走
*/

let escaping = false;

let escapeDirection = 1;

let escapeSpeed = 0;

let escapeDistance = 0;

let escapeTravel = 0;


/* =========================================================
   ANIMATION

   1-4   移動
   5-7   振り返り
   8     眠り
   9     目覚め・気づき
   10-11 ダメージ
   12-13 攻撃
   14-15 特殊移動
========================================================= */

let animState = "sleep";

let animFrame = 8;

let animStateStart = 0;

let nextSpecialTime = 0;

let nextAttackTime = 0;


/* =========================================================
   GAME
========================================================= */

let running = false;

let hp = MAX_HP;

let locked = false;

let lockEnd = 0;

let lockCooldownUntil = 0;

let lastShake = 0;

let lastTime = 0;


/* =========================================================
   MATH
========================================================= */

function rad(v){

  return v*
    Math.PI/180;
}


function deg(v){

  return v*
    180/Math.PI;
}


function clamp(
  v,
  min,
  max
){

  return Math.max(
    min,
    Math.min(max,v)
  );
}


function random(
  min,
  max
){

  return (
    Math.random()*
    (max-min)+
    min
  );
}


function normalize360(a){

  a %= 360;

  if(a < 0){
    a += 360;
  }

  return a;
}


function angleDiff(
  target,
  current
){

  let d =
    normalize360(target) -
    normalize360(current);

  if(d > 180){
    d -= 360;
  }

  if(d < -180){
    d += 360;
  }

  return d;
}


function smoothAngle(
  current,
  target,
  amount
){

  return normalize360(

    current +

    angleDiff(
      target,
      current
    )*
    amount
  );
}


/* =========================================================
   SPAWN
========================================================= */

function spawnCreature(){

  const types = [
    "SKY",
    "FRONT",
    "EARTH"
  ];


  creatureZone =
    types[
      Math.floor(
        Math.random()*
        types.length
      )
    ];


  const zone =
    CREATURE_ZONES[
      creatureZone
    ];


  /*
    ★360°完全ランダム
  */

  creatureYaw =
    random(0,360);


  creatureBasePitch =
    random(
      zone.minPitch,
      zone.maxPitch
    );


  creaturePitch =
    creatureBasePitch;


  creatureBobAmplitude =
    random(5,20);

  creatureBobPhase =
    random(
      0,
      Math.PI*2
    );

  creatureBobSpeed =
    random(.8,1.3);


  creatureVisible = false;

  wasCreatureVisible = false;


  /*
    発見リセット
  */

  detected = false;

  detectedAt = 0;


  /*
    逃走リセット
  */

  escaping = false;

  escapeDirection =
    Math.random() < .5
      ? -1
      : 1;

  escapeSpeed = 0;

  escapeDistance = 0;

  escapeTravel = 0;


  /*
    最初は眠り
  */

  animState = "sleep";

  animFrame = 8;

  animStateStart =
    performance.now();


  nextSpecialTime =
    performance.now() +
    random(3000,6500);


  nextAttackTime =
    performance.now() +
    random(4500,8500);
}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
"click",
async function(){

  startButton.disabled =
    true;

  startButton.textContent =
    "STARTING...";

  errorBox.textContent =
    "";


  try{

    if(!window.isSecureContext){

      throw new Error(
        "HTTPSで開いてください。"
      );
    }


    /*
      iOS permission
    */

    let orientationPromise =
      null;

    let motionPromise =
      null;


    if(
      typeof DeviceOrientationEvent !==
      "undefined" &&

      typeof DeviceOrientationEvent
        .requestPermission ===
      "function"
    ){

      orientationPromise =
        DeviceOrientationEvent
          .requestPermission();
    }


    if(
      typeof DeviceMotionEvent !==
      "undefined" &&

      typeof DeviceMotionEvent
        .requestPermission ===
      "function"
    ){

      motionPromise =
        DeviceMotionEvent
          .requestPermission();
    }


    if(orientationPromise){

      const result =
        await orientationPromise;

      if(result !== "granted"){

        throw new Error(
          "方向センサーが許可されませんでした。"
        );
      }
    }


    if(motionPromise){

      const result =
        await motionPromise;

      if(result !== "granted"){

        throw new Error(
          "モーションセンサーが許可されませんでした。"
        );
      }
    }


    /*
      CAMERA
    */

    if(
      !navigator.mediaDevices ||
      typeof navigator.mediaDevices
        .getUserMedia !==
      "function"
    ){

      throw new Error(
        "カメラを使用できません。"
      );
    }


    let stream;


    try{

      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:{

              facingMode:{
                ideal:"environment"
              },

              width:{
                ideal:1920
              },

              height:{
                ideal:1080
              }
            },

            audio:false
          });

    }catch(firstError){

      console.warn(
        firstError
      );


      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:true,

            audio:false
          });
    }


    camera.srcObject =
      stream;

    camera.muted =
      true;

    camera.playsInline =
      true;

    await camera.play();


    /*
      SENSOR
    */

    window.addEventListener(
      "deviceorientation",
      orientationHandler,
      true
    );


    window.addEventListener(
      "devicemotion",
      motionHandler,
      {passive:true}
    );


    /*
      GAME RESET
    */

    hp =
      MAX_HP;

    locked =
      false;

    lockEnd =
      0;

    lockCooldownUntil =
      0;

    sensorReady =
      false;


    spawnCreature();

    updateHP();

    setDisplayMode(
      "pixel"
    );


    start.style.display =
      "none";

    hud.style.display =
      "block";

    sensorWait.style.display =
      "block";


    running =
      true;


    lastTime =
      performance.now();


    requestAnimationFrame(
      cameraLoop
    );

    requestAnimationFrame(
      gameLoop
    );


  }catch(e){

    console.error(e);

    startButton.disabled =
      false;

    startButton.textContent =
      "START";


    let message =
      (e.name || "ERROR") +
      "\n" +
      (e.message || String(e));


    if(
      String(e.message)
        .toLowerCase()
        .includes(
          "user gesture"
        )
    ){

      message +=
        "\n\nSTARTをもう一度タップしてください。";
    }


    if(
      e.name ===
      "NotAllowedError"
    ){

      message +=
        "\n\nカメラまたはセンサーの許可を確認してください。";
    }


    errorBox.textContent =
      message;
  }
});


/* =========================================================
   CAMERA LOOP
========================================================= */

function cameraLoop(){

  if(!running){
    return;
  }


  if(
    displayMode === "pixel" &&
    camera.readyState >= 2 &&
    camera.videoWidth > 0
  ){

    drawPixelCamera();
  }


  requestAnimationFrame(
    cameraLoop
  );
}


/* =========================================================
   PIXEL CAMERA
========================================================= */

function drawPixelCamera(){

  const vw =
    camera.videoWidth;

  const vh =
    camera.videoHeight;


  if(!vw || !vh){
    return;
  }


  const screenRatio =
    W/H;

  const videoRatio =
    vw/vh;


  let sx = 0;

  let sy = 0;

  let sw = vw;

  let sh = vh;


  /*
    object-fit cover相当
  */

  if(videoRatio > screenRatio){

    sw =
      vh*
      screenRatio;

    sx =
      (vw-sw)/2;

  }else{

    sh =
      vw/
      screenRatio;

    sy =
      (vh-sh)/2;
  }


  pixelW =
    PIXEL_WIDTH;


  pixelH =
    Math.max(
      1,
      Math.round(
        PIXEL_WIDTH*
        H/W
      )
    );


  if(
    rawCanvas.width !== pixelW ||
    rawCanvas.height !== pixelH
  ){

    rawCanvas.width =
      pixelW;

    rawCanvas.height =
      pixelH;

    world.width =
      pixelW;

    world.height =
      pixelH;


    rawCtx.imageSmoothingEnabled =
      true;

    wctx.imageSmoothingEnabled =
      false;
  }


  rawCtx.drawImage(
    camera,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    pixelW,
    pixelH
  );


  wctx.drawImage(
    rawCanvas,
    0,
    0
  );
}


/* =========================================================
   ORIENTATION
========================================================= */

function orientationHandler(e){

  if(
    !Number.isFinite(e.alpha) ||
    !Number.isFinite(e.beta) ||
    !Number.isFinite(e.gamma)
  ){

    return;
  }


  const alpha =
    rad(e.alpha);

  const beta =
    rad(e.beta);

  const gamma =
    rad(e.gamma);


  const ca =
    Math.cos(alpha);

  const sa =
    Math.sin(alpha);

  const cb =
    Math.cos(beta);

  const sb =
    Math.sin(beta);

  const cg =
    Math.cos(gamma);

  const sg =
    Math.sin(gamma);


  /*
    スマホ背面カメラの
    前方ベクトル
  */

  let x = 0;
  let y = 0;
  let z = -1;


  /*
    gamma
  */

  let x1 =
    cg*x +
    sg*z;

  let y1 =
    y;

  let z1 =
    -sg*x +
    cg*z;


  /*
    beta
  */

  let x2 =
    x1;

  let y2 =
    cb*y1 -
    sb*z1;

  let z2 =
    sb*y1 +
    cb*z1;


  /*
    alpha
  */

  let wx =
    ca*x2 -
    sa*y2;

  let wy =
    sa*x2 +
    ca*y2;

  let wz =
    z2;


  /*
    SCREEN ROTATION
  */

  let screenAngle =
    0;


  if(
    screen.orientation &&
    typeof screen.orientation.angle ===
    "number"
  ){

    screenAngle =
      screen.orientation.angle;

  }else if(
    typeof window.orientation ===
    "number"
  ){

    screenAngle =
      window.orientation;
  }


  if(screenAngle !== 0){

    const r =
      rad(
        -screenAngle
      );

    const c =
      Math.cos(r);

    const s =
      Math.sin(r);


    const nx =
      c*wx -
      s*wy;

    const ny =
      s*wx +
      c*wy;


    wx =
      nx;

    wy =
      ny;
  }


  const horizontal =
    Math.sqrt(
      wx*wx +
      wy*wy
    );


  /*
    上を向けば +
    下を向けば -
  */

  targetPitch =
    clamp(

      deg(
        Math.atan2(
          wz,
          horizontal
        )
      ),

      -90,
      90
    );


  /*
    LEFT / RIGHT
  */

  let yaw =
    deg(
      Math.atan2(
        wx,
        -wy
      )
    );


  yaw =
    normalize360(yaw);


  /*
    iOS compass
  */

  if(
    typeof e.webkitCompassHeading ===
    "number" &&

    Number.isFinite(
      e.webkitCompassHeading
    ) &&

    horizontal > .15
  ){

    yaw =
      normalize360(
        e.webkitCompassHeading
      );
  }


  targetYaw =
    yaw;


  /*
    最初のセンサー値を
    そのまま基準にする
  */

  if(!sensorReady){

    cameraYaw =
      targetYaw;

    cameraPitch =
      targetPitch;

    sensorReady =
      true;

    sensorWait.style.display =
      "none";
  }
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

  if(!running){
    return;
  }


  let dt =
    (time-lastTime)/
    1000;


  lastTime =
    time;


  dt =
    Math.min(
      dt,
      .05
    );


  /* =========================
     SENSOR SMOOTH
  ========================= */

  if(sensorReady){

    cameraYaw =
      smoothAngle(
        cameraYaw,
        targetYaw,
        YAW_SMOOTH
      );


    cameraPitch +=
      (
        targetPitch -
        cameraPitch
      )*
      PITCH_SMOOTH;
  }


  /* =========================
     LOCK
  ========================= */

  if(locked){

    const remaining =
      lockEnd-time;


    hp -=
      DAMAGE_PER_SECOND*
      dt;


    hp =
      Math.max(
        0,
        hp
      );


    updateHP();


    /*
      CAPTURE
    */

    if(hp <= 0){

      hp = 0;

      updateHP();

      locked = false;

      running = false;


      lockText.textContent =
        "★ CAPTURED ★";

      lockText.style.display =
        "block";

      timer.style.display =
        "none";

      cooldownText.style.display =
        "none";


      renderGame(time);

      return;
    }


    /*
      ★LOCK RELEASE
    */

    if(remaining <= 0){

      locked =
        false;


      lockText.style.display =
        "none";

      timer.style.display =
        "none";


      /*
        解除後3秒
        再ロック禁止
      */

      lockCooldownUntil =
        time +
        LOCK_COOLDOWN;


      /*
        発見待ち状態を
        完全に解除
      */

      detected =
        false;

      detectedAt =
        0;


      /*
        ★即高速逃走

        待ち時間なし
        気づきなし
      */

      startEscape(
        "release",
        time
      );


    }else{

      timer.textContent =
        Math.max(
          0,
          remaining/1000
        ).toFixed(1);
    }
  }


  /* =========================
     MOVEMENT
  ========================= */

  else if(escaping){

    const move =
      escapeSpeed*
      dt;


    /*
      ★左右どちらか
      一方向へ逃げる

      逃走中は逆走しない
    */

    creatureYaw =
      normalize360(

        creatureYaw +

        escapeDirection*
        move
      );


    /*
      SKY / FRONT / EARTHの
      高さを維持
    */

    creaturePitch =
      creatureBasePitch;


    escapeTravel +=
      Math.abs(move);


    /*
      最大160°
    */

    if(
      escapeTravel >=
      escapeDistance
    ){

      escaping =
        false;


      setAnimation(
        "sleep",
        time
      );
    }
  }


  /* =====================================================
     VISIBILITY
  ===================================================== */

  if(sensorReady){

    const dx =
      angleDiff(
        creatureYaw,
        cameraYaw
      );


    const dy =
      creaturePitch -
      cameraPitch;


    creatureVisible =
      Math.abs(dx) <
      HFOV/2
      &&
      Math.abs(dy) <
      VFOV/2;


    /* ===================================================
       ★初めて画面に捉えた

       この瞬間は逃げない。
       0.5秒タイマー開始。
    =================================================== */

    if(
      creatureVisible &&
      !wasCreatureVisible &&
      !locked &&
      !escaping &&
      !detected
    ){

      detected =
        true;


      detectedAt =
        time;
    }


    /* ===================================================
       ★発見から0.5秒経過

       9：気づき
       ＋
       同時に高速逃走開始
    =================================================== */

    if(
      detected &&
      !locked &&
      !escaping &&
      time-detectedAt >=
      NOTICE_DELAY
    ){

      /*
        まず9番にする
      */

      setAnimation(
        "notice",
        time
      );


      /*
        ★高速逃走開始

        keepAnimation=trueなので
        9番を消さない
      */

      startEscape(
        "found",
        time,
        true
      );


      detected =
        false;

      detectedAt =
        0;
    }


    wasCreatureVisible =
      creatureVisible;
  }


  /* =========================
     ANIMATION
  ========================= */

  updateAnimation(
    time
  );


  /* =========================
     LOCK COOLDOWN
  ========================= */

  if(
    !locked &&
    time <
    lockCooldownUntil
  ){

    const r =
      (
        lockCooldownUntil -
        time
      )/
      1000;


    cooldownText.style.display =
      "block";


    cooldownText.textContent =
      "LOCK DISABLED " +
      r.toFixed(1);

  }else{

    cooldownText.style.display =
      "none";
  }


  renderGame(
    time
  );


  requestAnimationFrame(
    gameLoop
  );
}


/* =========================================================
   ANIMATION SET
========================================================= */

function setAnimation(
  state,
  time
){

  animState =
    state;

  animStateStart =
    time;


  switch(state){

    case "sleep":

      animFrame = 8;
      break;


    case "notice":

      animFrame = 9;
      break;


    case "turn":

      animFrame = 5;
      break;


    case "move":

      animFrame = 1;
      break;


    case "damage":

      animFrame = 10;
      break;


    case "attack":

      animFrame = 12;
      break;


    case "special":

      animFrame = 14;
      break;
  }
}


/* =========================================================
   UPDATE ANIMATION
========================================================= */

function updateAnimation(time){

  /*
    ★LOCK中
    10 ↔ 11
  */

  if(locked){

    animState =
      "damage";


    animFrame =
      10 +
      (
        Math.floor(
          time/140
        ) % 2
      );


    return;
  }


  const elapsed =
    time -
    animStateStart;


  /* =====================================================
     9 NOTICE

     ★発見0.5秒後
     ★ここから既に高速移動中
  ===================================================== */

  if(
    animState ===
    "notice"
  ){

    animFrame =
      9;


    if(
      elapsed >=
      NOTICE_DURATION
    ){

      setAnimation(
        "move",
        time
      );
    }


    return;
  }


  /* =====================================================
     5-7 TURN

     将来別イベントで使用可能
  ===================================================== */

  if(
    animState ===
    "turn"
  ){

    const i =
      Math.floor(
        elapsed/100
      );


    animFrame =
      5 +
      Math.min(
        i,
        2
      );


    if(
      elapsed >=
      300
    ){

      setAnimation(
        "move",
        time
      );
    }


    return;
  }


  /* =====================================================
     14-15 SPECIAL
  ===================================================== */

  if(
    animState ===
    "special"
  ){

    animFrame =
      14 +
      (
        Math.floor(
          elapsed/140
        ) % 2
      );


    if(
      elapsed >=
      420
    ){

      setAnimation(
        "move",
        time
      );


      nextSpecialTime =
        time +
        random(
          3000,
          6500
        );
    }


    return;
  }


  /* =====================================================
     12-13 ATTACK
  ===================================================== */

  if(
    animState ===
    "attack"
  ){

    animFrame =
      12 +
      (
        Math.floor(
          elapsed/130
        ) % 2
      );


    if(
      elapsed >=
      390
    ){

      setAnimation(
        "move",
        time
      );


      nextAttackTime =
        time +
        random(
          4500,
          8500
        );
    }


    return;
  }


  /* =====================================================
     1-4 MOVE
  ===================================================== */

  if(escaping){

    /*
      速いほど
      足のアニメも高速化
    */

    const frameDuration =
      clamp(

        165 -
        escapeSpeed*2.5,

        65,

        115
      );


    animState =
      "move";


    animFrame =
      1 +
      (
        Math.floor(
          time/
          frameDuration
        ) % 4
      );


    /*
      特殊エモート
    */

    if(
      time >=
      nextSpecialTime &&
      Math.random() < .035
    ){

      setAnimation(
        "special",
        time
      );


      return;
    }


    /*
      攻撃
    */

    if(
      creatureVisible &&
      time >=
      nextAttackTime &&
      Math.random() < .025
    ){

      setAnimation(
        "attack",
        time
      );


      return;
    }


    return;
  }


  /*
    動いていない
    ↓
    眠り
  */

  animState =
    "sleep";

  animFrame =
    8;
}


/* =========================================================
   ESCAPE
========================================================= */

function startEscape(
  reason="normal",
  time=performance.now(),
  keepAnimation=false
){

  escaping =
    true;


  escapeTravel =
    0;


  /*
    ★左右ランダム

    一度決定したら
    この逃走中は反転しない
  */

  escapeDirection =
    Math.random() < .5
      ? -1
      : 1;


  /*
    基本速度
  */

  let speed =
    random(
      NORMAL_SPEED_MIN,
      NORMAL_SPEED_MAX
    );


  /*
    ★発見後
  */

  if(
    reason ===
    "found"
  ){

    speed *=
      FOUND_SPEED_BOOST;
  }


  /*
    ★ロック解除後

    発見後よりさらに速い
  */

  else if(
    reason ===
    "release"
  ){

    speed *=
      RELEASE_SPEED_BOOST;
  }


  escapeSpeed =
    speed;


  /*
    一度の逃走距離

    75〜160°
  */

  escapeDistance =
    random(
      ESCAPE_DISTANCE_MIN,
      ESCAPE_DISTANCE_MAX
    );


  /*
    上下移動は
    5〜20px
  */

  creatureBobAmplitude =
    random(
      5,
      20
    );


  creatureBobPhase =
    random(
      0,
      Math.PI*2
    );


  creatureBobSpeed =
    random(
      .8,
      1.4
    );


  /*
    発見時は
    FRAME 9を残す
  */

  if(!keepAnimation){

    setAnimation(
      "move",
      time
    );
  }


  nextSpecialTime =
    time +
    random(
      2500,
      5500
    );


  nextAttackTime =
    time +
    random(
      4000,
      7500
    );
}


/* =========================================================
   360 PROJECTION
========================================================= */

function projectCreature(
  yaw,
  pitch
){

  const dx =
    angleDiff(
      yaw,
      cameraYaw
    );


  const dy =
    pitch -
    cameraPitch;


  /*
    右方向の世界座標
    ↓
    画面右
  */

  const x =
    W/2 +
    (
      dx/
      (HFOV/2)
    )*
    (W/2);


  /*
    上方向
    ↓
    画面上
  */

  const y =
    H/2 -
    (
      dy/
      (VFOV/2)
    )*
    (H/2);


  return{

    x,
    y,

    dx,
    dy,

    visible:
      Math.abs(dx) <
      HFOV/2
      &&
      Math.abs(dy) <
      VFOV/2
  };
}


/* =========================================================
   RENDER
========================================================= */

function renderGame(time){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  drawCreature(
    time
  );


  const cd =
    Math.max(
      0,
      (
        lockCooldownUntil -
        time
      )/
      1000
    );


  let detectionRemaining =
    0;


  if(detected){

    detectionRemaining =
      Math.max(
        0,
        (
          NOTICE_DELAY -
          (
            time -
            detectedAt
          )
        )/
        1000
      );
  }


  debug.innerHTML =

    "YAW " +
    cameraYaw.toFixed(1) +
    "°" +

    "<br>PITCH " +
    cameraPitch.toFixed(1) +
    "°" +

    "<br>TYPE " +
    creatureZone +

    "<br>FRAME " +
    animFrame +

    "<br>ANIM " +
    animState.toUpperCase() +

    "<br>VISIBLE " +
    creatureVisible +

    "<br>DETECTED " +
    detected +

    "<br>NOTICE " +
    detectionRemaining.toFixed(2) +

    "<br>ESCAPE " +
    escaping +

    "<br>SPEED " +
    escapeSpeed.toFixed(1) +
    "°/s" +

    "<br>DIR " +
    (
      escapeDirection > 0
        ? "+"
        : "-"
    ) +

    "<br>LOCK CD " +
    cd.toFixed(1) +

    "<br>HP " +
    Math.ceil(hp);
}


/* =========================================================
   DRAW CREATURE
========================================================= */

function drawCreature(time){

  if(
    !creatureVisible
  ){
    return;
  }


  const p =
    projectCreature(
      creatureYaw,
      creaturePitch
    );


  if(!p.visible){
    return;
  }


  /*
    上下移動

    5〜20px
  */

  let bob =
    0;


  if(
    escaping &&
    !locked
  ){

    bob =
      Math.sin(

        time*
        .001*
        creatureBobSpeed +

        creatureBobPhase

      )*
      creatureBobAmplitude;
  }


  const x =
    Math.round(
      p.x
    );


  const y =
    Math.round(
      p.y +
      bob
    );


  /*
    キャラサイズ
  */

  const S =
    clamp(

      Math.round(
        Math.min(W,H)/
        72
      ),

      5,

      8
    );


  ctx.save();


  ctx.translate(
    x,
    y
  );


  /*
    逃走方向へ向ける
  */

  if(
    escapeDirection <
    0
  ){

    ctx.scale(
      -1,
      1
    );
  }


  drawPixelFrame(
    animFrame,
    S,
    time
  );


  /*
    LOCK BOX
  */

  if(locked){

    ctx.strokeStyle =
      "#fff";

    ctx.lineWidth =
      3;


    const pulse =
      12*S +
      Math.sin(
        time*.015
      )*
      S;


    ctx.strokeRect(
      -pulse,
      -pulse,
      pulse*2,
      pulse*2
    );
  }


  ctx.restore();
}


/* =========================================================
   PIXEL HELPER
========================================================= */

function px(
  x,
  y,
  w,
  h,
  color,
  S
){

  ctx.fillStyle =
    color;


  ctx.fillRect(

    Math.round(
      x*S
    ),

    Math.round(
      y*S
    ),

    Math.round(
      w*S
    ),

    Math.round(
      h*S
    )
  );
}

    px(2,6,3,3,OUTLINE,S);

    px(-11,-4,3,2,YELLOW,S);

  /* =====================================================

  ===================================================== */

    */

  /* =====================================================

  /* =====================================================
     14 SPECIAL

  else if(frame === 14){

    ctx.translate(

/* =========================================================
   X EYE
========================================================= */

function drawXEye(
  x,
  y,
  S,
  color
){

  px(
    x-1,y-1,
    1,1,
    color,S
  );

  px(
    x+1,y-1,
    1,1,
    color,S
  );

  px(
    x,y,
    1,1,
    color,S
  );

  px(
    x-1,y+1,
    1,1,
    color,S
  );

  px(
    x+1,y+1,
    1,1,
    color,S
  );
}


/* =========================================================
   MOTION / SHAKE
========================================================= */

function motionHandler(e){

  if(
    !running ||
    !creatureVisible ||
    locked
  ){

    return;
  }


  const now =
    performance.now();


  /*
    ★ロック解除後3秒
  */

  if(
    now <
    lockCooldownUntil
  ){

    return;
  }


  const a =
    e.accelerationIncludingGravity;


  if(!a){
    return;
  }


  const x =
    a.x || 0;

  const y =
    a.y || 0;

  const z =
    a.z || 0;


  const magnitude =
    Math.sqrt(
      x*x +
      y*y +
      z*z
    );


  const shake =
    Math.abs(
      magnitude -
      9.81
    );


  if(
    shake <
    SHAKE_THRESHOLD
  ){

    return;
  }


  if(
    now-lastShake <
    500
  ){

    return;
  }


  lastShake =
    now;


  lockCreature(
    shake
  );
}


/* =========================================================
   LOCK
========================================================= */

function lockCreature(power){

  const now =
    performance.now();


  if(
    !creatureVisible
  ){

    return;
  }


  if(locked){

    return;
  }


  if(
    now <
    lockCooldownUntil
  ){

    return;
  }


  /*
    ★LOCK
  */

  locked =
    true;


  /*
    ★その場に停止
  */

  escaping =
    false;


  /*
    発見タイマーも停止
  */

  detected =
    false;

  detectedAt =
    0;


  /*
    振りの強さで
    1.5〜5秒
  */

  let seconds =

    MIN_LOCK +

    (
      power -
      SHAKE_THRESHOLD
    )*
    .35;


  seconds =
    clamp(
      seconds,
      MIN_LOCK,
      MAX_LOCK
    );


  /*
    ★ロック開始時から
    カウント
  */

  lockEnd =
    now +
    seconds*1000;


  setAnimation(
    "damage",
    now
  );


  lockText.textContent =
    "⚡ LOCK!";


  lockText.style.display =
    "block";


  timer.style.display =
    "block";


  timer.textContent =
    seconds.toFixed(1);


  cooldownText.style.display =
    "none";


  if(
    navigator.vibrate
  ){

    navigator.vibrate([
      70,
      40,
      120
    ]);
  }
}


/* =========================================================
   HP
========================================================= */

function updateHP(){

  hpNumber.textContent =
    Math.ceil(
      hp
    );


  hpInner.style.width =
    (
      hp/
      MAX_HP*
      100
    )+
    "%";
}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera(){

  running =
    false;


  const stream =
    camera.srcObject;


  if(!stream){
    return;
  }


  stream
    .getTracks()
    .forEach(
      track=>
        track.stop()
    );


  camera.srcObject =
    null;
}


window.addEventListener(
  "pagehide",
  stopCamera
);


window.addEventListener(
  "beforeunload",
  stopCamera
);
