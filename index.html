<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>PIXEL HUNT 360</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:monospace;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

#hud{
  position:fixed;
  inset:0;
  display:none;
  pointer-events:none;
}

#hp{
  position:absolute;
  top:calc(14px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  width:min(82vw,380px);
}

#hpText{
  color:#fff;
  font-size:13px;
  font-weight:bold;
  text-shadow:2px 2px #000;
}

#hpOuter{
  margin-top:5px;
  height:16px;
  border:3px solid #fff;
  background:#111;
}

#hpInner{
  width:100%;
  height:100%;
  background:#fff;
}

#lock{
  position:absolute;
  top:20%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
  color:#fff;
  font-size:25px;
  font-weight:bold;
  text-shadow:3px 3px #000;
}

#timer{
  position:absolute;
  left:50%;
  bottom:15%;
  transform:translateX(-50%);
  display:none;
  color:#fff;
  font-size:30px;
  font-weight:bold;
  text-shadow:3px 3px #000;
}

#debug{
  position:absolute;
  right:6px;
  bottom:6px;
  padding:6px 8px;
  background:#0009;
  color:#fff;
  font-size:9px;
  line-height:1.45;
}

#start{
  position:fixed;
  inset:0;
  z-index:100;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:28px;

  background:#101820;
  color:#fff;
  text-align:center;
}

#startIcon{
  font-size:64px;
}

#start h1{
  margin:8px;
  font-size:27px;
}

#start p{
  max-width:430px;
  font-size:13px;
  line-height:1.8;
  opacity:.82;
}

#startButton{
  min-width:250px;
  margin-top:18px;
  padding:17px;

  border:4px solid #fff;
  background:#111;
  color:#fff;

  font:bold 16px monospace;
  box-shadow:5px 5px #000;
}

#startButton:active{
  transform:translate(3px,3px);
  box-shadow:2px 2px #000;
}

#error{
  margin-top:16px;
  color:#ff9999;
  white-space:pre-line;
  font-size:12px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>


<div id="hud">

  <div id="hp">

    <div id="hpText">
      CREATURE HP
      <span id="hpNumber">100</span>/100
    </div>

    <div id="hpOuter">
      <div id="hpInner"></div>
    </div>

  </div>

  <div id="lock">⚡ LOCK!</div>
  <div id="timer">6.0</div>

  <div id="debug"></div>

</div>


<div id="start">

  <div id="startIcon">👾</div>

  <h1>PIXEL HUNT 360°</h1>

  <p>
    スマホを動かして360°の世界を探してください。
    <br><br>

    キャラクターは
    SKY / FRONT / EARTH
    のどれかにランダム出現。
    <br><br>

    発見すると左右どちらかへ逃走。
    <br>
    画面内でスマホを振るとロックできます。
  </p>

  <button id="startButton">
    ENTER WORLD
  </button>

  <div id="error"></div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext(
    "2d",
    {alpha:false}
  );

ctx.imageSmoothingEnabled=false;

const W=360;
const H=200;

canvas.width=W;
canvas.height=H;


/* =========================================================
   DOM
========================================================= */

const start =
  document.getElementById("start");

const startButton =
  document.getElementById("startButton");

const error =
  document.getElementById("error");

const hud =
  document.getElementById("hud");

const hpNumber =
  document.getElementById("hpNumber");

const hpInner =
  document.getElementById("hpInner");

const lockText =
  document.getElementById("lock");

const timer =
  document.getElementById("timer");

const debug =
  document.getElementById("debug");


/* =========================================================
   SETTINGS
========================================================= */

const HFOV=72;
const VFOV=58;

const MAX_HP=100;

const DAMAGE_PER_SECOND=12;

const SHAKE_THRESHOLD=10;

const MIN_LOCK=1.5;
const MAX_LOCK=6;

const ESCAPE_SPEED_MIN=7;
const ESCAPE_SPEED_MAX=11;

const ESCAPE_DISTANCE_MIN=55;
const ESCAPE_DISTANCE_MAX=160;

const YAW_SMOOTH=.22;
const PITCH_SMOOTH=.18;


/* =========================================================
   CREATURE ATTRIBUTES
========================================================= */

const CREATURE_ZONES={

  SKY:{
    minPitch:20,
    maxPitch:35
  },

  FRONT:{
    minPitch:-6,
    maxPitch:6
  },

  EARTH:{
    minPitch:-35,
    maxPitch:-20
  }

};


/* =========================================================
   CAMERA

   pitch:
     + = UP
      0 = LEVEL
     - = DOWN
========================================================= */

let cameraYaw=0;
let cameraPitch=0;

let targetYaw=0;
let targetPitch=0;

let sensorReady=false;


/* =========================================================
   CREATURE
========================================================= */

let creatureZone="FRONT";

let creatureYaw=0;
let creaturePitch=0;

let creatureBasePitch=0;


/*
 画面上だけで上下する。

 実際の球面座標は動かさない。
*/
let creatureBobAmplitude=10;
let creatureBobPhase=0;
let creatureBobSpeed=1;


let creatureVisible=false;

let discovered=false;

let escaping=false;


/*
 -1 / +1 のどちらか。

 一度逃走を始めたら途中では反転しない。
*/
let escapeDirection=1;

let escapeSpeed=0;
let escapeDistance=0;
let escapeTravel=0;


/* =========================================================
   GAME
========================================================= */

let running=false;

let hp=MAX_HP;

let locked=false;
let lockEnd=0;

let lastShake=0;
let lastTime=0;


/* =========================================================
   MATH
========================================================= */

function rad(v){
  return v*Math.PI/180;
}

function deg(v){
  return v*180/Math.PI;
}

function clamp(v,min,max){

  return Math.max(
    min,
    Math.min(
      max,
      v
    )
  );

}

function random(min,max){

  return (
    Math.random()*
    (max-min)
    +
    min
  );

}

function normalize360(a){

  a%=360;

  if(a<0){
    a+=360;
  }

  return a;

}


/*
 target-current

 -180 ～ +180
*/

function angleDiff(
  target,
  current
){

  let d=
    normalize360(target)
    -
    normalize360(current);


  if(d>180){
    d-=360;
  }

  if(d<-180){
    d+=360;
  }


  return d;

}


function smoothAngle(
  current,
  target,
  amount
){

  return normalize360(

    current

    +

    angleDiff(
      target,
      current
    )

    *

    amount

  );

}


/* =========================================================
   SPAWN
========================================================= */

function spawnCreature(){

  /*
   ★属性は毎ゲームランダム。
  */

  const zones=[
    "SKY",
    "FRONT",
    "EARTH"
  ];


  creatureZone=
    zones[
      Math.floor(
        Math.random()*
        zones.length
      )
    ];


  const zone=
    CREATURE_ZONES[
      creatureZone
    ];


  /*
   左右360°ランダム。
  */

  creatureYaw=
    random(
      0,
      360
    );


  /*
   属性に対応した上下位置。
  */

  creatureBasePitch=
    random(
      zone.minPitch,
      zone.maxPitch
    );


  creaturePitch=
    creatureBasePitch;


  /*
   上下揺れは5～20px。
  */

  creatureBobAmplitude=
    random(
      5,
      20
    );


  creatureBobPhase=
    random(
      0,
      Math.PI*2
    );


  creatureBobSpeed=
    random(
      .7,
      1.35
    );


  creatureVisible=false;

  discovered=false;

  escaping=false;

}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
"click",
async()=>{

  try{

    error.textContent="";


    /* =====================================================
       iOS SENSOR PERMISSION
    ===================================================== */

    if(
      typeof DeviceOrientationEvent!=="undefined"
      &&
      typeof DeviceOrientationEvent.requestPermission==="function"
    ){

      const result=
        await DeviceOrientationEvent.requestPermission();


      if(result!=="granted"){

        throw new Error(
          "方向センサーを許可してください。"
        );

      }

    }


    if(
      typeof DeviceMotionEvent!=="undefined"
      &&
      typeof DeviceMotionEvent.requestPermission==="function"
    ){

      const result=
        await DeviceMotionEvent.requestPermission();


      if(result!=="granted"){

        throw new Error(
          "モーションセンサーを許可してください。"
        );

      }

    }


    /* =====================================================
       EVENTS
    ===================================================== */

    window.addEventListener(
      "deviceorientation",
      orientationHandler,
      true
    );


    window.addEventListener(
      "devicemotion",
      motionHandler,
      {passive:true}
    );


    /* =====================================================
       RESET
    ===================================================== */

    hp=MAX_HP;

    locked=false;

    sensorReady=false;


    spawnCreature();

    updateHP();


    start.style.display=
      "none";


    hud.style.display=
      "block";


    running=true;

    lastTime=
      performance.now();


    requestAnimationFrame(
      loop
    );

  }

  catch(e){

    console.error(e);


    error.textContent=
      (e.name||"ERROR")
      +
      "\n"
      +
      (e.message||String(e));

  }

});


/* =========================================================
   ORIENTATION
========================================================= */

function orientationHandler(e){

  if(
    !Number.isFinite(e.alpha)
    ||
    !Number.isFinite(e.beta)
    ||
    !Number.isFinite(e.gamma)
  ){
    return;
  }


  const alpha=
    rad(e.alpha);

  const beta=
    rad(e.beta);

  const gamma=
    rad(e.gamma);


  const ca=Math.cos(alpha);
  const sa=Math.sin(alpha);

  const cb=Math.cos(beta);
  const sb=Math.sin(beta);

  const cg=Math.cos(gamma);
  const sg=Math.sin(gamma);


  /* =====================================================
     PHONE FORWARD VECTOR
  ===================================================== */

  let x=0;
  let y=0;
  let z=-1;


  /* gamma */

  let x1=
    cg*x+
    sg*z;

  let y1=y;

  let z1=
    -sg*x+
    cg*z;


  /* beta */

  let x2=x1;

  let y2=
    cb*y1-
    sb*z1;

  let z2=
    sb*y1+
    cb*z1;


  /* alpha */

  let wx=
    ca*x2-
    sa*y2;

  let wy=
    sa*x2+
    ca*y2;

  let wz=z2;


  /* =====================================================
     SCREEN ROTATION
  ===================================================== */

  let screenAngle=0;


  if(
    screen.orientation
    &&
    typeof screen.orientation.angle==="number"
  ){

    screenAngle=
      screen.orientation.angle;

  }

  else if(
    typeof window.orientation==="number"
  ){

    screenAngle=
      window.orientation;

  }


  if(screenAngle!==0){

    const r=
      rad(
        -screenAngle
      );


    const c=
      Math.cos(r);

    const s=
      Math.sin(r);


    const nx=
      c*wx-
      s*wy;


    const ny=
      s*wx+
      c*wy;


    wx=nx;
    wy=ny;

  }


  /* =====================================================
     PITCH

     + = 上
      0 = 水平
     - = 下
  ===================================================== */

  const horizontal=
    Math.sqrt(
      wx*wx+
      wy*wy
    );


  const pitch=
    deg(
      Math.atan2(
        wz,
        horizontal
      )
    );


  targetPitch=
    clamp(
      pitch,
      -90,
      90
    );


  /* =====================================================
     YAW
  ===================================================== */

  let yaw=
    deg(
      Math.atan2(
        wx,
        -wy
      )
    );


  yaw=
    normalize360(
      yaw
    );


  /*
   iPhone absolute compass heading
  */

  if(
    typeof e.webkitCompassHeading==="number"
    &&
    Number.isFinite(
      e.webkitCompassHeading
    )
    &&
    horizontal>.15
  ){

    yaw=
      normalize360(
        e.webkitCompassHeading
      );

  }


  targetYaw=yaw;


  /*
   開始時を0にはしない。
  */

  if(!sensorReady){

    cameraYaw=
      targetYaw;

    cameraPitch=
      targetPitch;

    sensorReady=true;

  }

}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!running){
    return;
  }


  let dt=
    (
      time-
      lastTime
    )
    /
    1000;


  lastTime=time;


  dt=
    Math.min(
      dt,
      .05
    );


  /* =====================================================
     CAMERA SMOOTH
  ===================================================== */

  if(sensorReady){

    cameraYaw=
      smoothAngle(
        cameraYaw,
        targetYaw,
        YAW_SMOOTH
      );


    cameraPitch+=
      (
        targetPitch-
        cameraPitch
      )
      *
      PITCH_SMOOTH;

  }


  /* =====================================================
     LOCK
  ===================================================== */

  if(locked){

    const remaining=
      lockEnd-
      time;


    hp-=
      DAMAGE_PER_SECOND*
      dt;


    hp=
      Math.max(
        0,
        hp
      );


    updateHP();


    if(hp<=0){

      hp=0;

      updateHP();

      locked=false;

      running=false;


      lockText.textContent=
        "★ CAPTURED ★";


      lockText.style.display=
        "block";


      timer.style.display=
        "none";


      render(time);

      return;

    }


    if(remaining<=0){

      locked=false;


      lockText.style.display=
        "none";


      timer.style.display=
        "none";


      startEscape();

    }

    else{

      timer.textContent=
        (
          remaining/
          1000
        )
        .toFixed(1);

    }

  }


  /* =====================================================
     ESCAPE

     ★上下座標は変えない。
     ★右か左のみ。
  ===================================================== */

  else if(escaping){

    const move=
      escapeSpeed*
      dt;


    creatureYaw=
      normalize360(
        creatureYaw+
        escapeDirection*
        move
      );


    creaturePitch=
      creatureBasePitch;


    escapeTravel+=
      move;


    if(
      escapeTravel>=
      escapeDistance
    ){

      escaping=false;

    }

  }


  /* =====================================================
     CREATURE VISIBILITY
  ===================================================== */

  if(sensorReady){

    const dx=
      angleDiff(
        creatureYaw,
        cameraYaw
      );


    const dy=
      creaturePitch-
      cameraPitch;


    creatureVisible=

      Math.abs(dx)
      <
      HFOV/2

      &&

      Math.abs(dy)
      <
      VFOV/2;


    /*
     最初に画面へ入った瞬間に逃げる。
    */

    if(
      creatureVisible
      &&
      !discovered
    ){

      discovered=true;

      startEscape();

    }

  }


  render(time);


  requestAnimationFrame(
    loop
  );

}


/* =========================================================
   ESCAPE
========================================================= */

function startEscape(){

  discovered=true;

  escaping=true;

  escapeTravel=0;


  /*
   ★左右ランダム。
  */

  escapeDirection=
    Math.random()<.5
    ?
    -1
    :
    1;


  escapeSpeed=
    random(
      ESCAPE_SPEED_MIN,
      ESCAPE_SPEED_MAX
    );


  /*
   一度決まった方向へ
   55～160°逃げる。
  */

  escapeDistance=
    random(
      ESCAPE_DISTANCE_MIN,
      ESCAPE_DISTANCE_MAX
    );


  /*
   上下揺れだけ再設定。
  */

  creatureBobAmplitude=
    random(
      5,
      20
    );


  creatureBobPhase=
    random(
      0,
      Math.PI*2
    );


  creatureBobSpeed=
    random(
      .7,
      1.35
    );

}


/* =========================================================
   RENDER
========================================================= */

function render(time){

  drawWorld();

  drawCreature(time);


  let look="LEVEL";


  if(cameraPitch>8){
    look="UP";
  }

  else if(cameraPitch<-8){
    look="DOWN";
  }


  debug.innerHTML=

    "YAW: "
    +
    cameraYaw.toFixed(1)
    +
    "°"

    +

    "<br>PITCH: "
    +
    cameraPitch.toFixed(1)
    +
    "°"

    +

    "<br>LOOK: "
    +
    look

    +

    "<br>TYPE: "
    +
    creatureZone;

}


/* =========================================================
   WORLD
========================================================= */

function drawWorld(){

  /* SKY */

  ctx.fillStyle=
    "#639fbd";


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* =====================================================
     HORIZON

     上を見る
       → 地平線が下へ

     下を見る
       → 地平線が上へ
  ===================================================== */

  const horizon=

    H/2

    +

    (
      cameraPitch/
      (VFOV/2)
    )

    *

    (H/2);


  /* GROUND */

  if(horizon<H){

    const groundY=
      Math.max(
        0,
        Math.floor(horizon)
      );


    ctx.fillStyle=
      "#477a43";


    ctx.fillRect(
      0,
      groundY,
      W,
      H-groundY
    );


    drawGroundTexture(
      horizon
    );

  }


  drawSun();

  drawClouds();

  drawMountains();

  drawForest();

  drawCastle();

  drawLake();

  drawRuins();

  drawVillage();

  drawGroundObjects();

}


/* =========================================================
   WORLD PROJECTION

   ★★★ 左右修正版 ★★★

   dx > 0 の物体は、
   カメラを右へ向けたとき
   画面左へ流れるようにする。

   以前:
       W/2 + ...

   今回:
       W/2 - ...
========================================================= */

function projectWorld(
  yaw,
  pitch
){

  const dx=
    angleDiff(
      yaw,
      cameraYaw
    );


  const dy=
    pitch-
    cameraPitch;


  /* =====================================================
     ★左右反転修正
  ===================================================== */

  const x=

    W/2

    -

    (
      dx/
      (HFOV/2)
    )

    *

    (W/2);


  const y=

    H/2

    -

    (
      dy/
      (VFOV/2)
    )

    *

    (H/2);


  return{

    x,
    y,

    visible:

      Math.abs(dx)
      <
      HFOV*.75

      &&

      Math.abs(dy)
      <
      VFOV*.75

  };

}


/* =========================================================
   CREATURE PROJECTION

   ★★★ キャラ側も同じ左右修正 ★★★
========================================================= */

function projectCreature(
  yaw,
  pitch
){

  const dx=
    angleDiff(
      yaw,
      cameraYaw
    );


  const dy=
    pitch-
    cameraPitch;


  /* ★左右反転 */

  const x=

    W/2

    -

    (
      dx/
      (HFOV/2)
    )

    *

    (W/2);


  const y=

    H/2

    -

    (
      dy/
      (VFOV/2)
    )

    *

    (H/2);


  return{

    x,
    y,

    visible:

      Math.abs(dx)
      <
      HFOV*.60

      &&

      Math.abs(dy)
      <
      VFOV*.60

  };

}


/* =========================================================
   SUN
========================================================= */

function drawSun(){

  const p=
    projectWorld(
      330,
      48
    );


  if(!p.visible){
    return;
  }


  ctx.fillStyle=
    "#f2d16b";


  rect(
    p.x-9,
    p.y-9,
    18,
    18
  );


  rect(
    p.x-13,
    p.y-4,
    26,
    8
  );


  rect(
    p.x-4,
    p.y-13,
    8,
    26
  );

}


/* =========================================================
   CLOUDS
========================================================= */

function drawClouds(){

  const clouds=[

    [15,25,1],
    [55,48,.7],
    [95,32,.9],
    [140,62,.65],
    [180,37,1.1],
    [225,53,.8],
    [270,28,.9],
    [310,67,.7]

  ];


  for(const c of clouds){

    const p=
      projectWorld(
        c[0],
        c[1]
      );


    if(!p.visible){
      continue;
    }


    drawCloud(
      p.x,
      p.y,
      c[2]
    );

  }

}


function drawCloud(
  x,
  y,
  s
){

  ctx.fillStyle=
    "#dce8e2";


  rect(
    x-17*s,
    y,
    34*s,
    7*s
  );


  rect(
    x-10*s,
    y-6*s,
    21*s,
    7*s
  );


  rect(
    x-3*s,
    y-10*s,
    12*s,
    5*s
  );

}


/* =========================================================
   MOUNTAINS
========================================================= */

function drawMountains(){

  for(
    let yaw=0;
    yaw<360;
    yaw+=18
  ){

    const pitch=
      4+
      Math.abs(
        Math.sin(
          yaw*.13
        )
      )*5;


    const p=
      projectWorld(
        yaw,
        pitch
      );


    if(!p.visible){
      continue;
    }


    const s=
      .75+
      Math.abs(
        Math.sin(
          yaw*1.71
        )
      )*.7;


    ctx.fillStyle=
      "#596e67";


    triangle(
      p.x-32*s,
      p.y+22*s,

/* =========================================================
   GROUND OBJECTS
========================================================= */

function drawGroundObjects(){

  for(
    let yaw=0;
    yaw<360;
    yaw+=7
  ){

    const seed=
      Math.abs(
        Math.sin(
          yaw*7.913
        )
      );


    const pitch=
      -15-
      seed*73;


    const p=
      projectWorld(
        yaw,
        pitch
      );


    if(!p.visible){
      continue;
    }


    const scale=
      1+
      seed*1.4;


    if(seed>.78){

      drawFlower(
        p.x,
        p.y,
        scale
      );

    }

    else if(seed>.58){

      drawRock(
        p.x,
        p.y,
        scale
      );

    }

    else{

      drawGrass(
        p.x,
        p.y,
        scale
      );

    }

  }

}

/* =========================================================
   SHAKE
========================================================= */

function motionHandler(e){

  if(
    !running
    ||
    !creatureVisible
    ||
    locked
  ){
    return;
  }


  const a=
    e.accelerationIncludingGravity;


  if(!a){
    return;
  }


  const x=a.x||0;
  const y=a.y||0;
  const z=a.z||0;


  const magnitude=
    Math.sqrt(
      x*x+
      y*y+
      z*z
    );


  const shake=
    Math.abs(
      magnitude-
      9.81
    );


  if(
    shake<
    SHAKE_THRESHOLD
  ){
    return;
  }


  const now=
    performance.now();


  if(
    now-lastShake<
    500
  ){
    return;
  }


  lastShake=now;


  lockCreature(
    shake
  );

}


/* =========================================================
   LOCK
========================================================= */

function lockCreature(power){

  if(
    !creatureVisible
    ||
    locked
  ){
    return;
  }


  locked=true;

  escaping=false;


  let seconds=

    MIN_LOCK

    +

    (
      power-
      SHAKE_THRESHOLD
    )

    *.35;


  seconds=
    clamp(
      seconds,
      MIN_LOCK,
      MAX_LOCK
    );


  lockEnd=
    performance.now()
    +
    seconds*1000;


  lockText.textContent=
    "⚡ LOCK!";


  lockText.style.display=
    "block";


  timer.style.display=
    "block";


  timer.textContent=
    seconds.toFixed(1);


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [
        70,
        40,
        120
      ]
    );

  }

}

/* =========================================================
   PIXEL HELPERS
========================================================= */

function rect(
  x,
  y,
  w,
  h
){

  ctx.fillRect(

    Math.round(x),

    Math.round(y),

    Math.max(
      1,
      Math.round(w)
    ),

    Math.max(
      1,
      Math.round(h)
    )

  );

}


function triangle(
  x,
  y,
  w,
  h
){

  ctx.beginPath();


  ctx.moveTo(
    Math.round(x),
    Math.round(y)
  );


  ctx.lineTo(
    Math.round(
      x+w/2
    ),
    Math.round(
      y-h
    )
  );


  ctx.lineTo(
    Math.round(
      x+w
    ),
    Math.round(y)
  );


  ctx.closePath();

  ctx.fill();

}
